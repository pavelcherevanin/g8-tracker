});

// ── Export JSON (backup): все сезоны ─────────────────────────────────────────
function exportJSON() {
  const payload = { version: 2, exportedAt: new Date().toISOString(), seasons: db.seasons };
  downloadBlob(JSON.stringify(payload, null, 2), 'application/json;charset=utf-8', `g8-tracker-backup-${new Date().toISOString().slice(0,10)}.json`);
}

function describeSeasons(seasons) {
  const names = [...seasons].map(s => String(s.name)).sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));
  return `${seasons.length} ${plural(seasons.length, 'сезон', 'сезона', 'сезонов')} (${names.map(esc).join(', ')})`;
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      let data;
      try { data = JSON.parse(ev.target.result); }
      catch (err) { showAlert('Ошибка чтения файла', 'Файл повреждён или это не JSON.'); return; }
      importBackupData(data);
    };
    reader.readAsText(file);
  };
  input.click();
}

// Новый формат ({seasons}) заменяет все сезоны; старый ({blocks}) загружается в текущий сезон
function importBackupData(data) {
  if (isValidDb(data)) {
    showConfirm(
      `Загрузить резервную копию со всеми сезонами?<br><span class="modal-sub">Сейчас: ${describeSeasons(db.seasons)}.<br>В файле: ${describeSeasons(data.seasons)}.<br>Текущие данные будут заменены.</span>`,
      () => {
        const prevId = state.id, prevName = state.name;
        db = normalizeDb(JSON.parse(JSON.stringify(data)));
        state = db.seasons.find(s => s.id === prevId) || db.seasons.find(s => s.name === prevName) || sortedSeasons()[sortedSeasons().length - 1];
        lsSet(SEASON_KEY, state.id);
        undoStacks.clear();
        expandedTasks.clear();
        openHistories.clear();
        applySeasonView();
        persist();
        renderAll();
        renderSeasonMenu();
        showToast(`Загружено: ${describeSeasons(db.seasons)}`, null);
      },
      { title: 'Восстановить из копии', confirmText: 'Загрузить' }
    );
    return;
  }
  if (data && Array.isArray(data.blocks)) {
    showConfirm(
      `Загрузить резервную копию в <strong>${esc(seasonLabel(state))}</strong>?<br><span class="modal-sub">Файл старого формата — один набор блоков. Данные текущего сезона будут заменены (${state.blocks.length} → ${data.blocks.length} ${plural(data.blocks.length, 'блок', 'блока', 'блоков')}). Другие сезоны не изменятся.</span>`,
      () => {
        pushUndo();
        state.blocks = sanitizeBlocks(JSON.parse(JSON.stringify(data.blocks)));
        expandedTasks.clear();
        openHistories.clear();
        applySeasonView();
        persist();
        renderAll();
        showToast(`Копия загружена в ${seasonLabel(state)}`);
      },
      { title: 'Восстановить из копии', confirmText: 'Загрузить' }
    );
    return;
  }
  showAlert('Файл не подходит', 'Это не резервная копия G8 Tracker.');
}


// ── Print / PDF ───────────────────────────────────────────────────────────────
function populatePrintArea(scope) {
  const area = document.getElementById('print-area');
  const focus = scope === 'block' && view.mode === 'block' ? state.blocks.find(b => b.id === view.block) : null;
  const blocks = focus ? [focus] : state.blocks;
  const now = new Date();
  const dateStr = now.toLocaleString('ru', { dateStyle: 'short', timeStyle: 'short' });
  document.title = `G8 Tracker — ${seasonLabel(state)}${focus ? ` — ${focus.title || 'блок'}` : ''} — ${now.toLocaleDateString('ru', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;
  const total = blocks.reduce((a, b) => a + b.directions.reduce((x, d) => x + d.tasks.length, 0), 0);
  let html = `<header class="pr-header">
    <span class="pr-logo">G8</span><span class="pr-word">TRACKER</span>
    <span class="pr-season">${esc(seasonLabel(state))}</span>
    <span class="pr-scope">${focus ? `Блок: ${esc(focus.title || 'Без названия')}` : 'Вся карта'} · ${countLabel(total)}</span>
    <span class="pr-meta">
      <span class="pr-legend"><span class="pr-mark"></span>в работе</span>
      <span class="pr-legend"><span class="pr-mark is-done">✓</span>завершена</span>
      <span>${esc(dateStr)}</span>
    </span>
  </header>`;
  blocks.forEach(b => {
    const color = blockColorOf(b);
    const c = getBlockColors(color);
    const bt = b.directions.reduce((a, d) => a + d.tasks.length, 0);
    html += `<section class="pr-block">
      <div class="pr-block-head" style="background:${color};color:${c.text}"><span class="pr-block-title">${esc(b.title || 'Без названия')}</span><span class="pr-count">${countLabel(bt)}</span></div>`;
    if (!b.directions.length) html += `<div class="pr-empty">Нет направлений</div>`;
    b.directions.forEach(d => {
      html += `<div class="pr-dir"><div class="pr-dir-head"><span class="pr-dir-title">${esc(d.title || '(без названия)')}</span><span class="pr-count">${countLabel(d.tasks.length)}</span></div>`;
      if (d.description && d.description.trim()) html += `<div class="pr-desc">${esc(d.description)}</div>`;
      if (!d.tasks.length) html += `<div class="pr-empty">Нет задач</div>`;
      d.tasks.forEach(t => {
        const log = taskComments(t.log);
        const last = log[log.length - 1];
        const aside = [];
        if ((t.responsible || []).length) aside.push(esc(t.responsible.join(', ')));
        if (t.deadline) aside.push(esc(formatShortDate(t.deadline)));
        html += `<div class="pr-task st-${t.status}">
          <span class="pr-mark">${t.status === 'done' ? '✓' : ''}</span>
          <div class="pr-task-body">
            <div class="pr-task-line"><span class="pr-task-text">${esc(t.text || '(без текста)')}</span>${aside.length ? `<span class="pr-aside">${aside.join(' · ')}</span>` : ''}</div>
            ${last ? `<div class="pr-note">${esc(String(last.text || '').replace(/\s*\n\s*/g, ' '))}${log.length > 1 ? `<span class="pr-more">+${log.length - 1}</span>` : ''}</div>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</section>`;
  });
  if (!blocks.length) html += `<div class="pr-empty">В сезоне нет блоков.</div>`;
  area.innerHTML = html;
}

window.addEventListener('beforeprint', () => {
  const area = document.getElementById('print-area');
  if (area && !area.innerHTML.trim()) populatePrintArea(view.mode === 'block' ? 'block' : 'all');
});
window.addEventListener('afterprint', () => {
  document.title = 'G8 Tracker';
  const area = document.getElementById('print-area');
  if (area) area.innerHTML = '';
});

function printPDF(scope = 'all') {
  if (scope === 'block' && view.mode !== 'block') return;
  populatePrintArea(scope);
  window.print();
}

// ── Сезоны ────────────────────────────────────────────────────────────────────
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function seasonLabel(s) {
  const name = String((s && s.name) || '').trim();
  return name.toLowerCase().startsWith('сезон') ? name : `Сезон ${name}`;
}
function sortedSeasons() {
  return [...db.seasons].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ru', { numeric: true }));
}
function seasonStats(s) {
  let dirs = 0, tasks = 0;
  s.blocks.forEach(b => { dirs += b.directions.length; b.directions.forEach(d => { tasks += d.tasks.length; }); });
  return { blocks: s.blocks.length, dirs, tasks };
}
function renderSeasonPill() {
  const el = document.getElementById('season-pill-label');
  if (el) el.textContent = seasonLabel(state);
  document.getElementById('season-pill')?.setAttribute('title', seasonLabel(state));
}
function isSeasonMenuOpen() { return !!document.getElementById('season-wrap')?.classList.contains('open'); }
function toggleSeasonMenu() { isSeasonMenuOpen() ? closeSeasonMenu() : openSeasonMenu(); }
function openSeasonMenu() {
  closeExportMenu();
  closeFilterMenu();
  closeColorPalette();
  renderSeasonMenu();
  document.getElementById('season-wrap').classList.add('open');
  document.getElementById('season-pill').setAttribute('aria-expanded', 'true');
}
function closeSeasonMenu(restoreFocus) {
  const wrap = document.getElementById('season-wrap');
  if (!wrap || !wrap.classList.contains('open')) return;
  wrap.classList.remove('open');
  const pill = document.getElementById('season-pill');
  pill.setAttribute('aria-expanded', 'false');
  if (restoreFocus) pill.focus();
}
function renderSeasonMenu() {
  const menu = document.getElementById('season-menu');
  if (!menu) return;
  const only = db.seasons.length <= 1;
  menu.innerHTML = `
    <div class="season-menu-head">Сезоны</div>
    <div class="season-list">
    ${sortedSeasons().map(s => {
      const cur = s.id === state.id;
      const st = seasonStats(s);
      return `<div class="season-item${cur ? ' active' : ''}">
        <button type="button" class="season-item-main" role="menuitemradio" aria-checked="${cur}" onclick="switchSeason('${s.id}')">
          <span class="season-check">${cur ? ICONS.check : ''}</span>
          <span class="season-item-name">${esc(seasonLabel(s))}</span>
          <span class="season-item-meta">${st.tasks} ${plural(st.tasks, 'задача', 'задачи', 'задач')}</span>
        </button>
        <span class="season-item-actions">
          <button type="button" class="season-icon-btn" title="Переименовать" aria-label="Переименовать: ${esc(seasonLabel(s))}" onclick="openRenameSeasonDialog('${s.id}')">${ICONS.pencil}</button>
          <button type="button" class="season-icon-btn danger${only ? ' is-disabled' : ''}" aria-disabled="${only}" title="${only ? 'Единственный сезон удалить нельзя' : 'Удалить сезон'}" aria-label="Удалить: ${esc(seasonLabel(s))}" onclick="deleteSeason('${s.id}')">${ICONS.trash}</button>
        </span>
      </div>`;
    }).join('')}
    </div>
    <button type="button" class="season-new-btn" onclick="openNewSeasonDialog()">${ICONS.plus}<span>Новый сезон</span></button>`;
}

function switchSeason(id) {
  const next = db.seasons.find(s => s.id === id);
  closeSeasonMenu();
  if (!next || next === state) return;
  const prevFocus = view.mode === 'block' ? state.blocks.find(b => b.id === view.block) : null;
  state = next;
  lsSet(SEASON_KEY, state.id);
  expandedTasks.clear();
  openHistories.clear();
  hideToast();
  closeColorPalette();
  const visited = !!viewStore[state.id];
  applySeasonView();
  if (!visited && prevFocus) {
    // впервые открытый сезон: фокус на блоке с тем же названием, если он есть
    const same = (a, b) => normText(a).trim() === normText(b).trim();
    const nb = state.blocks.find(b => same(b.title, prevFocus.title));
    if (nb) view = { mode: 'block', block: nb.id };
  }
  saveView();
  if (filter.responsible !== 'all' && !getAllResponsibles().includes(filter.responsible)) filter.responsible = 'all';
  renderAll();
  feedPanel().scrollTop = 0;
}

function suggestSeasonName() {
  const years = db.seasons.map(s => String(s.name).trim()).filter(n => /^\d{4}$/.test(n)).map(Number);
  let n = years.length ? Math.max(...years) + 1 : new Date().getFullYear() + 1;
  while (validateSeasonName(String(n))) n++;
  return String(n);
}
function validateSeasonName(name, exceptId) {
  if (!name) return 'Введите год или название сезона';
  if (name.length > 40) return 'Название не длиннее 40 символов';
  const key = n => normText(n).trim().replace(/^сезон\s+/, '');
  if (db.seasons.some(s => s.id !== exceptId && key(s.name) === key(name))) return 'Такой сезон уже есть';
  return '';
}
function copyStructure(blocks) {
  return blocks.map(b => ({
    id: genId(), title: b.title, collapsed: b.collapsed, color: b.color,
    directions: b.directions.map(d => ({ id: genId(), title: d.title, description: d.description || '', collapsed: d.collapsed, tasks: [] }))
  }));
}
function openNewSeasonDialog() {
  if (!editMode) return;
  closeSeasonMenu();
  const st = seasonStats(state);
  openModal({
    title: 'Новый сезон',
    body: `
      <label class="form-label" for="season-name-input">Год или название</label>
      <input class="form-input" id="season-name-input" maxlength="40" autocomplete="off" value="${esc(suggestSeasonName())}">
      <div class="form-error" id="form-error" role="alert"></div>
      <div class="form-label">Содержимое</div>
      <label class="form-choice">
        <input type="radio" name="season-mode" value="copy" checked>
        <span class="form-choice-text"><b>Скопировать структуру из «${esc(seasonLabel(state))}»</b>
          <small>${st.blocks} ${plural(st.blocks, 'блок', 'блока', 'блоков')} и ${st.dirs} ${plural(st.dirs, 'направление', 'направления', 'направлений')} с цветами — без задач</small></span>
      </label>
      <label class="form-choice">
        <input type="radio" name="season-mode" value="empty">
        <span class="form-choice-text"><b>Пустой</b><small>без блоков и направлений</small></span>
      </label>`,
    confirmText: 'Создать сезон',
    onOpen: () => { const i = document.getElementById('season-name-input'); if (i) { i.focus(); i.select(); } },
    onConfirm: () => {
      const inp = document.getElementById('season-name-input');
      const name = (inp ? inp.value : '').trim();
      const err = validateSeasonName(name);
      if (err) { showFormError(err); if (inp) inp.focus(); return false; }
      const mode = document.querySelector('input[name="season-mode"]:checked')?.value || 'copy';
      createSeason(name, mode);
      return true;
    }
  });
}
function createSeason(name, mode) {
  const season = { id: genSeasonId(), name, blocks: mode === 'empty' ? [] : copyStructure(state.blocks) };
  db.seasons.push(season);
  persist();
  switchSeason(season.id);
}
function openRenameSeasonDialog(id) {
  if (!editMode) return;
  const s = db.seasons.find(s => s.id === id);
  if (!s) return;
  closeSeasonMenu();
  openModal({
    title: 'Переименовать сезон',
    body: `<label class="form-label" for="season-name-input">Год или название</label>
      <input class="form-input" id="season-name-input" maxlength="40" autocomplete="off" value="${esc(s.name)}">
      <div class="form-error" id="form-error" role="alert"></div>`,
    confirmText: 'Сохранить',

    onConfirm: () => {

}
function deleteSeason(id) {
  if (!editMode || db.seasons.length <= 1) return;
  const s = db.seasons.find(s => s.id === id);
  if (!s) return;
  closeSeasonMenu();
  const st = seasonStats(s);
  showConfirm(
    `Удалить <strong>${esc(seasonLabel(s))}</strong>?<br><span class="modal-sub">${st.blocks} ${plural(st.blocks, 'блок', 'блока', 'блоков')}, ${st.dirs} ${plural(st.dirs, 'направление', 'направления', 'направлений')} и ${st.tasks} ${plural(st.tasks, 'задача', 'задачи', 'задач')} этого сезона будут удалены. Другие сезоны не изменятся.</span>`,
    () => {
      const idx = db.seasons.indexOf(s);
      if (idx === -1 || db.seasons.length <= 1) return;
      const order = sortedSeasons();
      const pos = order.indexOf(s);
      db.seasons.splice(idx, 1);
      undoStacks.delete(s.id);
      delete viewStore[s.id];
      lsSet(VIEW_KEY, JSON.stringify(viewStore));
      if (state === s) {
        state = order[pos + 1] || order[pos - 1];
        lsSet(SEASON_KEY, state.id);
        expandedTasks.clear();
        openHistories.clear();
        applySeasonView();
      }
      persist();
      renderAll();
      renderSeasonMenu();
      showToast(`${seasonLabel(s)} удалён`, () => restoreDeletedSeason(s, idx));
    },
    { title: 'Удалить сезон', confirmText: 'Удалить сезон' }
  );
}
function restoreDeletedSeason(s, idx) {
  if (db.seasons.some(x => x.id === s.id)) return;
  db.seasons.splice(Math.min(idx, db.seasons.length), 0, s);
  persist();
  switchSeason(s.id);
  renderSeasonMenu();
}

// ── Ширина левой колонки ──────────────────────────────────────────────────────
const PANEL_W_DEFAULT = 264;
const PANEL_W_MIN = 180;
const PANEL_W_MAX = 480;
function clampPanelW(w) { return Math.min(PANEL_W_MAX, Math.max(PANEL_W_MIN, Math.round(w))); }
function isMobileLayout() { return window.matchMedia('(max-width: 700px)').matches; }
function applyPanelWidth(w) {
  const v = clampPanelW(w);
  document.documentElement.style.setProperty('--panel-w', v + 'px');
  document.getElementById('panel-resizer')?.setAttribute('aria-valuenow', String(v));
  return v;
}
function resetPanelWidth() {
  applyPanelWidth(PANEL_W_DEFAULT);
  lsRemove(PANEL_W_KEY);
}
function initPanelResizer() {
  const saved = parseInt(lsGet(PANEL_W_KEY), 10);
  applyPanelWidth(Number.isFinite(saved) ? saved : PANEL_W_DEFAULT);
  const handle = document.getElementById('panel-resizer');
  if (!handle) return;
  let startX = 0, startW = 0, pendingW = 0, raf = 0, dragging = false;
  const currentW = () => document.getElementById('left-panel').getBoundingClientRect().width;
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0 || isMobileLayout()) return;
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startW = pendingW = currentW();
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    document.body.classList.add('is-resizing');
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    pendingW = clampPanelW(startW + e.clientX - startX);
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; applyPanelWidth(pendingW); });
  });
  const finish = () => {
    if (!dragging) return;
    dragging = false;
    cancelAnimationFrame(raf);
    raf = 0;
    document.body.classList.remove('is-resizing');
    if (Math.round(pendingW) !== Math.round(startW)) lsSet(PANEL_W_KEY, String(applyPanelWidth(pendingW)));
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
  handle.addEventListener('lostpointercapture', finish);
  handle.addEventListener('dblclick', () => { if (!isMobileLayout()) resetPanelWidth(); });
  handle.addEventListener('keydown', e => {
    if (e.key === 'Home') { e.preventDefault(); resetPanelWidth(); return; }
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    lsSet(PANEL_W_KEY, String(applyPanelWidth(currentW() + (e.key === 'ArrowRight' ? 16 : -16))));
  });
}

    cb: [...foldBlocks].filter(id => blockIds.has(id)),

function goToDirection(blockId, dirId) {

  if (foldBlocks.has(blockId)) { foldBlocks.delete(blockId); changed = true; }

// «Свернуть всё» сворачивает направления (видна структура карты), «Развернуть всё» раскрывает блоки и направления

  renderRightPanel();

// ── Поиск по карте ───────────────────────────────────────────────────────────
let searchMatches = [];
let searchIdx = -1;
function runSearch(q) {
  if (q === searchQuery) return;
  searchQuery = q;
  // поиск всегда идёт по всему сезону
  if (q && view.mode === 'block') { view = { mode: 'all', block: null }; saveView(); }
  renderAll();
  if (q) gotoMatch(0);
  else updateSearchCount();
}
function collectMatches(keepIndex) {
  const prev = searchIdx;
  searchMatches = searchQuery ? [...document.querySelectorAll('#map-feed .is-match')] : [];
  searchIdx = searchMatches.length ? Math.min(Math.max(keepIndex ? prev : 0, 0), searchMatches.length - 1) : -1;
  searchMatches.forEach((el, k) => el.classList.toggle('is-current-match', k === searchIdx && keepIndex));
  updateSearchCount();
}
function gotoMatch(i) {
  if (!searchMatches.length) { searchIdx = -1; updateSearchCount(); return; }
  searchIdx = ((i % searchMatches.length) + searchMatches.length) % searchMatches.length;
  searchMatches.forEach((el, k) => el.classList.toggle('is-current-match', k === searchIdx));
  const el = searchMatches[searchIdx];
  if (el.classList.contains('task-wrapper')) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  else el.closest('.map-dir, .map-block')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  updateSearchCount();
}
function updateSearchCount() {
  const el = document.getElementById('search-count');
  if (!el) return;
  if (!searchQuery) { el.textContent = ''; el.classList.remove('is-zero'); return; }
  el.textContent = searchMatches.length ? `${searchIdx + 1} / ${searchMatches.length}` : 'нет';
  el.classList.toggle('is-zero', !searchMatches.length);
}
function searchKeyDown(e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const q = e.target.value.trim();
  if (q !== searchQuery) { clearTimeout(searchTimer); runSearch(q); return; }
  if (searchQuery) gotoMatch(searchIdx + (e.shiftKey ? -1 : 1));
}
function blockMatchesSearch(b) {
  const tokens = searchTokens();
  return tokens.length > 0 && tokens.every(tk => normText(b.title).includes(tk));
}
function dirMatchesSearch(d) {
  const tokens = searchTokens();
  if (!tokens.length) return false;
  const hay = normText(`${d.title}\n${d.description || ''}`);
  return tokens.every(tk => hay.includes(tk));
}

// ── Scroll-spy: какое направление сейчас на экране ──────────────────────────
let spyRaf = 0;
function updateSpy() {
  const panel = feedPanel();
  if (!panel) return;
  const dirs = panel.querySelectorAll('.map-block:not(.is-collapsed) .map-dir');
  if (!dirs.length) { setSpy(null); return; }
  if (spyLock && Date.now() < spyLock.until && document.querySelector(`.map-dir[data-feed-dir="${spyLock.dirId}"]`)) { setSpy(spyLock.dirId); return; }
  spyLock = null;
  const line = panel.getBoundingClientRect().top + 76;
  let cur = dirs[0];
  for (const el of dirs) {
    if (el.getBoundingClientRect().top <= line) cur = el; else break;
  }
  setSpy(cur.dataset.feedDir);
}
function setSpy(dirId) {
  if (spyDirId === dirId && (!dirId || document.querySelector(`.toc-dir[data-dir="${dirId}"].is-current`))) return;
  spyDirId = dirId;
  document.querySelectorAll('.toc-dir.is-current').forEach(e => e.classList.remove('is-current'));
  if (!dirId) return;
  const t = document.querySelector(`.toc-dir[data-dir="${dirId}"]`);
  if (!t) return;
  t.classList.add('is-current');
  const nav = document.getElementById('nav-scroll');
  if (!nav || tocFold.has(t.closest('.toc-block')?.dataset.block)) return;
  const nr = nav.getBoundingClientRect(), tr = t.getBoundingClientRect();
  // для первого направления блока показываем и заголовок блока
  const blockRow = t.parentElement.firstElementChild === t ? t.closest('.toc-block')?.querySelector('.toc-block-row') : null;
  const topRef = blockRow ? blockRow.getBoundingClientRect().top : tr.top;
  if (topRef < nr.top + 6) nav.scrollTop -= (nr.top + 6 - topRef);
  else if (tr.bottom > nr.bottom - 8) nav.scrollTop += (tr.bottom - nr.bottom + 8);
}
function initFeedScroll() {
  const panel = feedPanel();
  panel.addEventListener('scroll', () => {
    if (!spyRaf) spyRaf = requestAnimationFrame(() => { spyRaf = 0; updateSpy(); });
  }, { passive: true });
  const release = () => { spyLock = null; };
  panel.addEventListener('wheel', release, { passive: true });
  panel.addEventListener('touchstart', release, { passive: true });
}

function closeMobileMenu() {
  document.getElementById('left-panel')?.classList.remove('mobile-open');

}

// ── Оглавление ───────────────────────────────────────────────────────────────
function renderNav() {
  const nav = document.getElementById('nav-scroll');
  if (!nav) return;
  const dimOn = filtersActive();
  let html = `<div class="nav-blocks-container" ondragover="blocksListDragOver(event)" ondrop="blocksListDrop(event)">`;
  state.blocks.forEach(block => {
    const color = blockColorOf(block);
    const isFocus = view.mode === 'block' && view.block === block.id;
    const folded = tocFold.has(block.id);
    html += `<div class="toc-block${folded ? ' is-toc-collapsed' : ''}" data-block="${block.id}" draggable="${editMode}" ondragstart="blockDragStart(event,'${block.id}')" ondragend="blockDragEnd(event,'${block.id}')">
      <div class="toc-block-row${isFocus ? ' is-focus' : ''}" onclick="focusBlock('${block.id}')" onkeydown="if(event.key==='Enter'&&event.target===this)focusBlock('${block.id}')" tabindex="0" role="button" title="Показать только этот блок"${isFocus ? ' aria-current="true"' : ''}>
        <button type="button" class="toc-chev" aria-label="Свернуть в оглавлении" aria-expanded="${!folded}" onclick="event.stopPropagation();toggleTocBlock('${block.id}')">${ICONS.chevronDown}</button>
        ${editMode
          ? `<button type="button" class="toc-color-btn" style="--bc:${color}" title="Цвет блока" aria-label="Цвет блока" onclick="event.stopPropagation();openColorPalette('${block.id}',this)"></button>`
          : `<span class="toc-square" style="--bc:${color}"></span>`}
        <span class="toc-block-name">${block.title ? esc(block.title) : '<span class="toc-untitled">Без названия</span>'}</span>
        <span class="block-drag-handle" aria-hidden="true">${ICONS.grip}</span>
      </div>
      <div class="toc-dirs nav-dirs" data-block-dirs="${block.id}" ondragover="dirsListDragOver(event,'${block.id}')" ondrop="dirsListDrop(event,'${block.id}')">`;
    block.directions.forEach(dir => {
      const dim = dimOn && !dir.tasks.some(t => taskMatchesFilter(t));
      html += `<div class="toc-dir${spyDirId === dir.id ? ' is-current' : ''}${dim ? ' is-dim' : ''}" data-dir="${dir.id}" draggable="${editMode}"
          ondragstart="dirDragStart(event,'${block.id}','${dir.id}')" ondragend="dirDragEnd(event,'${block.id}','${dir.id}')"
          onclick="goToDirection('${block.id}','${dir.id}')" onkeydown="if(event.key==='Enter'&&event.target===this)goToDirection('${block.id}','${dir.id}')"
          tabindex="0" role="link">
        <span class="dir-drag-handle" aria-hidden="true">${ICONS.grip}</span>
        <span class="toc-dir-name">${dir.title ? esc(dir.title) : '<span class="toc-untitled">Без названия</span>'}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  if (!state.blocks.length) html += `<div class="nav-empty">В этом сезоне пока нет блоков.${editMode ? ' Добавьте первый блок в конце карты.' : ' Откройте замок, чтобы добавить.'}</div>`;
  nav.innerHTML = html;
}

// ── Лента ────────────────────────────────────────────────────────────────────
function countLabel(n) { return `${n} ${plural(n, 'задача', 'задачи', 'задач')}`; }
function renderRightPanel() {
  const panel = feedPanel();
  if (!panel) return;
  const keepTop = panel.scrollTop;
  if (view.mode === 'block' && !state.blocks.some(b => b.id === view.block)) { view = { mode: 'all', block: null }; saveView(); }
  const filtering = filtersActive();
  const searching = searchTokens().length > 0;
  const editAttrs = handler => editMode
    ? ` contenteditable="true" spellcheck="false" onkeydown="editableKeyDown(event)" onpaste="plainPaste(event)" onblur="editableBlur(this)" oninput="${handler}"`
    : '';
  let html = `<div class="map-feed" id="map-feed">`;
  if (view.mode === 'block') {
    const fb = state.blocks.find(b => b.id === view.block);
    html += `<div class="focus-bar">
      <button type="button" class="focus-back" onclick="showAllMap('${fb.id}')" title="Вся карта (Esc)">${ICONS.arrowLeft}<span>Вся карта</span></button>
      <span class="focus-sep">/</span>
      <span class="focus-name" id="focus-name" style="--bc:${blockColorOf(fb)}">${fb.title ? esc(fb.title) : 'Без названия'}</span>
    </div>`;
  }
  let shownTasks = 0, totalTasks = 0;
  const blocks = scopeBlocks();
  let blocksHtml = '';
  blocks.forEach(block => {
    const color = blockColorOf(block);
    const c = getBlockColors(color);
    const blockTotal = block.directions.reduce((a, d) => a + d.tasks.length, 0);
    totalTasks += blockTotal;
    const dirsData = block.directions.map(d => ({ d, tasks: filtering ? d.tasks.filter(t => taskMatchesFilter(t)) : d.tasks }));
    const visibleDirs = filtering ? dirsData.filter(x => x.tasks.length) : dirsData;
    const blockShown = visibleDirs.reduce((a, x) => a + x.tasks.length, 0);
    shownTasks += blockShown;
    if (filtering && !visibleDirs.length && view.mode !== 'block') return;
    const blockSearchHit = searching && blockMatchesSearch(block);
    const blockHasHits = searching && (blockSearchHit || dirsData.some(x => dirMatchesSearch(x.d) || x.tasks.some(t => taskMatchesSearch(t))));
    const blockFolded = foldBlocks.has(block.id) && !blockHasHits;
    blocksHtml += `<section class="map-block${blockFolded ? ' is-collapsed' : ''}" data-feed-block="${block.id}" style="--bc:${color};--bt:${c.text}">
      <div class="block-sticky">
        <div class="block-plate${blockSearchHit ? ' is-match' : ''}" onclick="plateClick(event,'${block.id}')">
          <button type="button" class="plate-chev" aria-label="Свернуть блок" aria-expanded="${!blockFolded}" onclick="toggleFoldBlock('${block.id}')">${ICONS.chevronDown}</button>
          <span class="plate-title" data-placeholder="Название блока"${editAttrs(`updateBlockTitle('${block.id}',this.textContent)`)}>${hl(block.title)}</span>
          <span class="plate-count">${filtering ? `${blockShown} из ${blockTotal}` : countLabel(blockTotal)}</span>
          <span class="plate-actions edit-only">
            <button type="button" class="plate-btn" title="Цвет блока" aria-label="Цвет блока" onclick="openColorPalette('${block.id}',this)">${ICONS.drop}</button>
            <button type="button" class="plate-btn" title="Удалить блок" aria-label="Удалить блок" onclick="removeBlock('${block.id}')">${ICONS.trash}</button>
          </span>
        </div>
      </div>
      <div class="block-body">`;
    if (!visibleDirs.length) {
      blocksHtml += `<div class="dir-empty" style="padding-top:10px">${filtering ? 'Нет задач по фильтру' : 'В блоке пока нет направлений'}</div>`;
    }
    visibleDirs.forEach(({ d, tasks }) => {
      const dirHit = searching && dirMatchesSearch(d);
      const dirHasHits = searching && (dirHit || tasks.some(t => taskMatchesSearch(t)));
      const dirFolded = foldDirs.has(d.id) && !dirHasHits;
      const hasDesc = !!(d.description && d.description.trim());
      blocksHtml += `<section class="map-dir${dirFolded ? ' is-collapsed' : ''}" data-feed-dir="${d.id}" data-block-id="${block.id}">
        <div class="dir-header${dirHit ? ' is-match' : ''}" onclick="dirHeaderClick(event,'${d.id}')">
          <button type="button" class="dir-chev" aria-label="Свернуть направление" aria-expanded="${!dirFolded}" onclick="toggleFoldDir('${d.id}')">${ICONS.chevronDown}</button>
          <span class="dir-title" data-placeholder="Название направления"${editAttrs(`updateDirectionTitle('${block.id}','${d.id}',this.textContent)`)}>${hl(d.title)}</span>
          <span class="dir-count">${filtering ? `${tasks.length} из ${d.tasks.length}` : countLabel(d.tasks.length)}</span>
          <span class="dir-actions edit-only">
            ${hasDesc ? '' : `<button type="button" class="mini-btn" title="Добавить описание" onclick="addDirDescription('${block.id}','${d.id}')">${ICONS.plus}<span>описание</span></button>`}
            <button type="button" class="mini-btn danger" title="Удалить направление" aria-label="Удалить направление" onclick="removeDirection('${block.id}','${d.id}')">${ICONS.trash}</button>
          </span>
        </div>
        ${hasDesc ? `<div class="dir-desc" data-placeholder="Описание"${editAttrs(`updateDirDescription('${block.id}','${d.id}',this.textContent)`)}>${hl(d.description)}</div>` : ''}
        <div class="dir-body">`;
      if (!tasks.length && !editMode) {
        blocksHtml += `<div class="dir-empty">Нет задач</div>`;
      } else {
        blocksHtml += `<div class="task-list${tasks.length ? '' : ' is-empty'}" ondragover="listDragOver(event,'${d.id}')" ondrop="listDrop(event,'${block.id}','${d.id}')">
          ${tasks.map(t => renderTaskRow(block.id, d.id, t)).join('')}
          <button type="button" class="add-row edit-only" onclick="addTask('${block.id}','${d.id}')">${ICONS.plus}<span>задача</span></button>
        </div>`;
      }
      blocksHtml += `</div></section>`;
    });
    blocksHtml += `<button type="button" class="add-dir-btn edit-only" onclick="addDirection('${block.id}')">${ICONS.plus}<span>направление</span></button>
      </div>
    </section>`;
  });
  if (filtering) {
    const parts = [];
    if (filter.status !== 'all') parts.push(`<b>${esc((FILTER_STATUSES.find(s => s.key === filter.status) || {}).label || '')}</b>`);
    if (filter.responsible !== 'all') parts.push(`<b>${esc(filter.responsible)}</b>`);
    html += `<div class="filter-note">Фильтр: ${parts.join(' · ')} — показано ${shownTasks} из ${totalTasks} <button type="button" class="link-btn" onclick="resetFilter()">Сбросить</button></div>`;
  }
  html += blocksHtml;
  if (!state.blocks.length) {
    html += `<div class="map-empty">В этом сезоне пока нет блоков.${editMode ? '' : ' Откройте замок, чтобы добавить.'}</div>`;
  } else if (filtering && !shownTasks && view.mode !== 'block') {
    html += `<div class="map-empty">Нет задач, подходящих под фильтр.</div>`;
  }
  if (view.mode === 'all') html += `<button type="button" class="add-block-btn edit-only" onclick="addBlock()">${ICONS.plus}<span>блок</span></button>`;
  html += `</div>`;
  panel.innerHTML = html;
  panel.scrollTop = keepTop;
  collectMatches(true);
  updateSpy();
}

// последний комментарий в строку; при поиске — последний подходящий
function rowCommentHtml(log) {
  const comments = taskComments(log);
  if (!comments.length) return '';
  let idx = comments.length - 1;
  const tokens = searchTokens();
  if (tokens.length && !tokens.some(tk => normText(comments[idx].text).includes(tk))) {
    for (let i = comments.length - 2; i >= 0; i--) {
      if (tokens.some(tk => normText(comments[i].text).includes(tk))) { idx = i; break; }
    }
  }
  const text = String(comments[idx].text || '').replace(/\s*\n\s*/g, ' ');
  return `<div class="row-comment">${hl(text)}${comments.length > 1 ? `<span class="row-comment-more" title="Всего комментариев: ${comments.length}">+${comments.length - 1}</span>` : ''}</div>`;
}

function renderTaskRow(blockId, dirId, task) {
  const expanded = expandedTasks.has(task.id);
  const histOpen = openHistories.has(task.id);
  const resp = task.responsible || [];
  const log = task.log || [];
  const isMatch = searchTokens().length > 0 && taskMatchesSearch(task);
  const statusText = STATUS_NAMES[task.status] || STATUS_NAMES.active;
  const comments = taskComments(log);
  const people = resp.map(r =>
    `<span class="resp-chip"${editMode ? ' title="Удалить исполнителя"' : ''} onclick="event.stopPropagation();removeResponsible('${blockId}','${dirId}','${task.id}',${jsStr(r)})">${hl(r)}</span>`
  ).join('<span class="resp-sep">, </span>');
  const deadlineCtl = task.deadline
    ? `<span class="deadline-wrap">
        <button type="button" class="detail-btn deadline-ru" onclick="openDeadlinePicker('${task.id}')"${editMode ? ' title="Изменить срок"' : ' tabindex="-1"'}>${ICONS.calendar}<span>${esc(formatDate(task.deadline))}</span></button>
        <input type="date" id="dl-${task.id}" class="deadline-input" value="${esc(task.deadline)}" tabindex="-1" onchange="updateTaskDeadline('${blockId}','${dirId}','${task.id}',this.value)">
      </span>`
    : `<span class="deadline-wrap edit-only">
        <button type="button" class="detail-btn deadline-add-btn" onclick="openDeadlinePicker('${task.id}')">${ICONS.calendar}<span>Срок</span></button>
        <input type="date" id="dl-${task.id}" class="deadline-input" value="" tabindex="-1" onchange="updateTaskDeadline('${blockId}','${dirId}','${task.id}',this.value)">
      </span>`;
  return `
  <div class="task-wrapper status-${task.status}${isMatch ? ' is-match' : ''}" data-task="${task.id}">
    <div class="task-row${expanded ? ' is-expanded' : ''}" id="card-${task.id}" onclick="cardClick(event,'${task.id}')">
      <span class="drag-handle" draggable="true" title="Перетащить" ondragstart="taskDragStart(event,'${blockId}','${dirId}','${task.id}')" ondragend="taskDragEnd(event,'${task.id}')">${ICONS.grip}</span>
      <button type="button" class="status-mark${task.status === 'done' ? ' is-done' : ''}" aria-label="Статус: ${statusText}"${editMode ? ` title="${task.status === 'done' ? 'Вернуть в работу' : 'Отметить завершённой'}"` : ' tabindex="-1"'} onclick="toggleTaskStatus('${blockId}','${dirId}','${task.id}')">${task.status === 'done' ? CHECK_SVG : ''}</button>
      <div class="task-main">
        <span class="task-title-full" id="task-title-${task.id}" onclick="editTaskTitle('${task.id}')">${hl(task.text)}</span>
        <textarea class="task-row-input" id="task-inp-${task.id}" rows="1" placeholder="Задача…" onblur="endEditTitle('${task.id}')" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" oninput="autoGrow(this);updateTaskText('${blockId}','${dirId}','${task.id}',this.value)">${esc(task.text)}</textarea>
        ${rowCommentHtml(log)}
      </div>
      <div class="row-aside">${resp.length ? `<span class="row-people task-row-responsible">${people}</span>` : ''}${task.deadline ? `<span class="row-date">${esc(formatShortDate(task.deadline))}</span>` : ''}</div>
    </div>
    <div class="task-detail" id="detail-${task.id}" style="display:${expanded ? 'block' : 'none'}">
      <div class="detail-meta">${statusText}${task.deadline ? ` · срок ${esc(formatDate(task.deadline))}` : ''}${comments.length ? ` · ${comments.length} ${plural(comments.length, 'комментарий', 'комментария', 'комментариев')}` : ''}</div>
      <div class="detail-actions edit-only">
        <button type="button" class="detail-btn status-btn" onclick="toggleTaskStatus('${blockId}','${dirId}','${task.id}')">${statusMarkHtml(task.status === 'done' ? 'active' : 'done', true)}<span>${task.status === 'done' ? 'Вернуть в работу' : 'Отметить завершённой'}</span></button>
        ${deadlineCtl}
        <span class="resp-group">
          <button type="button" class="detail-btn" id="resp-btn-${task.id}" onclick="showRespInput('${task.id}')" title="Добавить исполнителя">${ICONS.personPlus}<span>Исполнитель</span></button>
          <span class="resp-icon-wrap" id="resp-wrap-${task.id}">
            <span class="autocomplete-wrap">
              <input class="resp-icon-input responsible-input" id="resp-inp-${task.id}" placeholder="Имя…" autocomplete="off" oninput="showAC(this,'${blockId}','${dirId}','${task.id}')" onkeydown="handleResponsibleKey(event,'${blockId}','${dirId}','${task.id}')" onblur="respFocusOut('${task.id}')">
              <span class="autocomplete-list" id="ac-${task.id}" style="display:none"></span>
            </span>
          </span>
        </span>
        <button type="button" class="detail-btn" onclick="triggerLogInput('${blockId}','${dirId}','${task.id}')" title="Добавить комментарий">${ICONS.messagePlus}<span>Комментарий</span></button>
        <button type="button" class="detail-btn detail-delete-btn" onclick="removeTask('${blockId}','${dirId}','${task.id}')" title="Удалить задачу" aria-label="Удалить задачу">${ICONS.trash}</button>
      </div>
      <div class="history-section">
        <div class="history-body" id="hist-body-${task.id}" style="display:${histOpen || log.length ? 'block' : 'none'}">
          <div class="log-entries" id="log-entries-${task.id}">${renderLogEntries(log, blockId, dirId, task.id)}</div>
          <div class="log-add" id="log-add-${task.id}" style="display:none">
            <textarea class="log-input" id="log-input-${task.id}" rows="1" placeholder="Комментарий… Enter — сохранить, Esc — отмена" oninput="autoGrow(this)" onkeydown="handleLogKey(event,'${blockId}','${dirId}','${task.id}')"></textarea>
            <button type="button" class="log-cancel-btn" onclick="hideLogInput('${task.id}')" title="Отмена (Esc)" aria-label="Отмена">${ICONS.x}</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
