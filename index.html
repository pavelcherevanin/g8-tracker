      s.name = name;
      persist();
      renderSeasonPill();
      renderSeasonMenu();
      if (s === state) renderRightPanel();
      return true;
    }
  });
}
function deleteSeason(id) {
  if (!editMode || db.seasons.length <= 1) return;
  const s = db.seasons.find(s => s.id === id);
  if (!s) return;
  closeSeasonMenu();
  const st = seasonStats(s);
  showConfirm(
    `Удалить <strong>${esc(seasonLabel(s))}</strong>?<br><span class="modal-sub">${st.blocks} ${plural(st.blocks, 'блок', 'блока', 'блоков')}, ${st.dirs} ${plural(st.dirs, 'направление', 'направления', 'направлений')} и ${st.tasks} ${plural(st.tasks, 'задача', 'задачи', 'задач')} этого сезона будут удалены. Другие сезоны не изменятся.</span>`,
    () => {
      const idx = db.seasons.indexOf(s);
      if (idx === -1 || db.seasons.length <= 1) return;
      const order = sortedSeasons();
      const pos = order.indexOf(s);
      db.seasons.splice(idx, 1);
      undoStacks.delete(s.id);
      delete navMap[s.id];
      lsSet(NAV_KEY, JSON.stringify(navMap));
      if (state === s) {
        state = order[pos + 1] || order[pos - 1];
        lsSet(SEASON_KEY, state.id);
        expandedTasks.clear();
        openHistories.clear();
        restoreNav();
      }
      persist();
      renderAll();
      renderSeasonMenu();
      showToast(`${seasonLabel(s)} удалён`, () => restoreDeletedSeason(s, idx));
    },
    { title: 'Удалить сезон', confirmText: 'Удалить сезон' }
  );
}
function restoreDeletedSeason(s, idx) {
  if (db.seasons.some(x => x.id === s.id)) return;
  db.seasons.splice(Math.min(idx, db.seasons.length), 0, s);
  persist();
  switchSeason(s.id);
  renderSeasonMenu();
}

// ── Ширина левой колонки ──────────────────────────────────────────────────────
const PANEL_W_DEFAULT = 264;
const PANEL_W_MIN = 180;
const PANEL_W_MAX = 480;
function clampPanelW(w) { return Math.min(PANEL_W_MAX, Math.max(PANEL_W_MIN, Math.round(w))); }
function isMobileLayout() { return window.matchMedia('(max-width: 700px)').matches; }
function applyPanelWidth(w) {
  const v = clampPanelW(w);
  document.documentElement.style.setProperty('--panel-w', v + 'px');
  document.getElementById('panel-resizer')?.setAttribute('aria-valuenow', String(v));
  return v;
}
function resetPanelWidth() {
  applyPanelWidth(PANEL_W_DEFAULT);
  lsRemove(PANEL_W_KEY);
}
function initPanelResizer() {
  const saved = parseInt(lsGet(PANEL_W_KEY), 10);
  applyPanelWidth(Number.isFinite(saved) ? saved : PANEL_W_DEFAULT);
  const handle = document.getElementById('panel-resizer');
  if (!handle) return;
  let startX = 0, startW = 0, pendingW = 0, raf = 0, dragging = false;
  const currentW = () => document.getElementById('left-panel').getBoundingClientRect().width;
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0 || isMobileLayout()) return;
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startW = pendingW = currentW();
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    document.body.classList.add('is-resizing');
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    pendingW = clampPanelW(startW + e.clientX - startX);
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; applyPanelWidth(pendingW); });
  });
  const finish = () => {
    if (!dragging) return;
    dragging = false;
    cancelAnimationFrame(raf);
    raf = 0;
    document.body.classList.remove('is-resizing');
    if (Math.round(pendingW) !== Math.round(startW)) lsSet(PANEL_W_KEY, String(applyPanelWidth(pendingW)));
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
  handle.addEventListener('lostpointercapture', finish);
  handle.addEventListener('dblclick', () => { if (!isMobileLayout()) resetPanelWidth(); });
  handle.addEventListener('keydown', e => {
    if (e.key === 'Home') { e.preventDefault(); resetPanelWidth(); return; }
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    lsSet(PANEL_W_KEY, String(applyPanelWidth(currentW() + (e.key === 'ArrowRight' ? 16 : -16))));
  });
}

function filtersActive() { return filter.status !== 'all' || filter.responsible !== 'all'; }

function renderSearchResults(panel) {

// ── Two-panel navigation ──────────────────────────────────────────────────────
function isGroupCollapsed(dirId, groupKey) {
  const key = `${dirId}-${groupKey}`;
  if (groupStates.has(key)) return groupStates.get(key);
  return groupKey === 'done';
}

function toggleStatusGroup(dirId, groupKey) {
  const key = `${dirId}-${groupKey}`;
  groupStates.set(key, !isGroupCollapsed(dirId, groupKey));
  const group = document.querySelector(`.status-group[data-group-key="${groupKey}"][data-dir-id="${dirId}"]`);
  if (group) {
    const collapsed = isGroupCollapsed(dirId, groupKey);
    group.querySelector('.status-group-body')?.classList.toggle('collapsed', collapsed);
    group.querySelector('.sg-chev')?.classList.toggle('open', !collapsed);
    group.querySelector('.status-group-header')?.setAttribute('aria-expanded', String(!collapsed));
  }
}

        <div class="dir-progress" title="${pct}%">
          <div class="progress"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
          <span class="progress-text">${done} из ${total} готово</span>
        </div>
      </div>
      <div class="dir-toolbar">
        ${visible.length ? `<button type="button" class="text-btn dir-expand-all-btn" onclick="toggleAllTasksInDir('${block.id}','${dir.id}')">${allOpen ? `${ICONS.collapse}<span>Свернуть все</span>` : `${ICONS.expand}<span>Развернуть все</span>`}</button>` : ''}
        ${filtersActive() ? `<span class="dir-filter-note">Показано ${visible.length} из ${total} — включены фильтры</span>` : ''}
        <button type="button" class="dir-add-task-btn" onclick="addTask('${block.id}','${dir.id}')">${ICONS.plus}<span>Задача</span></button>
      </div>
    </header>`;
  groups.forEach(({ key, label, color: dot, tasks }) => {
    if (!tasks.length) return;
    const collapsed = isGroupCollapsed(dir.id, key);
    html += `<section class="status-group" data-group-key="${key}" data-dir-id="${dir.id}">
      <button type="button" class="status-group-header" onclick="toggleStatusGroup('${dir.id}','${key}')" aria-expanded="${!collapsed}">
        <span class="sg-dot" style="background:${dot}"></span><span class="sg-label">${label}</span><span class="sg-sep">·</span><span class="sg-count">${tasks.length}</span>
        <span class="sg-chev${collapsed ? '' : ' open'}">${ICONS.chevronDown}</span>
      </button>
      <div class="status-group-body${collapsed ? ' collapsed' : ''}" ondragover="listDragOver(event,'${dir.id}')" ondrop="listDrop(event,'${block.id}','${dir.id}')">
        ${tasks.map(t => renderTaskCard(block.id, dir.id, t)).join('')}
      </div>
    </section>`;
  });
  if (!visible.length) {
    html += `<div class="empty-note">${total ? 'Нет задач, подходящих под фильтры.' : (editMode ? 'Задач пока нет — нажмите «Задача», чтобы добавить.' : 'Задач пока нет.')}</div>`;
  }
  html += `</div>`;
  panel.innerHTML = html;
}

// плашка с последней заметкой в свёрнутой карточке
function taskNoteHtml(log) {
  log = log || [];
  const last = log[log.length - 1];
  if (!last) return '';
  return `<div class="task-note">${ICONS.message}<span class="task-note-text">${hl(last.text)}</span>${log.length > 1 ? `<span class="task-note-more" title="Всего заметок: ${log.length}">+${log.length - 1}</span>` : ''}</div>`;
}
function renderTaskCard(blockId, dirId, task, opts = {}) {
  const overdue = isOverdue(task);
  const expanded = expandedTasks.has(task.id);
  const histOpen = openHistories.has(task.id);
  const resp = task.responsible || [];
  const log = task.log || [];
  const statusText = overdue ? 'просрочено' : (STATUS_LABELS[task.status] || '');
  const respChips = resp.map(r =>
    `<span class="resp-chip"${editMode ? ' title="Удалить исполнителя"' : ''} onclick="event.stopPropagation();removeResponsible('${blockId}','${dirId}','${task.id}',${jsStr(r)})">${hl(r)}</span>`
  ).join('<span class="resp-sep">, </span>');
  const respHtml = resp.length ? `<span class="meta-item meta-person">${ICONS.person}<span class="task-row-responsible">${respChips}</span></span>` : '';
  const dateHtml = task.deadline
    ? `<span class="meta-item meta-date${overdue ? ' is-overdue' : ''}">${ICONS.calendar}<span>${overdue ? 'просрочено · ' : ''}${esc(formatShortDate(task.deadline))}</span></span>`
    : '';
  const noteHtml = taskNoteHtml(log);
  const deadlineCtl = task.deadline
    ? `<span class="deadline-wrap">
        <button type="button" class="detail-btn deadline-ru${overdue ? ' overdue-date' : ''}" onclick="openDeadlinePicker('${task.id}')"${editMode ? ' title="Изменить срок"' : ' tabindex="-1"'}>${ICONS.calendar}<span>${esc(formatDate(task.deadline))}</span></button>
        <input type="date" id="dl-${task.id}" class="deadline-input" value="${esc(task.deadline)}" tabindex="-1" onchange="updateTaskDeadline('${blockId}','${dirId}','${task.id}',this.value)">
      </span>`
    : `<span class="deadline-wrap edit-only">
        <button type="button" class="detail-btn deadline-add-btn" onclick="openDeadlinePicker('${task.id}')">${ICONS.calendar}<span>Срок</span></button>
        <input type="date" id="dl-${task.id}" class="deadline-input" value="" tabindex="-1" onchange="updateTaskDeadline('${blockId}','${dirId}','${task.id}',this.value)">
      </span>`;
  return `
  <div class="task-wrapper status-${task.status}${overdue ? ' overdue' : ''}" data-task="${task.id}">
    <div class="task-row${expanded ? ' is-expanded' : ''}" id="card-${task.id}" onclick="cardClick(event,'${task.id}')">
      ${opts.noDrag ? '' : `<span class="drag-handle" draggable="true" title="Перетащить" ondragstart="taskDragStart(event,'${blockId}','${dirId}','${task.id}')" ondragend="taskDragEnd(event,'${task.id}')">${ICONS.grip}</span>`}
      <button type="button" class="status-dot" style="--dot:${dotColor(task)}" aria-label="Статус: ${statusText}"${editMode ? ' title="Сменить статус"' : ' tabindex="-1"'} onclick="cycleTaskStatus('${blockId}','${dirId}','${task.id}')"></button>
      <div class="task-main">
        <div class="task-title-wrap">
          <span class="task-title-full" id="task-title-${task.id}" onclick="editTaskTitle('${task.id}')">${hl(task.text)}</span>
          <textarea class="task-row-input" id="task-inp-${task.id}" rows="1" placeholder="Задача…" onblur="endEditTitle('${task.id}')" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" oninput="autoGrow(this);updateTaskText('${blockId}','${dirId}','${task.id}',this.value)">${esc(task.text)}</textarea>
        </div>
        ${respHtml || dateHtml ? `<div class="task-meta">${respHtml}${dateHtml}</div>` : ''}
        ${noteHtml}
      </div>
      <button type="button" class="task-row-chevron${expanded ? ' open' : ''}" id="chev-${task.id}" onclick="event.stopPropagation();toggleTask('${task.id}')" aria-label="Подробнее">${ICONS.chevronDown}</button>
    </div>
    <div class="task-detail" id="detail-${task.id}" style="display:${expanded ? 'block' : 'none'}">
      <div class="detail-actions">
        <button type="button" class="detail-btn hist-icon-btn${histOpen ? ' active' : ''}" id="hist-btn-${task.id}" onclick="toggleHistory('${task.id}')" title="История задачи">${ICONS.history}<span>История</span>${log.length ? `<span class="hist-count">${log.length}</span>` : ''}</button>
        ${deadlineCtl}
        <span class="resp-group edit-only">
          <button type="button" class="detail-btn" id="resp-btn-${task.id}" onclick="showRespInput('${task.id}')" title="Добавить исполнителя">${ICONS.personPlus}<span>Исполнитель</span></button>
          <span class="resp-icon-wrap" id="resp-wrap-${task.id}">
            <span class="autocomplete-wrap">
              <input class="resp-icon-input responsible-input" id="resp-inp-${task.id}" placeholder="Имя…" autocomplete="off" oninput="showAC(this,'${blockId}','${dirId}','${task.id}')" onkeydown="handleResponsibleKey(event,'${blockId}','${dirId}','${task.id}')" onblur="respFocusOut('${task.id}')">
              <span class="autocomplete-list" id="ac-${task.id}" style="display:none"></span>
            </span>
          </span>
        </span>
        <button type="button" class="detail-btn edit-only" onclick="triggerLogInput('${blockId}','${dirId}','${task.id}')" title="Добавить заметку">${ICONS.messagePlus}<span>Заметка</span></button>
        <button type="button" class="detail-btn detail-delete-btn edit-only" onclick="removeTask('${blockId}','${dirId}','${task.id}')" title="Удалить задачу" aria-label="Удалить задачу">${ICONS.trash}</button>
      </div>
      <div class="history-section">
        <div class="history-body" id="hist-body-${task.id}" style="display:${histOpen ? 'block' : 'none'}">
          <div class="log-entries" id="log-entries-${task.id}">${renderLogEntries(log, blockId, dirId, task.id)}</div>
          <button type="button" class="log-new-btn" id="log-new-btn-${task.id}" onclick="showLogInput('${blockId}','${dirId}','${task.id}')">${ICONS.plus}<span>Добавить заметку</span></button>
          <div class="log-add" id="log-add-${task.id}" style="display:none">
            <textarea class="log-input" id="log-input-${task.id}" rows="1" placeholder="Заметка… Enter — сохранить, Esc — отмена" oninput="autoGrow(this)" onkeydown="handleLogKey(event,'${blockId}','${dirId}','${task.id}')"></textarea>
            <button type="button" class="log-cancel-btn" onclick="hideLogInput('${task.id}')" title="Отмена (Esc)" aria-label="Отмена">${ICONS.x}</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
