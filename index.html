<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G8 Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2ede4;
    --bg2: #ece6db;
    --bg3: #e4ddd1;
    --bg4: #d8d0c4;
    --lime: #7a9e00;
    --lime-dim: #698800;
    --lime-light: #e8f0c8;
    --text: #241c10;
    --text-dim: #8a7d68;
    --border: #d0c8b8;
    --border-light: #e2dbd0;
    --stripe-todo: #b8b0a0;
    --stripe-progress: #d4920a;
    --stripe-done: #5a9000;
    --stripe-overdue: #c0392b;
    --red: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Unbounded', sans-serif;
    background-color: var(--bg); color: var(--text); min-height: 100vh;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.022) 1px, transparent 1px);
    background-size: 32px 32px; pointer-events: none; z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

  /* ── Header ── */
  .header {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 44px; height: 44px; flex-shrink: 0; display: block;
  }
  .header-text h1 { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .header-text p  { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 3px; }
  .header-print-date { display: none; }
  .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  /* ── Lock button ── */
  .lock-btn {
    font-size: 16px; background: transparent; border: none; cursor: pointer;
    padding: 4px 6px; color: var(--text-dim); transition: color 0.15s; line-height: 1;
    display: flex; align-items: center;
  }
  .lock-btn:hover { color: var(--text); }
  .lock-btn.unlocked { color: var(--lime); }

  /* ── Read-only (locked) mode ── */
  body.locked .status-dot          { pointer-events: none; }
  body.locked .drag-handle,
  body.locked .dir-drag-handle,
  body.locked .block-drag-handle   { display: none !important; }
  body.locked .btn-danger          { display: none !important; }
  body.locked .add-task-btn,
  body.locked .add-direction-btn,
  body.locked .expand-all-btn      { display: none !important; }
  body.locked .task-row-input,
  body.locked .block-title-input,
  body.locked .direction-title-input { pointer-events: none; cursor: default; }
  body.locked .autocomplete-wrap   { display: none !important; }
  body.locked .responsible-tag     { pointer-events: none; cursor: default; }
  body.locked .tag-remove          { display: none; }
  body.locked .deadline-input      { display: none !important; }
  body.locked .log-add, body.locked .log-new-btn { display: none !important; }
  body.locked .log-edit-btn,
  body.locked .log-del-btn         { display: none !important; }
  body.locked .block-color-swatch  { display: none !important; }
  body.locked .detail-delete-btn   { display: none !important; }
  body.locked .btn-primary         { display: none !important; }
  body.locked .export-wrap .export-menu-item:last-child { display: none !important; } /* скрыть импорт */

  /* ── Buttons ── */
  .btn {
    font-family: 'Unbounded', sans-serif;
    font-size: 10px; font-weight: 600; padding: 8px 16px; border: none;
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.15s;
  }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { background: #3a2e1a; }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
  .btn-danger { background: transparent; color: var(--text-dim); border: 1px solid transparent; font-size: 10px; padding: 3px 6px; }
  .btn-danger:hover { color: var(--red); }

  /* ── Export dropdown ── */
  .export-wrap { position: relative; }
  .export-menu {
    display: none; flex-direction: column; position: absolute;
    top: calc(100% + 4px); right: 0; min-width: 180px;
    background: var(--bg); border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12); z-index: 500;
  }
  .export-menu.open { display: flex; }
  .export-menu-item {
    font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 10px 16px; border: none; background: transparent;
    color: var(--text-dim); cursor: pointer; text-align: left; transition: all 0.1s;
  }
  .export-menu-item:hover { background: var(--bg2); color: var(--text); }
  .export-menu-item + .export-menu-item { border-top: 1px solid var(--border-light); }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin-bottom: 20px; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border);
  }
  .filter-label { font-size: 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; flex-shrink: 0; }
  .filter-select {
    font-family: 'Unbounded', sans-serif; font-size: 9px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); padding: 4px 8px; outline: none; cursor: pointer;
  }
  .filter-select:focus { border-color: var(--lime); }
  .filter-divider { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
  .filter-btns { display: flex; gap: 3px; }
  .filter-btn {
    font-family: 'Unbounded', sans-serif; font-size: 8px; padding: 4px 10px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.12s;
  }
  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .filter-btn.active-overdue { background: var(--red); color: #fff; border-color: var(--red); }
  .filter-reset {
    font-family: 'Unbounded', sans-serif; font-size: 8px; padding: 4px 10px;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; margin-left: auto; transition: all 0.12s;
  }
  .filter-reset:hover { border-color: var(--red); color: var(--red); }

  /* ── Blocks ── */
  .blocks-list { display: flex; flex-direction: column; gap: 20px; }
  .block {
    background: var(--bg2); border: 1px solid var(--border);
    border-left: 5px solid var(--lime); box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  /* ── Block color swatch ── */
  .block-color-swatch {
    width: 18px; height: 18px; border-radius: 2px;
    border: 2px solid rgba(0,0,0,0.15); cursor: pointer;
    flex-shrink: 0; padding: 0; outline: none;
    -webkit-appearance: none; appearance: none;
    transition: border-color 0.15s;
  }
  .block-color-swatch:hover { border-color: rgba(0,0,0,0.35); }
  .block-color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .block-color-swatch::-webkit-color-swatch { border: none; border-radius: 1px; }
  .block-header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 18px; cursor: pointer; user-select: none; background: var(--bg4);
  }
  .block-header:hover { background: #cec6ba; }
  .block-title-input {
    flex: 0 0 auto; margin-right: auto; min-width: 60px; max-width: 500px;
    background: transparent; border: none;
    font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 800;
    color: var(--text); outline: none; cursor: text;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .block-title-input::placeholder { color: var(--text-dim); }
  .block-chevron { color: var(--text-dim); font-size: 11px; transition: transform 0.2s; flex-shrink: 0; }
  .block-chevron.open { transform: rotate(180deg); }
  .block-progress { display: flex; align-items: center; gap: 8px; font-size: 9px; color: var(--text-dim); flex-shrink: 0; }
  .progress-bar { width: 56px; height: 3px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--lime); transition: width 0.3s; }
  .block-body { padding: 0 16px 16px; }

  /* ── Directions ── */
  .directions-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .direction { background: var(--bg); border: 1px solid var(--border); border-left: 2px solid var(--border); }
  .direction-header {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 12px; cursor: pointer; background: var(--bg2);
  }
  .direction-header:hover { background: #e0d9cd; }
  .direction-title-input {
    flex: 1 1 0; min-width: 50px; max-width: 100%;
    background: transparent; border: none;
    font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 600;
    color: var(--text-dim); outline: none; cursor: text;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .direction-title-input:focus { color: var(--text); }
  .direction-title-input::placeholder { color: #b0a890; }
  .direction-body { padding: 0 10px 0; }

  /* ── Tasks list ── */
  .tasks-list { border: 1px solid var(--border-light); margin-bottom: 0; }
  .tasks-list:empty { display: none; }

  /* ── Drag & drop ── */
  .drag-handle {
    font-size: 13px; color: var(--border); cursor: grab;
    flex-shrink: 0; padding: 0 3px; opacity: 0;
    transition: opacity 0.1s; user-select: none; line-height: 1;
  }
  .task-row:hover .drag-handle { opacity: 1; }
  .drag-handle:active { cursor: grabbing; }

  .task-wrapper.dragging { opacity: 0.35; }

  /* ── Block drag handle ── */
  .block-drag-handle {
    font-size: 14px; color: var(--border); cursor: grab;
    flex-shrink: 0; padding: 0 2px; opacity: 0;
    transition: opacity 0.1s; user-select: none; line-height: 1;
  }
  .block-header:hover .block-drag-handle { opacity: 1; }
  .block-drag-handle:active { cursor: grabbing; }
  .block.block-dragging { opacity: 0.35; }

  /* ── Expand-all buttons ── */
  .expand-all-btn {
    font-family: 'Unbounded', sans-serif; font-size: 7px; color: var(--text-dim);
    background: transparent; border: 1px solid transparent; padding: 2px 6px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    opacity: 0; transition: opacity 0.12s, border-color 0.12s, color 0.12s;
    flex-shrink: 0; white-space: nowrap;
  }
  .block-header:hover .expand-all-btn,
  .direction-header:hover .expand-all-btn { opacity: 1; }
  .expand-all-btn:hover { border-color: var(--border); color: var(--text); }

  /* ── Direction drag handle ── */
  .dir-drag-handle {
    font-size: 12px; color: var(--border); cursor: grab;
    flex-shrink: 0; padding: 0 2px; opacity: 0;
    transition: opacity 0.1s; user-select: none; line-height: 1;
  }
  .direction-header:hover .dir-drag-handle { opacity: 1; }
  .dir-drag-handle:active { cursor: grabbing; }
  .direction.dir-dragging { opacity: 0.35; }
  .dir-drop-indicator {
    height: 2px; background: var(--lime); margin: 2px 0;
    pointer-events: none; position: relative;
  }
  .dir-drop-indicator::before {
    content: ''; position: absolute; left: 0; top: -3px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--lime);
  }

  .block-drop-indicator {
    height: 3px; background: var(--lime); margin: 4px 0;
    pointer-events: none; position: relative;
  }
  .block-drop-indicator::before {
    content: ''; position: absolute; left: 0; top: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--lime);
  }

  .drop-indicator {
    height: 2px; background: var(--lime); margin: 0;
    pointer-events: none; position: relative;
  }
  .drop-indicator::before {
    content: ''; position: absolute; left: 0; top: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--lime);
  }

  /* ── Task wrapper ── */
  .task-wrapper { border-bottom: 1px solid var(--border-light); }
  .task-wrapper:last-child { border-bottom: none; }

  /* ── Collapsed task row ── */
  .task-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 9px 10px; cursor: pointer; user-select: none; transition: background 0.1s;
  }
  .task-row:hover { background: rgba(0,0,0,0.025); }
  .task-row.is-expanded { background: rgba(0,0,0,0.025); }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    cursor: pointer; transition: transform 0.15s; margin-top: 3px;
  }
  .status-dot:hover { transform: scale(1.4); }

  .task-title-full {
    flex: 1; min-width: 0;
    font-family: 'Unbounded', sans-serif; font-size: 11px; color: var(--text);
    white-space: normal; word-break: break-word; cursor: pointer; line-height: 1.5;
  }
  .task-wrapper.status-done .task-title-full { text-decoration: line-through; color: var(--text-dim); }
  body.locked .task-title-full { cursor: default; }
  .task-title-full:empty::before { content: 'Задача...'; opacity: 0.4; }

  .task-row-input {
    display: none; flex: 1; min-width: 0;
    background: transparent; border: none;
    font-family: 'Unbounded', sans-serif; font-size: 11px; color: var(--text);
    outline: none; cursor: text;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-row-input::placeholder { color: var(--text-dim); }
  .task-wrapper.status-done .task-row-input { text-decoration: line-through; color: var(--text-dim); }

  .task-row-responsible {
    font-size: 9px; color: var(--text-dim); flex: 0 1 auto; min-width: 0; max-width: 35%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .task-row-status { display: none; margin-top: 2px; }
  .task-row-status.is-overdue {
    display: inline;
    font-family: 'Unbounded', sans-serif; font-size: 7px; font-weight: 700;
    color: var(--red); text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
  }
  .task-row-chevron { font-size: 9px; color: var(--text-dim); flex-shrink: 0; transition: transform 0.18s; line-height: 1; margin-top: 2px; }
  .task-row-chevron.open { transform: rotate(180deg); }

  /* ── Detail action icons ── */
  .detail-action-btn {
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; color: var(--text-dim);
    opacity: 0.45; padding: 0; flex-shrink: 0; transition: opacity 0.15s, color 0.15s;
  }
  .detail-action-btn:hover { opacity: 1; color: var(--lime); }
  body.locked .detail-action-btn { display: none; }
  .resp-icon-wrap { display: none; align-items: center; }
  .resp-icon-wrap.open { display: inline-flex; }
  .resp-icon-input {
    font-size: 9px; font-family: 'Unbounded', sans-serif; letter-spacing: 0.3px;
    background: transparent; border: none; border-bottom: 1px solid var(--lime);
    color: var(--text); outline: none; width: 110px; padding-bottom: 1px;
  }

  /* ── Expanded task detail ── */
  .task-detail {
    background: #ede7dc; border-top: 1px solid var(--border);
    padding: 5px 12px 5px 28px;
  }
  .detail-inline { display: flex; flex-direction: column; gap: 7px; }
  .detail-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .detail-group { display: flex; align-items: center; gap: 5px; }
  .detail-label {
    font-family: 'Unbounded', sans-serif; font-size: 7.5px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; white-space: nowrap;
  }
  .deadline-input.overdue-date { color: var(--red); }
  .deadline-ru {
    font-family: 'Unbounded', sans-serif; font-size: 9px; color: var(--text);
  }
  .deadline-ru.overdue-date { color: var(--red); }
  .deadline-input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .deadline-add-btn {
    background: none; border: 1px dashed var(--border); cursor: pointer;
    color: var(--text-dim); font-size: 8px; padding: 2px 8px;
    font-family: 'Unbounded', sans-serif; letter-spacing: 0.3px;
    transition: border-color 0.15s, color 0.15s;
  }
  .deadline-add-btn:hover { border-color: var(--text-dim); color: var(--text); }
  body.locked .deadline-add-btn { display: none; }
  body:not(.locked) .deadline-ru { cursor: pointer; }
  body:not(.locked) .deadline-ru:hover { opacity: 0.7; }
  body.locked .deadline-group-edit { display: none; }

  .task-responsible { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .responsible-tag {
    font-size: 8px; padding: 2px 7px; background: #e2ddd5; color: var(--text-dim);
    border: 1px solid var(--border); cursor: pointer; font-family: 'Unbounded', sans-serif;
  }
  .responsible-tag:hover { background: #d4cec6; color: var(--text); }
  .responsible-input {
    font-size: 8px; padding: 2px 6px; background: transparent;
    border: 1px dashed var(--border); color: var(--text-dim);
    font-family: 'Unbounded', sans-serif; outline: none; width: 140px;
  }
  .responsible-input:focus { border-color: var(--lime); color: var(--text); }

  /* ── Autocomplete ── */
  .autocomplete-wrap { position: relative; display: inline-flex; }
  .autocomplete-list {
    position: absolute; top: calc(100% + 3px); left: 0; z-index: 400;
    background: var(--bg); border: 1px solid var(--border);
    min-width: 200px; max-height: 200px; overflow-y: auto;
    box-shadow: 0 6px 20px rgba(0,0,0,0.13);
  }
  .autocomplete-item {
    font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 500;
    padding: 8px 13px; cursor: pointer; color: var(--text-dim);
    border-bottom: 1px solid var(--border-light); transition: all 0.08s;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover { background: var(--bg2); color: var(--text); }
  .autocomplete-item mark {
    background: transparent; color: var(--lime-dim); font-weight: 700;
  }

  /* ── History ── */
  .history-section { margin-bottom: 0; }
  .history-toggle-btn {
    font-family: 'Unbounded', sans-serif; font-size: 8px; padding: 3px 9px;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.12s;
  }
  .history-toggle-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .history-toggle-btn.open { background: var(--bg3); color: var(--text); }
  .history-body { margin-top: 8px; padding: 9px; background: var(--bg2); border: 1px solid var(--border); }
  .history-body:has(.log-entries > .log-new-btn:only-child) { padding: 3px 9px; }
  .log-entries { display: flex; flex-direction: column; gap: 5px; margin-bottom: 4px; }
  .log-entries:has(> .log-new-btn:only-child) { margin-bottom: 0; }
  .log-slot { width: 14px; flex-shrink: 0; }
  .log-entry { display: flex; gap: 10px; align-items: flex-start; position: relative; }
  .log-entry:hover .log-entry-actions { opacity: 1; }
  .log-date  { font-size: 8px; color: var(--text-dim); flex-shrink: 0; white-space: nowrap; padding-top: 2px; }
  .log-text  { font-size: 9px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; flex: 1; }
  .log-entry-actions {
    display: flex; gap: 3px; flex-shrink: 0; opacity: 0; transition: opacity 0.12s; padding-top: 1px;
  }
  .log-edit-btn, .log-del-btn {
    font-size: 9px; background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); padding: 1px 3px; line-height: 1; transition: color 0.1s;
    font-family: 'Unbounded', sans-serif;
  }
  .log-edit-btn:hover { color: var(--lime); }
  .log-del-btn:hover  { color: var(--red); }
  .log-edit-area {
    flex: 1; font-family: 'Unbounded', sans-serif; font-size: 9px;
    background: var(--bg); border: 1px solid var(--lime); outline: none;
    color: var(--text); padding: 3px 5px; resize: none; line-height: 1.6;
    min-height: 28px; overflow: hidden;
  }
  .log-new-btn {
    width: 14px; flex-shrink: 0; background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 12px; font-family: monospace;
    padding: 0; opacity: 0; transition: opacity 0.15s; text-align: center; line-height: 1.4;
  }
  .history-body:hover .log-new-btn { opacity: 0.4; }
  .log-new-btn:hover { opacity: 1 !important; color: var(--lime); }
  .log-add { display: flex; gap: 6px; align-items: flex-end; margin-top: 6px; }
  .log-input {
    flex: 1; font-family: 'Unbounded', sans-serif; font-size: 9px;
    background: transparent; border: none; outline: none;
    color: var(--text); border-bottom: 1px solid var(--border); padding: 2px 0;
    resize: none; overflow: hidden; min-height: 22px; line-height: 1.6;
  }
  .log-input:focus { border-bottom-color: var(--lime); }
  .log-cancel-btn {
    background: none; border: none; cursor: pointer; flex-shrink: 0;
    color: var(--text-dim); font-size: 10px; padding: 1px 4px;
    opacity: 0.4; transition: opacity 0.15s, color 0.15s; line-height: 1;
  }
  .log-cancel-btn:hover { opacity: 1; color: var(--red); }

  /* ── Detail footer ── */
  .detail-delete-btn:hover { color: var(--red) !important; opacity: 1 !important; }

  /* ── Add buttons ── */
  .add-task-btn {
    font-family: 'Unbounded', sans-serif; font-size: 7px; color: transparent;
    background: transparent; border: none; border-top: 1px solid transparent;
    padding: 1px 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
    width: 100%; text-align: left; transition: all 0.15s; margin-top: 0;
    opacity: 0; pointer-events: none; line-height: 1;
  }
  .direction-body:hover .add-task-btn {
    opacity: 1; pointer-events: auto;
    color: var(--text-dim); border-top-color: var(--border);
  }
  .add-task-btn:hover { color: var(--lime) !important; border-top-color: var(--lime) !important; }
  .add-task-btn::before { content: '+ '; }
  .add-direction-btn {
    font-family: 'Unbounded', sans-serif; font-size: 8px; color: var(--text-dim);
    background: transparent; border: 1px dashed var(--border); padding: 5px 12px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; transition: all 0.15s;
  }
  .add-direction-btn:hover { border-color: var(--lime-dim); color: var(--lime-dim); }
  .add-direction-btn::before { content: '+ '; }

  /* ── Empty / scroll ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 11px; line-height: 2; }
  .empty-state .big { font-size: 40px; margin-bottom: 16px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--lime); }
  .collapsible { overflow: hidden; transition: max-height 0.3s ease; }
  .collapsible.collapsed { max-height: 0 !important; }

  /* ── Confirm modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(36,28,16,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .modal-overlay.visible { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg); border: 1px solid var(--border);
    border-left: 4px solid var(--red);
    padding: 24px 28px; min-width: 320px; max-width: 440px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    transform: translateY(-8px); transition: transform 0.15s;
  }
  .modal-overlay.visible .modal { transform: translateY(0); }
  .modal-title {
    font-size: 11px; font-weight: 700; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .modal-msg {
    font-size: 10px; color: var(--text-dim); line-height: 1.7;
    margin-bottom: 20px;
  }
  .modal-msg strong { color: var(--text); font-weight: 600; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-cancel {
    font-family: 'Unbounded', sans-serif; font-size: 9px; padding: 7px 16px;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.12s;
  }
  .modal-cancel:hover { border-color: var(--text-dim); color: var(--text); }
  .modal-confirm {
    font-family: 'Unbounded', sans-serif; font-size: 9px; padding: 7px 16px;
    background: var(--red); border: 1px solid var(--red); color: #fff;
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
    transition: all 0.12s;
  }
  .modal-confirm:hover { background: #a0301f; border-color: #a0301f; }

  /* ── Undo toast ── */
  .undo-toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--text); color: var(--bg);
    padding: 11px 18px; display: flex; align-items: center; gap: 18px;
    font-family: 'Unbounded', sans-serif; font-size: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.22);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 1000; white-space: nowrap;
  }
  .undo-toast.visible { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .undo-toast-msg { color: #c8c0b0; }
  .undo-btn {
    font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 700;
    background: var(--lime); color: var(--bg); border: none;
    padding: 4px 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .undo-btn:hover { background: #8ab800; }
  .undo-shortcut { font-size: 8px; color: #6a6050; }

  /* ── Mobile-only responsible in detail ── */
  .detail-resp-mobile { display: none; }
  .detail-resp-names { font-size: 9px; color: var(--text); }

  /* ── Responsible chips in row ── */
  .resp-chip { cursor: pointer; }
  body:not(.locked) .resp-chip:hover { color: var(--red); }
  body.locked .resp-chip { cursor: default; pointer-events: none; }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .app { padding: 16px 12px 60px; }

    /* Header — строка 1: лого + название, строка 2: кнопки */
    .header { flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding-bottom: 14px; }
    .header-text { flex: 1; }
    .header-text h1 { font-size: 13px; }
    .logo { width: 36px; height: 36px; }
    .header-actions { margin-left: 0; gap: 6px; width: 100%; flex-wrap: wrap; }
    .header-actions .btn-ghost { padding: 6px 8px; font-size: 8px; }
    .header-actions .btn-primary { padding: 6px 10px; font-size: 9px; }

    /* Filter bar */
    .filter-bar { gap: 7px; padding: 8px 10px; }
    .filter-divider { display: none; }
    .filter-btns { flex-wrap: wrap; gap: 3px; }
    .filter-btn { font-size: 7px; padding: 4px 7px; }
    .filter-select { font-size: 8px; max-width: 160px; }

    /* Blocks & directions */
    .block { margin: 0; }
    .block-header { padding: 10px 12px; }
    /* Drag-ручки на тач бесполезны — скрываем, освобождаем место */
    .drag-handle, .dir-drag-handle, .block-drag-handle { display: none !important; }
    /* Expand-all виден только на hover — на тач скрываем */
    .expand-all-btn { display: none !important; }
    /* Заголовок блока гибко сжимается под любую длину */
    .block-title-input { flex: 1 1 0; min-width: 60px; max-width: none; margin-right: 0; font-size: 12px; text-overflow: ellipsis; }
    .direction-header { padding: 7px 10px; }
    .direction-title-input { font-size: 10px; }

    /* Task rows — скрыть ответственного, дать место тексту */
    .task-row { padding: 10px 10px; gap: 7px; }
    .task-title-full { font-size: 11px; }
    .task-row-responsible { display: none; }
    .task-row-status { font-size: 7px; }

    /* Task detail */
    .task-detail { padding: 6px 10px 6px 22px; }
    .detail-inline { gap: 6px; }
    .detail-row { gap: 10px; }
    .detail-resp-mobile { display: flex; }
  }

  /* ── Print / PDF ── */
  @media print {
    @page { size: A4 portrait; margin: 0; }
    * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }

    body { background: #fff; }
    body::before { display: none; }
    .app { padding: 10px 15mm 15mm; max-width: 100%; }

    /* ── Print header (только первая страница) ── */
    .header {
      display: flex !important;
      position: static;
      background: #fff; padding: 8px 0 10px;
      border-bottom: 1px solid #ccc; margin-bottom: 14px;
      align-items: center; gap: 14px; flex-wrap: nowrap;
    }
    .header-text { display: flex !important; align-items: baseline; gap: 12px; }
    .header-text h1 { font-size: 14px !important; font-weight: 700 !important; color: #1a1a1a !important; letter-spacing: -0.3px !important; }
    .logo { width: 30px !important; height: 30px !important; }
    .header-print-date { display: inline !important; font-size: 11px !important; color: #888 !important; font-weight: 400 !important; }

    /* ── Скрываем всё интерактивное ── */
    .filter-bar, .header-actions, .drag-handle, .dir-drag-handle, .block-drag-handle,
    .btn-danger, .add-task-btn, .add-direction-btn, .expand-all-btn,
    .history-toggle-btn, .modal-overlay, .undo-toast,
    .autocomplete-wrap, .task-row-chevron, .block-chevron,
    .block-color-swatch, .resp-chip-x, .log-new-btn, .log-add,
    .detail-action-btn, .detail-delete-btn, .resp-icon-wrap { display: none !important; }

    /* ── Page flow — allow blocks to break across pages ── */
    .block, .block-body, .direction, .direction-tasks {
      break-inside: auto !important; page-break-inside: auto !important;
    }
    .task-wrapper { break-inside: avoid; page-break-inside: avoid; }

    /* ── Статус — текст, без точки ── */
    .status-dot { display: none !important; }
    .task-row-status { display: inline !important; font-size: 8px; margin-left: 4px; }

    /* ── Показываем детали ВСЕХ задач ── */
    .task-detail { display: block !important; padding: 2px 8px 3px 18px !important; }

    /* ── Скрываем пустой дедлайн ── */
    .detail-group:has(.deadline-input[value=""]):not(:has(.deadline-ru)) { display: none !important; }
    .deadline-group-edit { display: none !important; }
    /* ── Скрываем пустые ответственные ── */
    .detail-group:has(.task-responsible:not(:has(.responsible-tag))) { display: none !important; }
    /* ── Скрываем пустую строку ── */
    .detail-row:not(:has(.detail-group:not([style*="none"]))) { display: none !important; }
    /* ── Форматирование дедлайна ── */
    .deadline-input { display: none !important; }
    .deadline-ru { display: inline !important; }
    /* ── Print gap ── */
    .detail-inline { gap: 3px !important; }
    .detail-row    { gap: 10px !important; }

    /* ── Иерархия: блок > направление > задача ── */
    /* Блок — самый тёмный */
    .block-header      { background: #cec6ba !important; }
    .block-title-input { font-size: 14px !important; font-weight: 800 !important; color: #1a1a1a !important; }

    /* Направление — средний уровень, заметнее задачи */
    .direction-header  { background: #ddd8cf !important; }
    .direction-title-input {
      font-size: 12px !important; font-weight: 700 !important;
      color: #2a2a2a !important;
    }

    /* Задача — самый тихий уровень */
    .task-row-input    { display: none !important; }
    .task-title-full   { display: block !important; font-size: 10px !important; color: #555 !important; font-weight: 400 !important; white-space: normal !important; }
    .task-wrapper.status-done .task-title-full { text-decoration: line-through !important; }
    .task-row-status   { font-size: 7.5px !important; color: #888 !important; }
    .task-row-responsible { font-size: 8px !important; color: #888 !important; max-width: none !important; white-space: normal !important; }

    /* Детали задачи */
    .detail-label      { font-size: 7px !important; }
    .deadline-input    { display: none !important; }
    .deadline-ru       { display: inline !important; font-size: 9px !important; }
    .responsible-tag   { font-size: 8px !important; }
    .tag-remove        { display: none !important; }

    /* ── Отступы ── */
    .task-row          { padding: 5px 8px !important; border-bottom: 1px solid #ede8e0 !important; }
    .block-header      { padding: 5px 12px !important; }
    .direction-header  { padding: 4px 10px !important; }
    .block             { margin-bottom: 12px !important; box-shadow: none !important; }
    .direction         { margin-bottom: 3px !important; }
    .directions-list   { gap: 4px !important; }
    .block-body        { padding: 6px !important; }
    .direction-body    { padding: 0 !important; }

    /* ── Развёрнутые блоки / направления ── */
    .collapsible { max-height: none !important; overflow: visible !important; }
    .collapsible.collapsed { display: none !important; }

    /* ── Не рвать задачи и направления между страницами ── */
    .block     { break-inside: avoid; page-break-inside: avoid; }
    .direction { break-inside: avoid; page-break-inside: avoid; }
    .task-wrapper { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>

async function loadData() {
  if (editMode) {
    try {
      const r = localStorage.getItem(STORAGE_KEY);
      if (r) {
        const data = JSON.parse(r);
        if (data.blocks && data.blocks.length > 0) return data;
      }
    } catch(e) {}
  }
  try {
    const r = await fetch('data.json?v=' + Date.now());
    if (r.ok) {
      const data = await r.json();
      if (data.blocks) return data;
    }
  } catch(e) {}
  return getInitialData();
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); renderAll(); }

let state = { blocks: [] };

async function init() {
  state = await loadData();
  renderAll();
  applyLockState();
}

// ── Edit mode (password protection) ──────────────────────────────────────────
const EDIT_PASSWORD = 'g8fest';
let editMode = sessionStorage.getItem('g8-edit-mode') === '1';

function applyLockState() {
  if (editMode) {
    document.body.classList.remove('locked');
    const btn = document.getElementById('lock-btn');
    if (btn) { btn.textContent = '🔓'; btn.classList.add('unlocked'); btn.title = 'Выйти из режима редактирования'; }
  } else {
    document.body.classList.add('locked');
    const btn = document.getElementById('lock-btn');
    if (btn) { btn.textContent = '🔒'; btn.classList.remove('unlocked'); btn.title = 'Войти в режим редактирования'; }
  }
}

function toggleEditMode() {
  if (editMode) {
    editMode = false;
    sessionStorage.removeItem('g8-edit-mode');
    applyLockState();
  } else {
    const pwd = prompt('Введите пароль для редактирования:');
    if (pwd === EDIT_PASSWORD) {
      editMode = true;
      sessionStorage.setItem('g8-edit-mode', '1');
      try {
        const r = localStorage.getItem(STORAGE_KEY);
        if (r) { const d = JSON.parse(r); if (d.blocks?.length) { state = d; renderAll(); } }
      } catch(e) {}
      applyLockState();
    } else if (pwd !== null) {
      alert('Неверный пароль');
    }
  }
}

function pushUndo() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 30) undoStack.shift();
}

function undo() {
  if (!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderAll();
  hideToast();
}

function showToast(msg) {
  document.getElementById('undo-msg').textContent = msg;
  const el = document.getElementById('undo-toast');
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}

function hideToast() {
  document.getElementById('undo-toast').classList.remove('visible');
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); if (editMode) undo(); }
  if (e.key === 'Escape') closeModal();
});

// ── Confirm modal ─────────────────────────────────────────────────────────────
let pendingAction = null;

function showConfirm(msg, onConfirm) {
  pendingAction = onConfirm;
  document.getElementById('modal-msg').innerHTML = msg;
  document.getElementById('modal-confirm-btn').onclick = () => { closeModal(); onConfirm(); };
  document.getElementById('modal-overlay').classList.add('visible');
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('visible');
  pendingAction = null;
}

// ── Drag state ────────────────────────────────────────────────────────────────
let dragTask = null;  // { taskId, blockId, dirId }
let dragBlock = null; // blockId string
let dragDir = null;   // { dirId, blockId }

// ── Block drag & drop ─────────────────────────────────────────────────────────
// ── Shared DnD helper ─────────────────────────────────────────────────────────
function dndInsertIdx(container, selector, y) {
  const items = [...container.querySelectorAll(`:scope > ${selector}`)];
  for (let i = 0; i < items.length; i++) {
    const r = items[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) return i;
  }
  return items.length;
}
function showIndicator(container, selector, idx, cls) {
  const items = [...container.querySelectorAll(`:scope > ${selector}`)];
  const line = document.createElement('div');
  line.className = cls;
  container.insertBefore(line, items[idx] ?? null);
}

// ── Block drag & drop ─────────────────────────────────────────────────────────
function blockDragStart(event, blockId) {
  if (!editMode) { event.preventDefault(); return; }
  dragBlock = blockId;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', blockId);
  setTimeout(() => {
    const el = document.querySelector(`[data-block="${blockId}"]`);
    if (el) el.classList.add('block-dragging');
  }, 0);
}
function blockDragEnd(event, blockId) {
  dragBlock = null;
  clearBlockDropIndicators();
  const el = document.querySelector(`[data-block="${blockId}"]`);
  if (el) el.classList.remove('block-dragging');
}
function blocksListDragOver(event) {
  if (!dragBlock) return;
  event.preventDefault();
  clearBlockDropIndicators();
  const idx = dndInsertIdx(event.currentTarget, '[data-block]', event.clientY);
  showIndicator(event.currentTarget, '[data-block]', idx, 'block-drop-indicator');
}
function blocksListDrop(event) {
  event.preventDefault();
  clearBlockDropIndicators();
  if (!dragBlock) return;
  const fromIdx = state.blocks.findIndex(b => b.id === dragBlock);
  if (fromIdx === -1) return;
  let toIdx = dndInsertIdx(event.currentTarget, '[data-block]', event.clientY);
  if (fromIdx < toIdx) toIdx--;
  const [moved] = state.blocks.splice(fromIdx, 1);
  state.blocks.splice(toIdx, 0, moved);
  dragBlock = null;
  saveData();
}
function clearBlockDropIndicators() {
  document.querySelectorAll('.block-drop-indicator').forEach(el => el.remove());
}

// ── Direction drag & drop ─────────────────────────────────────────────────────
function dirDragStart(event, blockId, dirId) {
  if (!editMode) { event.preventDefault(); return; }
  dragDir = { dirId, blockId };
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', dirId);
  setTimeout(() => {
    const el = document.querySelector(`[data-dir="${dirId}"]`);
    if (el) el.classList.add('dir-dragging');
  }, 0);
}
function dirDragEnd(event, blockId, dirId) {
  dragDir = null;
  clearDirDropIndicators();
  const el = document.querySelector(`[data-dir="${dirId}"]`);
  if (el) el.classList.remove('dir-dragging');
}
function dirsListDragOver(event, blockId) {
  if (!dragDir) return;
  event.preventDefault();
  event.stopPropagation();
  clearDirDropIndicators();
  const idx = dndInsertIdx(event.currentTarget, '[data-dir]', event.clientY);
  showIndicator(event.currentTarget, '[data-dir]', idx, 'dir-drop-indicator');
}
function dirsListDrop(event, blockId) {
  event.preventDefault();
  event.stopPropagation();
  clearDirDropIndicators();
  if (!dragDir) return;
  const srcBlock = state.blocks.find(b => b.id === dragDir.blockId);
  const dstBlock = state.blocks.find(b => b.id === blockId);
  if (!srcBlock || !dstBlock) return;
  const fromIdx = srcBlock.directions.findIndex(d => d.id === dragDir.dirId);
  if (fromIdx === -1) return;
  let toIdx = dndInsertIdx(event.currentTarget, '[data-dir]', event.clientY);
  const [moved] = srcBlock.directions.splice(fromIdx, 1);
  if (srcBlock === dstBlock && fromIdx < toIdx) toIdx--;
  dstBlock.directions.splice(toIdx, 0, moved);
  dragDir = null;
  saveData();
}
function clearDirDropIndicators() {
  document.querySelectorAll('.dir-drop-indicator').forEach(el => el.remove());
}

function taskDragStart(event, blockId, dirId, taskId) {
  if (!editMode) { event.preventDefault(); return; }
  dragTask = { taskId, blockId, dirId };
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', taskId);
  // Slight delay so the ghost image captures pre-fade state
  setTimeout(() => {
    const el = document.querySelector(`[data-task="${taskId}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
}

function taskDragEnd(event, taskId) {
  dragTask = null;
  clearDropIndicators();
  const el = document.querySelector(`[data-task="${taskId}"]`);
  if (el) el.classList.remove('dragging');
}

// ── Task drag & drop (container-based) ───────────────────────────────────────
function listDragOver(event, dirId) {
  if (!dragTask) return;
  event.preventDefault();
  clearDropIndicators();
  const idx = dndInsertIdx(event.currentTarget, '[data-task]', event.clientY);
  showIndicator(event.currentTarget, '[data-task]', idx, 'drop-indicator');
}

function listDrop(event, blockId, dirId) {
  event.preventDefault();
  clearDropIndicators();
  if (!dragTask) return;

  const srcBlock = state.blocks.find(b => b.id === dragTask.blockId);
  const srcDir = srcBlock && srcBlock.directions.find(d => d.id === dragTask.dirId);
  const tgtBlock = state.blocks.find(b => b.id === blockId);
  const tgtDir = tgtBlock && tgtBlock.directions.find(d => d.id === dirId);
  if (!srcDir || !tgtDir) return;

  const fromIdx = srcDir.tasks.findIndex(t => t.id === dragTask.taskId);
  if (fromIdx === -1) return;
  let toIdx = dndInsertIdx(event.currentTarget, '[data-task]', event.clientY);
  const [moved] = srcDir.tasks.splice(fromIdx, 1);
  if (srcDir === tgtDir && fromIdx < toIdx) toIdx--;
  tgtDir.tasks.splice(toIdx, 0, moved);
  dragTask = null;
  saveData();
}

function clearDropIndicators() {
  document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function today() { return new Date().toISOString().slice(0, 10); }
function formatDate(iso) {
  if (!iso) return '';
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const [y, m, d] = iso.split('-');
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function isOverdue(task) { return !!(task.deadline && task.deadline < today() && task.status !== 'done'); }
function fmtNow() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dotColor(task) {
  if (isOverdue(task)) return 'var(--stripe-overdue)';
  return { todo:'var(--stripe-todo)', 'in-progress':'var(--stripe-progress)', done:'var(--stripe-done)' }[task.status];
}
function getAllResponsibles() {
  const names = new Set();
  state.blocks.forEach(b => b.directions.forEach(d => d.tasks.forEach(t => (t.responsible||[]).forEach(r => names.add(r)))));
  return Array.from(names).sort();
}
function taskMatchesFilter(task) {
  if (filter.responsible !== 'all' && !(task.responsible||[]).includes(filter.responsible)) return false;
  if (filter.status === 'overdue') return isOverdue(task);
  if (filter.status !== 'all' && task.status !== filter.status) return false;
  return true;
}

// ── Filter UI ─────────────────────────────────────────────────────────────────
function setFilterStatus(status) {
  filter.status = status;
  document.querySelectorAll('.filter-btn[data-status]').forEach(btn => {
    const a = btn.dataset.status === status;
    btn.classList.toggle('active', a && status !== 'overdue');
    btn.classList.toggle('active-overdue', a && status === 'overdue');
  });
  syncFilterReset(); applyFilter();
}
function setFilterResponsible(name) { filter.responsible = name; syncFilterReset(); applyFilter(); }
function resetFilter() {
  filter = { responsible: 'all', status: 'all' };
  document.querySelectorAll('.filter-btn[data-status]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === 'all');
    btn.classList.remove('active-overdue');
  });
  const sel = document.getElementById('filter-responsible');
  if (sel) sel.value = 'all';
  syncFilterReset(); applyFilter();
}
function syncFilterReset() {
  const el = document.getElementById('filter-reset');
  if (el) el.style.display = (filter.status !== 'all' || filter.responsible !== 'all') ? '' : 'none';
}
function updateStats() {
  const sel = document.getElementById('filter-responsible');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="all">Все ответственные</option>' +
    getAllResponsibles().map(n => `<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('');
}
function applyFilter() {
  document.querySelectorAll('[data-task]').forEach(el => {
    const taskId = el.dataset.task;
    let task = null;
    outer: for (const b of state.blocks) for (const d of b.directions) {
      const t = d.tasks.find(t => t.id === taskId); if (t) { task = t; break outer; }
    }
    el.style.display = task && taskMatchesFilter(task) ? '' : 'none';
  });
  const isFiltered = filter.responsible !== 'all' || filter.status !== 'all';
  document.querySelectorAll('[data-dir]').forEach(dirEl => {
    if (!isFiltered) { dirEl.style.display = ''; return; }
    const ws = Array.from(dirEl.querySelectorAll('[data-task]'));
    dirEl.style.display = ws.some(w => w.style.display !== 'none') ? '' : 'none';
  });
  document.querySelectorAll('[data-block]').forEach(blockEl => {
    if (!isFiltered) { blockEl.style.display = ''; return; }
    const ds = Array.from(blockEl.querySelectorAll('[data-dir]'));
    blockEl.style.display = ds.some(d => d.style.display !== 'none') ? '' : 'none';
  });
}

// ── Task expand / history ─────────────────────────────────────────────────────
function applyExpandAll(ids, open) {
  ids.forEach(id => {
    open ? expandedTasks.add(id) : expandedTasks.delete(id);
    open ? openHistories.add(id) : openHistories.delete(id);
    const detail   = document.getElementById(`detail-${id}`);
    const row      = document.getElementById(`row-${id}`);
    const chev     = document.getElementById(`chev-${id}`);
    const histBody = document.getElementById(`hist-body-${id}`);
    const histBtn  = document.getElementById(`hist-btn-${id}`);
    if (detail)   detail.style.display = open ? 'block' : 'none';
    if (row)      row.classList.toggle('is-expanded', open);
    if (chev)     chev.classList.toggle('open', open);
    if (histBody) histBody.style.display = open ? 'block' : 'none';
    if (histBtn)  { histBtn.classList.toggle('open', open); syncHistBtn(id, histBtn); }
  });
}
function matchedTaskIds(tasks) {
  return tasks.filter(t => taskMatchesFilter(t)).map(t => t.id);
}
function expandDir(d) {
  if (!d.collapsed) return;
  d.collapsed = false;
  const dirEl = document.querySelector(`[data-dir="${d.id}"]`);
  if (dirEl) {
    const coll = dirEl.querySelector(':scope > .collapsible');
    const chev = dirEl.querySelector('.direction-header .block-chevron');
    if (coll) coll.classList.remove('collapsed');
    if (chev) chev.classList.add('open');
  }
}
function toggleAllTasksInDir(blockId, dirId) {
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  if (!d) return;
  const ids = matchedTaskIds(d.tasks);
  if (!ids.length) return;
  const allOpen = ids.every(id => expandedTasks.has(id) && openHistories.has(id));
  if (!allOpen) expandDir(d);
  applyExpandAll(ids, !allOpen);
  if (!allOpen) saveData();
}
function toggleAllTasksInBlock(blockId) {
  const b = state.blocks.find(b => b.id === blockId);
  if (!b) return;
  const ids = matchedTaskIds(b.directions.flatMap(d => d.tasks));
  if (!ids.length) return;
  const allOpen = ids.every(id => expandedTasks.has(id) && openHistories.has(id));
  if (!allOpen) b.directions.forEach(d => { if (matchedTaskIds(d.tasks).length) expandDir(d); });
  applyExpandAll(ids, !allOpen);
  if (!allOpen) saveData();
}
function handleTitleFullClick(event, taskId) {
  event.stopPropagation();
  if (editMode) {
    const span = event.currentTarget;
    const textWidth = measureTextPx(span.textContent || '', span);
    const clickX = event.clientX - span.getBoundingClientRect().left;
    if (clickX <= textWidth + 8) { startEditTitle(taskId); return; }
  }
  toggleTask(taskId);
}
function startEditTitle(taskId) {
  const span = document.getElementById(`task-title-${taskId}`);
  const inp  = document.getElementById(`task-inp-${taskId}`);
  if (!inp) return;
  if (span) span.style.display = 'none';
  inp.style.display = 'block';
  inp.focus();
  inp.select();
}
function endEditTitle(taskId) {
  const span = document.getElementById(`task-title-${taskId}`);
  const inp  = document.getElementById(`task-inp-${taskId}`);
  if (!inp) return;
  inp.style.display = 'none';
  if (span) span.style.display = '';
}
function toggleTask(taskId) {
  expandedTasks.has(taskId) ? expandedTasks.delete(taskId) : expandedTasks.add(taskId);
  const detail = document.getElementById(`detail-${taskId}`);
  const row    = document.getElementById(`row-${taskId}`);
  const chev   = document.getElementById(`chev-${taskId}`);
  const open   = expandedTasks.has(taskId);
  if (detail) detail.style.display = open ? 'block' : 'none';
  if (row)    row.classList.toggle('is-expanded', open);
  if (chev)   chev.classList.toggle('open', open);
  if (open && !openHistories.has(taskId)) {
    let logCount = 0;
    outer: for (const b of state.blocks) for (const d of b.directions) {
      const t = d.tasks.find(t => t.id === taskId);
      if (t) { logCount = (t.log || []).length; break outer; }
    }
    if (logCount > 0) {
      openHistories.add(taskId);
      const body = document.getElementById(`hist-body-${taskId}`);
      const btn  = document.getElementById(`hist-btn-${taskId}`);
      if (body) body.style.display = 'block';
      if (btn) { btn.classList.add('open'); syncHistBtn(taskId, btn); }
    }
  }
}
function handleTaskInputCursor(event, taskId) { /* no-op */ }
function handleTaskRowClick(event, taskId) {
  const t = event.target;
  if (t.classList.contains('status-dot') || t.classList.contains('drag-handle') ||
      t.classList.contains('task-row-input') ||
      t.classList.contains('resp-chip') || t.classList.contains('resp-sep')) return;
  toggleTask(taskId);
}
function showRespInput(taskId) {
  const btn  = document.getElementById(`resp-btn-${taskId}`);
  const wrap = document.getElementById(`resp-wrap-${taskId}`);
  const inp  = document.getElementById(`resp-inp-${taskId}`);
  if (btn)  btn.style.display = 'none';
  if (wrap) wrap.classList.add('open');
  if (inp)  inp.focus();
}
function hideRespInput(taskId) {
  setTimeout(() => {
    const wrap = document.getElementById(`resp-wrap-${taskId}`);
    if (wrap && !wrap.contains(document.activeElement)) {
      const btn = document.getElementById(`resp-btn-${taskId}`);
      wrap.classList.remove('open');
      if (btn) btn.style.display = '';
    }
  }, 200);
}
function triggerLogInput(blockId, dirId, taskId) {
  if (!openHistories.has(taskId)) {
    openHistories.add(taskId);
    const body = document.getElementById(`hist-body-${taskId}`);
    const btn  = document.getElementById(`hist-btn-${taskId}`);
    if (body) body.style.display = 'block';
    if (btn)  { btn.classList.add('open'); syncHistBtn(taskId, btn); }
  }
  showLogInput(blockId, dirId, taskId);
}
function toggleHistory(taskId) {
  openHistories.has(taskId) ? openHistories.delete(taskId) : openHistories.add(taskId);
  const body = document.getElementById(`hist-body-${taskId}`);
  const btn  = document.getElementById(`hist-btn-${taskId}`);
  const open = openHistories.has(taskId);
  if (body) body.style.display = open ? 'block' : 'none';
  if (btn) { btn.classList.toggle('open', open); syncHistBtn(taskId, btn); }
}
function syncHistBtn(taskId, btn) {
  let count = 0;
  outer: for (const b of state.blocks) for (const d of b.directions) {
    const t = d.tasks.find(t => t.id === taskId); if (t) { count = (t.log||[]).length; break outer; }
  }
  btn.textContent = `История${count > 0 ? ` (${count})` : ''} ${openHistories.has(taskId) ? '▴' : '▾'}`;
}
function showLogInput(blockId, dirId, taskId) {
  const btn = document.getElementById(`log-new-btn-${taskId}`);
  const add = document.getElementById(`log-add-${taskId}`);
  if (btn) btn.style.display = 'none';
  if (add) add.style.display = 'flex';
  const inp = document.getElementById(`log-input-${taskId}`);
  if (inp) inp.focus();
}
function hideLogInput(taskId) {
  const inp = document.getElementById(`log-input-${taskId}`);
  if (inp) { inp.value = ''; inp.style.height = 'auto'; }
  const add = document.getElementById(`log-add-${taskId}`);
  if (add) add.style.display = 'none';
  const btn = document.getElementById(`log-new-btn-${taskId}`);
  if (btn) btn.style.display = 'block';
}
function handleLogKey(e, blockId, dirId, taskId) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addLogEntry(blockId, dirId, taskId); }
  else if (e.key === 'Escape') { hideLogInput(taskId); }
}
function addLogEntry(blockId, dirId, taskId) {
  const inp = document.getElementById(`log-input-${taskId}`);
  if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (!t) return;
  if (!t.log) t.log = [];
  t.log.push({ date: fmtNow(), text });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  refreshLogEntries(blockId, dirId, taskId, t);
  hideLogInput(taskId);
}
function refreshLogEntries(blockId, dirId, taskId, t) {
  const el = document.getElementById(`log-entries-${taskId}`);
  if (el) el.innerHTML = renderLogEntries(t.log, blockId, dirId, taskId);
  const btn = document.getElementById(`hist-btn-${taskId}`); if (btn) syncHistBtn(taskId, btn);
}
function renderLogEntries(log, blockId, dirId, taskId) {
  const btn = `<button class="log-new-btn" id="log-new-btn-${taskId}" onclick="showLogInput('${blockId}','${dirId}','${taskId}')">+</button>`;
  if (!log || log.length === 0) return btn;
  const last = log.length - 1;
  return log.map((e, i) => `
    <div class="log-entry" id="log-entry-${taskId}-${i}">
      ${i === last ? btn : '<span class="log-slot"></span>'}
      <span class="log-date">${esc(e.date)}</span>
      <span class="log-text">${esc(e.text)}</span>
      <div class="log-entry-actions">
        <button class="log-edit-btn" title="Редактировать"
                onclick="startEditLog('${blockId}','${dirId}','${taskId}',${i})">✎</button>
        <button class="log-del-btn"  title="Удалить"
                onclick="deleteLog('${blockId}','${dirId}','${taskId}',${i})">×</button>
      </div>
    </div>`).reverse().join('');
}
function startEditLog(blockId, dirId, taskId, idx) {
  const entry = document.getElementById(`log-entry-${taskId}-${idx}`);
  if (!entry) return;
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (!t) return;
  const current = (t.log[idx] || {}).text || '';
  const dateSpan = entry.querySelector('.log-date');
  const textSpan = entry.querySelector('.log-text');
  const actions  = entry.querySelector('.log-entry-actions');
  textSpan.style.display = 'none';
  actions.style.display  = 'none';
  const ta = document.createElement('textarea');
  ta.className = 'log-edit-area';
  ta.value = current;
  ta.rows = 1;
  ta.style.height = 'auto';
  entry.insertBefore(ta, actions);
  ta.style.height = ta.scrollHeight + 'px';
  ta.focus();
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  const save = () => {
    const val = ta.value.trim();
    if (val && val !== current) {
      t.log[idx].text = val;
      saveData();
    }
    refreshLogEntries(blockId, dirId, taskId, t);
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') { ta.value = current; ta.blur(); }
  });
  ta.addEventListener('blur', save);
}
function deleteLog(blockId, dirId, taskId, idx) {
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (!t) return;
  pushUndo();
  const short = (t.log[idx]?.text || '').slice(0, 40) || 'Запись';
  t.log.splice(idx, 1);
  saveData();
  refreshLogEntries(blockId, dirId, taskId, t);
  showToast(`«${short}» удалена`);
}

// ── State mutations ───────────────────────────────────────────────────────────
function addBlock() {
  state.blocks.push({ id: genId(), title: '', collapsed: true, directions: [] });
  saveData();
  setTimeout(() => {

function addResponsible(blockId, dirId, taskId, name) {
  if (!name.trim()) return;
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (t && !(t.responsible||[]).includes(name.trim())) {
    pushUndo();
    if (!t.responsible) t.responsible = [];
    t.responsible.push(name.trim()); saveData();
  }
}
function removeResponsible(blockId, dirId, taskId, name) {
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (t) { pushUndo(); t.responsible = (t.responsible||[]).filter(r => r !== name); saveData(); }
}
function handleResponsibleKey(event, blockId, dirId, taskId) {
  if (event.key === 'Enter' || event.key === ',') {
    event.preventDefault();
    addResponsible(blockId, dirId, taskId, event.target.value);
  } else if (event.key === 'Escape') {
    event.target.value = '';
    hideAC(taskId);
    hideRespInput(taskId);
  } else if (event.key === 'ArrowDown') {
    event.preventDefault();
    const first = document.querySelector(`#ac-${taskId} .autocomplete-item`);
    if (first) first.focus();
  }
}

// ── Responsible autocomplete ──────────────────────────────────────────────────
const _acCache = {}; // taskId → suggestions array

function showAC(inp, blockId, dirId, taskId) {
  const query = inp.value.trim().toLowerCase();
  const list  = document.getElementById('ac-' + taskId);
  if (!list) return;

  if (!query) { list.style.display = 'none'; return; }

  // Exclude already-assigned names
  let current = [];
  outer: for (const b of state.blocks) for (const d of b.directions) {
    const t = d.tasks.find(t => t.id === taskId);
    if (t) { current = t.responsible || []; break outer; }
  }

  const suggestions = getAllResponsibles().filter(n =>
    !current.includes(n) && n.toLowerCase().startsWith(query)
  );

  _acCache[taskId] = suggestions;

  if (!suggestions.length) { list.style.display = 'none'; return; }

  list.innerHTML = suggestions.map((name, i) => {
    // Highlight matching part
    const lo = name.toLowerCase(), qi = lo.indexOf(query);
    const highlighted = qi >= 0
      ? esc(name.slice(0, qi)) + '<mark>' + esc(name.slice(qi, qi + query.length)) + '</mark>' + esc(name.slice(qi + query.length))
      : esc(name);
    return `<div class="autocomplete-item" tabindex="-1"
      onmousedown="event.preventDefault();pickAC('${blockId}','${dirId}','${taskId}',${i})"
      onkeydown="acItemKey(event,'${blockId}','${dirId}','${taskId}',${i})"
    >${highlighted}</div>`;
  }).join('');
  list.style.display = 'block';
}

function hideAC(taskId) {
  const l = document.getElementById('ac-' + taskId);
  if (l) l.style.display = 'none';
}

function pickAC(blockId, dirId, taskId, idx) {
  const name = (_acCache[taskId] || [])[idx];
  if (name) addResponsible(blockId, dirId, taskId, name);
}

function acItemKey(event, blockId, dirId, taskId, idx) {
  if (event.key === 'Enter') { event.preventDefault(); pickAC(blockId, dirId, taskId, idx); }
  else if (event.key === 'ArrowDown') { event.preventDefault(); const next = event.target.nextElementSibling; if (next) next.focus(); }
  else if (event.key === 'ArrowUp')   { event.preventDefault(); const prev = event.target.previousElementSibling; if (prev) prev.focus(); else document.getElementById('ac-' + taskId)?.previousElementSibling?.focus(); }
  else if (event.key === 'Escape')    { hideAC(taskId); }
}

// ── Progress ──────────────────────────────────────────────────────────────────
function blockProgress(block) {
  let total = 0, done = 0;
  block.directions.forEach(d => d.tasks.forEach(t => { total++; if (t.status === 'done') done++; }));
  return total === 0 ? null : { total, done, pct: Math.round((done/total)*100) };
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  const container = document.getElementById('blocks-list');
  const empty = document.getElementById('empty-state');
  const focused = document.activeElement;
  const focusedId = focused ? focused.dataset.focusId : null;

  container.innerHTML = '';
  if (state.blocks.length === 0) { empty.style.display = 'block'; }
  else { empty.style.display = 'none'; state.blocks.forEach(b => container.appendChild(renderBlock(b))); }

  if (focusedId) {
    const el = document.querySelector(`[data-focus-id="${focusedId}"]`);
    if (el) { el.focus(); if (el.setSelectionRange) { const l = el.value.length; el.setSelectionRange(l,l); } }
  }

  autoResizeAllInputs();
  updateStats(); applyFilter();
}

function esc(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Input auto-resize (text width + ~1cm so only text zone is editable) ───────
function measureTextPx(text, el) {
  const style = getComputedStyle(el);
  const canvas = measureTextPx._c || (measureTextPx._c = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  ctx.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  return ctx.measureText(text).width;
}
function autoResizeInput(inp) {
  if (!inp) return;
  const text = inp.value || inp.getAttribute('placeholder') || '';
  const w = measureTextPx(text, inp) + 38;
  inp.style.width = Math.max(parseInt(inp.style.minWidth) || 40, w) + 'px';
}
function autoResizeAllInputs() {
  document.querySelectorAll('.block-title-input, .direction-title-input').forEach(autoResizeInput);
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportData() {
  let text = `G8 TRACKER — ЭКСПОРТ\n${'='.repeat(50)}\n\n`;
  state.blocks.forEach(b => {
    text += `▌ ${b.title||'(без названия)'}\n`;
    b.directions.forEach(d => {
      text += `  ◆ ${d.title||'(без названия)'}`;
      if (d.description) text += `\n    ${d.description}`;
      text += '\n';
      d.tasks.forEach(t => {
        const icon = {todo:'○','in-progress':'◐',done:'●'}[t.status];
        text += `    ${icon} ${t.text||'(без текста)'}${isOverdue(t)?' ⚠':''}`;
        if (t.deadline) text += ` [до ${t.deadline}]`;
        if ((t.responsible||[]).length) text += ` (${t.responsible.join(', ')})`;
        text += '\n';
        (t.log||[]).forEach(e => { text += `      · ${e.date}: ${e.text}\n`; });
      });
      text += '\n';
    });
  });
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `g8-tracker-${new Date().toISOString().slice(0,10)}.txt`;
  a.click(); URL.revokeObjectURL(url);
}

// ── Export menu ──────────────────────────────────────────────────────────────
function toggleExportMenu() {
  document.getElementById('export-menu').classList.toggle('open');
}
function closeExportMenu() {
  document.getElementById('export-menu').classList.remove('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#export-wrap')) closeExportMenu();
});

// ── Export JSON (backup) ──────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `g8-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.blocks) { alert('Файл не подходит — это не резервная копия G8 Tracker'); return; }
        if (!confirm(`Загрузить резервную копию?\n\nЭто заменит все текущие данные (${state.blocks.length} блоков → ${data.blocks.length} блоков).`)) return;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        location.reload();
      } catch(e) { alert('Ошибка чтения файла'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── Collapse / Expand all ─────────────────────────────────────────────────────
function collapseAll() {
  state.blocks.forEach(b => {
    b.collapsed = true;
    b.directions.forEach(d => { d.collapsed = true; });
  });
  editMode ? saveData() : renderAll();
}

function expandAll() {
  state.blocks.forEach(b => {
    b.collapsed = false;
    b.directions.forEach(d => { d.collapsed = false; });
  });
  editMode ? saveData() : renderAll();
}

// ── Print / PDF ───────────────────────────────────────────────────────────────
window.addEventListener('beforeprint', () => {
  const now = new Date();
  const dateStr = now.toLocaleString('ru', { dateStyle: 'short', timeStyle: 'short' });
  const el = document.getElementById('print-date');
  if (el) el.textContent = dateStr;
  // Имя PDF-файла = заголовок страницы
  const fileDate = now.toLocaleDateString('ru', { day: '2-digit', month: '2-digit', year: 'numeric' });
  document.title = `G8 Tracker ${fileDate}`;
});
window.addEventListener('afterprint', () => {
  document.title = 'G8 Tracker';
});

function printPDF() {
  window.print();
}

init();
</script>
