<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G8 Tracker</title>
<meta name="theme-color" content="#2A1F12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23DCF04A'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='28' fill='%232A1F12'%3EG8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #F5F2E8;
    --side: #2A1F12;
    --side-text: #EFE8D6;
    --side-muted: #A99C84;
    --side-hover: rgba(239,232,214,0.06);
    --side-line: rgba(239,232,214,0.10);
    --lime: #DCF04A;
    --lime-soft: rgba(220,240,74,0.14);
    --lime-ring: rgba(220,240,74,0.55);
    --text: #2A1F12;
    --text-2: #7A6E58;
    --text-3: #A39780;
    --line: #E4DCC6;
    --line-strong: #D9CFB6;
    --line-hover: #C9BD9F;
    --row-line: #EEE8D8;
    --card: #FFFDF7;
    --card-line: #E6DFCC;
    --note-bg: #F3EEE0;
    --note-text: #5E5340;
    --status-active: #B5AA92;
    --status-done: #8FAA5C;
    --done-text: #A39880;
    --attention: #E39B2D;
    --danger: #B8371F;
    --handle: #5C4B33;
    --shadow-pop: 0 18px 44px -14px rgba(42,31,18,.30), 0 2px 6px rgba(42,31,18,.06);
    --font-ui: 'Manrope', system-ui, sans-serif;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --panel-w: 264px;
    --hdr-h: 56px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-ui); font-size: 14px; line-height: 1.45; color: var(--text);
    background: var(--page); overflow: hidden;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  [hidden] { display: none !important; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; display: block; }
  span[data-icon] { display: inline-flex; align-items: center; }
  mark { background: var(--lime-ring); color: inherit; border-radius: 3px; padding: 0 1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  ::selection { background: rgba(220,240,74,.6); color: var(--text); }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  body.locked .edit-only { display: none !important; }

  /* ── Каркас ── */
  .app-shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; container: main / inline-size; }
  .right-panel {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 28px; position: relative;
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
  }
  .right-panel::-webkit-scrollbar { width: 12px; }
  .right-panel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 12px; border: 3px solid var(--page); }
  .panel-overlay { display: none; position: fixed; inset: 0; background: rgba(42,31,18,.5); z-index: 90; }
  .panel-overlay.visible { display: block; }
  .print-area { display: none; }

  /* ── Оглавление (левая колонка) ── */
  .left-panel {
    width: var(--panel-w); flex-shrink: 0; min-height: 0; position: relative; z-index: 20;
    display: flex; flex-direction: column; background: var(--side); color: var(--side-text);
  }
  .left-panel :focus-visible { outline-color: var(--lime); }
  .nav-logo { height: var(--hdr-h); flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--lime); color: #2A1F12; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 1;
  }
  .logo-word { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: var(--side-text); white-space: nowrap; }
  .nav-close-btn { display: none; margin-left: auto; width: 34px; height: 34px; border: none; border-radius: 9px; background: transparent; color: var(--side-muted); align-items: center; justify-content: center; }
  .nav-close-btn:hover { background: var(--side-hover); color: var(--side-text); }
  .nav-close-btn svg { width: 20px; height: 20px; }
  .nav-scroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px 8px 32px;
    scrollbar-width: thin; scrollbar-color: rgba(239,232,214,.16) transparent;
  }
  .nav-scroll::-webkit-scrollbar { width: 10px; }
  .nav-scroll::-webkit-scrollbar-thumb { background: rgba(239,232,214,.16); border-radius: 10px; border: 3px solid var(--side); }

  .toc-block { margin-top: 8px; }
  .toc-block:first-child { margin-top: 0; }
  .toc-block-row {
    position: relative; display: flex; align-items: flex-start; gap: 6px; min-height: 30px; padding: 5px 26px 5px 3px;
    border-radius: 7px; cursor: pointer; outline: none; transition: background .12s;
  }
  .toc-block-row:hover { background: var(--side-hover); }
  .toc-block-row:focus-visible { box-shadow: inset 0 0 0 1.5px rgba(220,240,74,.6); }
  .toc-block-row.is-focus { background: var(--lime-soft); }
  .toc-chev {
    width: 20px; height: 20px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 5px; background: transparent; color: var(--side-muted); transition: transform .15s, background .12s, color .12s;
  }
  .toc-chev svg { width: 14px; height: 14px; }
  .toc-chev:hover { background: rgba(239,232,214,.12); color: var(--side-text); }
  .toc-block.is-toc-collapsed .toc-chev { transform: rotate(-90deg); }
  .toc-square, .toc-color-btn { width: 9px; height: 9px; margin-top: 5.5px; border-radius: 3px; background: var(--bc); flex-shrink: 0; border: none; padding: 0; }
  .toc-color-btn { position: relative; cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .toc-color-btn::before { content: ''; position: absolute; inset: -7px; border-radius: 6px; }
  .toc-color-btn:hover { transform: scale(1.25); box-shadow: 0 0 0 2px var(--side), 0 0 0 3.5px var(--side-muted); }
  .toc-block-name {
    flex: 1; min-width: 0; padding-top: 1px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    line-height: 1.5; color: var(--side-muted); overflow-wrap: anywhere; transition: color .12s;
  }
  .toc-block-row:hover .toc-block-name { color: var(--side-text); }
  .toc-block-row.is-focus .toc-block-name { color: var(--lime); }
  .toc-dirs { display: flex; flex-direction: column; margin: 1px 0 2px; }
  .toc-block.is-toc-collapsed .toc-dirs { display: none; }
  .toc-dir {
    position: relative; min-height: 30px; padding: 6px 8px 6px 29px; border-radius: 7px; font-size: 13px; line-height: 1.38;
    color: var(--side-text); cursor: pointer; outline: none; overflow-wrap: anywhere; transition: background .12s, color .12s, opacity .12s;
  }
  .toc-dir:hover { background: var(--side-hover); }
  .toc-dir:focus-visible { box-shadow: inset 0 0 0 1.5px rgba(220,240,74,.6); }
  .toc-dir.is-current { background: var(--lime-soft); color: var(--lime); font-weight: 700; }
  .toc-dir.is-dim { opacity: .38; }
  .toc-untitled { font-style: italic; opacity: .6; text-transform: none; letter-spacing: 0; font-weight: 500; }

  .block-drag-handle, .dir-drag-handle { display: none; position: absolute; color: var(--side-muted); opacity: 0; cursor: grab; transition: opacity .12s; }
  body:not(.locked) .block-drag-handle, body:not(.locked) .dir-drag-handle { display: block; }
  .block-drag-handle { right: 6px; top: 8px; }
  .dir-drag-handle { left: 9px; top: 8px; }
  .block-drag-handle svg, .dir-drag-handle svg { width: 14px; height: 14px; }
  .toc-block-row:hover .block-drag-handle, .toc-dir:hover .dir-drag-handle { opacity: .75; }
  .nav-empty { color: var(--side-muted); font-size: 12px; line-height: 1.5; padding: 16px 10px; }
  .toc-block.block-dragging, .toc-dir.dir-dragging { opacity: .35; }
  .block-drop-indicator, .dir-drop-indicator { height: 2px; margin: 2px 10px; border-radius: 2px; background: var(--lime); pointer-events: none; }

  /* ── Ручка ширины колонки ── */
  .panel-resizer { width: 8px; margin: 0 -4px; flex-shrink: 0; position: relative; z-index: 30; cursor: col-resize; touch-action: none; outline: none; }
  .panel-resizer::after {
    content: ''; position: absolute; top: 50%; left: -1px; width: 4px; height: 40px; margin-top: -20px;
    border-radius: 2px; background: var(--handle); transition: background .15s;
  }
  .panel-resizer:hover::after, .panel-resizer:focus-visible::after, body.is-resizing .panel-resizer::after { background: var(--lime); }
  body.is-resizing, body.is-resizing * { cursor: col-resize !important; user-select: none !important; -webkit-user-select: none !important; }

  /* ── Шапка: одна строка ── */
  .main-header {
    min-height: var(--hdr-h); flex-shrink: 0; display: flex; align-items: center; flex-wrap: nowrap; gap: 8px; padding: 0 24px;
    border-bottom: 1px solid var(--line); background: var(--page); position: relative; z-index: 15;
  }
  .hdr-spacer { flex: 1 1 0; min-width: 0; }
  .hdr-break { display: none; }
  .icon-btn, .hdr-btn {
    height: 34px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; position: relative;
    border-radius: 9px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); transition: background .15s, border-color .15s;
  }
  .icon-btn { width: 34px; }
  .hdr-btn { padding: 0 11px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .icon-btn:hover, .hdr-btn:hover { border-color: var(--line-hover); background: #fff; }
  .icon-btn svg, .hdr-btn svg { width: 16px; height: 16px; }
  .hdr-btn.is-active { border-color: var(--text); }
  .hdr-dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--attention); box-shadow: 0 0 0 2px var(--card); }
  .hamburger-btn { display: none; }
  .lock-btn.unlocked { background: var(--lime); border-color: #C2D53A; }
  .lock-btn.unlocked:hover { background: #E4F566; }

  .season-wrap { position: relative; flex-shrink: 0; min-width: 0; }
  .season-pill {
    min-height: 30px; max-width: 260px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 13px; border-radius: 16px;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--text); font-size: 12px; font-weight: 700; line-height: 1.2;
    text-align: left; transition: border-color .15s;
  }
  .season-pill:hover { border-color: var(--line-hover); }
  #season-pill-label { min-width: 0; overflow-wrap: anywhere; }
  .season-wrap.open .season-pill { border-color: var(--text); }
  .season-pill-chev { display: inline-flex; color: var(--text-2); transition: transform .15s; flex-shrink: 0; }
  .season-pill-chev svg { width: 14px; height: 14px; }
  .season-wrap.open .season-pill-chev { transform: rotate(180deg); }

  .season-menu, .export-menu, .filter-menu, .autocomplete-list, .color-palette-popup {
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow-pop); font-family: var(--font-ui);
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .season-menu { display: none; position: absolute; top: calc(100% + 8px); left: 0; width: 310px; max-width: calc(100vw - 24px); padding: 6px; z-index: 600; }
  .season-wrap.open .season-menu { display: block; animation: pop-in .12s ease-out; }
  .season-menu-head, .fm-section { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); padding: 8px 10px 6px; }
  .season-list { max-height: 50vh; overflow-y: auto; }
  .season-item { display: flex; align-items: center; gap: 2px; border-radius: 8px; }
  .season-item:hover { background: var(--note-bg); }
  .season-item-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: none; border-radius: 8px; background: transparent;
    padding: 9px 8px 9px 6px; text-align: left; font-size: 13px; font-weight: 500; color: var(--text);
  }
  .season-item.active .season-item-main { font-weight: 700; }
  .season-check, .fm-check { width: 18px; display: inline-flex; justify-content: center; color: var(--status-done); flex-shrink: 0; }
  .season-item-name { overflow-wrap: anywhere; }
  .season-item-meta { margin-left: auto; padding-left: 8px; font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .season-item-actions { display: flex; gap: 2px; padding-right: 4px; }
  .season-icon-btn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 7px; background: transparent; color: var(--text-2); }
  .season-icon-btn:hover { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
  .season-icon-btn.danger:hover { color: var(--danger); }
  .season-icon-btn.is-disabled, .season-icon-btn.is-disabled:hover { opacity: .3; cursor: not-allowed; background: transparent; box-shadow: none; color: var(--text-2); }
  .season-new-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 6px; padding: 11px 10px 7px 8px; border: none; border-top: 1px solid var(--line);
    background: transparent; font-size: 13px; font-weight: 600; color: var(--text); text-align: left;
  }
  .season-new-btn svg { color: var(--text-2); }
  body.locked .season-item-actions, body.locked .season-new-btn { display: none; }

  .search-wrap { position: relative; min-width: 140px; flex: 0 1 340px; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); display: flex; color: var(--text-2); pointer-events: none; }
  .search-input {
    width: 100%; height: 34px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--card);
    padding: 0 10px 0 34px; font-size: 13px; font-weight: 500; color: var(--text); outline: none;
    -webkit-appearance: none; appearance: none; transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap.has-value .search-input { padding-right: 86px; }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:hover { border-color: var(--line-hover); }
  .search-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .search-input::-webkit-search-cancel-button, .search-input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
  .search-count {
    position: absolute; right: 34px; top: 50%; transform: translateY(-50%); display: none; pointer-events: none;
    font-size: 11px; font-weight: 700; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .search-count.is-zero { color: var(--text-3); }
  .search-wrap.has-value .search-count { display: block; }
  .search-clear {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border: none; border-radius: 7px;
    background: transparent; color: var(--text-2); display: none; align-items: center; justify-content: center;
  }
  .search-wrap.has-value .search-clear { display: inline-flex; }
  .search-clear:hover { background: var(--note-bg); color: var(--text); }

  .mode-switch { display: inline-flex; flex-shrink: 0; height: 34px; padding: 2px; gap: 2px; border-radius: 9px; background: #ECE5D3; border: 1px solid var(--line-strong); }
  .mode-btn { border: none; border-radius: 7px; background: transparent; padding: 0 12px; font-size: 12px; font-weight: 700; color: var(--text-2); white-space: nowrap; }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(42,31,18,.14); }

  .filter-wrap { position: relative; flex-shrink: 0; }
  .filter-menu { display: none; position: absolute; right: 0; top: calc(100% + 8px); width: 290px; max-width: calc(100vw - 24px); padding: 6px; z-index: 600; }
  .filter-wrap.open .filter-menu { display: block; animation: pop-in .12s ease-out; }
  .fm-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px 7px 4px; border: none; border-radius: 7px;
    background: transparent; font-size: 13px; color: var(--text); text-align: left;
  }
  .fm-item:hover { background: var(--note-bg); }
  .fm-item.active { font-weight: 700; }
  .fm-name { min-width: 0; overflow-wrap: anywhere; }
  .fm-list { max-height: min(38vh, 320px); overflow-y: auto; }
  .fm-sep { height: 1px; margin: 6px 4px; background: var(--line); }
  .fm-reset {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 8px 6px 6px; border: none; border-radius: 7px;
    background: transparent; font-size: 13px; font-weight: 600; color: var(--text-2); text-align: left;
  }
  .fm-reset:hover { color: var(--text); background: var(--note-bg); }

  .export-wrap { position: relative; flex-shrink: 0; }
  .export-btn {
    height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 11px 0 12px; border: none; border-radius: 9px;
    background: var(--side); color: var(--page); font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .15s;
  }
  .export-btn:hover { background: #3A2C1A; }
  .export-chev { display: inline-flex; opacity: .55; }
  .export-chev svg { width: 14px; height: 14px; }
  .export-menu { display: none; position: absolute; right: 0; top: calc(100% + 8px); width: 300px; max-width: calc(100vw - 24px); padding: 6px; z-index: 600; }
  .export-menu.open { display: block; animation: pop-in .12s ease-out; }
  .export-menu-item {
    display: flex; align-items: flex-start; gap: 11px; width: 100%; padding: 9px 10px; border: none; border-radius: 8px;
    background: transparent; color: var(--text); text-align: left;
  }
  .export-menu-item:hover:not(:disabled) { background: var(--note-bg); }
  .export-menu-item:disabled { opacity: .45; }
  .export-menu-item .i { color: var(--text-2); margin-top: 1px; }
  .emi-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .emi-sub { font-size: 12px; font-weight: 500; color: var(--text-2); }
  .export-sep { height: 1px; margin: 6px 4px; background: var(--line); }

  @container main (max-width: 1020px) { .fold-label { display: none; } #fold-btn { width: 34px; padding: 0; } }
  @container main (max-width: 720px) {
    .filter-label, .export-label, .export-chev { display: none !important; }
    #filter-btn { width: 34px; padding: 0; }
    .export-btn { width: 34px; padding: 0; justify-content: center; }
  }
  @container main (max-width: 620px) {
    .main-header { flex-wrap: wrap; row-gap: 8px; padding-top: 10px; padding-bottom: 10px; }
    .hdr-break { display: block; flex-basis: 100%; height: 0; order: 6; }
    .hamburger-btn { order: 1; } .season-wrap { order: 2; } .hdr-spacer { order: 3; }
    .lock-btn { order: 4; } .export-wrap { order: 5; }
    .search-wrap { order: 7; flex: 1 1 0; } .mode-switch { order: 8; } .filter-wrap { order: 9; } #fold-btn { order: 10; }
    .mode-btn { padding: 0 10px; }
  }

  /* ── Лента «карта» ── */
  .map-feed { max-width: 1040px; padding: 8px 0 40vh; }
  .focus-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 12px 0 2px; font-size: 13px; color: var(--text-2); }
  .focus-back {
    display: inline-flex; align-items: center; gap: 6px; margin-left: -8px; padding: 4px 8px; border: none; border-radius: 7px;
    background: transparent; font-weight: 700; color: var(--text);
  }
  .focus-back:hover { background: var(--note-bg); }
  .focus-back .i { width: 15px; height: 15px; }
  .focus-sep { color: var(--text-3); }
  .focus-name { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); overflow-wrap: anywhere; }
  .focus-name::before { content: ''; width: 9px; height: 9px; border-radius: 3px; background: var(--bc); flex-shrink: 0; }
  .filter-note {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; padding: 8px 12px; border-radius: 8px;
    background: var(--note-bg); font-size: 12px; color: var(--note-text);
  }
  .filter-note b { font-weight: 700; color: var(--text); }
  .link-btn { border: none; background: transparent; padding: 0; font-size: 12px; font-weight: 700; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .map-empty { margin-top: 24px; padding: 24px 20px; border: 1px dashed var(--line-strong); border-radius: 10px; text-align: center; font-size: 14px; color: var(--text-2); }

  .map-block { margin-top: 10px; }
  .block-sticky { position: sticky; top: 0; z-index: 5; padding-top: 10px; background: var(--page); }
  .block-plate {
    display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 8px 6px 6px; border-radius: 8px;
    background: var(--bc); color: var(--bt); cursor: pointer;
  }
  .plate-chev, .plate-btn {
    width: 28px; height: 28px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; background: transparent; color: inherit; transition: transform .15s, background .12s, opacity .12s;
  }
  .plate-chev { opacity: .75; }
  .plate-chev:hover, .plate-btn:hover { background: color-mix(in srgb, currentColor 14%, transparent); opacity: 1; }
  .map-block.is-collapsed .plate-chev { transform: rotate(-90deg); }
  .plate-title {
    flex: 0 1 auto; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.3; letter-spacing: .02em;
    overflow-wrap: break-word; outline: none; border-radius: 4px;
  }
  .plate-title:empty::before { content: attr(data-placeholder); opacity: .55; }
  body:not(.locked) .plate-title { cursor: text; }
  .plate-title[contenteditable="true"]:focus { box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 30%, transparent); }
  .plate-count { flex-shrink: 0; margin-left: auto; font-size: 12px; font-weight: 600; opacity: .72; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plate-actions { display: inline-flex; gap: 2px; flex-shrink: 0; }
  .plate-btn { opacity: .6; }
  .plate-btn svg { width: 16px; height: 16px; }
  .block-body { padding-bottom: 6px; }
  .map-block.is-collapsed .block-body { display: none; }
  .block-plate.is-match .plate-title, .dir-header.is-match .dir-title { text-decoration: none; }
  .block-plate.is-current-match { box-shadow: 0 0 0 3px var(--lime-ring); }

  .map-dir { margin-top: 16px; scroll-margin-top: 62px; }
  .dir-header { display: flex; align-items: flex-start; gap: 4px; padding: 2px 4px 4px 0; cursor: pointer; border-radius: 7px; }
  .dir-header.is-current-match, .dir-header.is-flash { background: rgba(220,240,74,.22); }
  .dir-header.is-flash { transition: background .8s; }
  .dir-chev {
    width: 24px; height: 24px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; background: transparent; color: var(--text-3); transition: transform .15s, background .12s, color .12s;
  }
  .dir-chev svg { width: 15px; height: 15px; }
  .dir-chev:hover { background: var(--note-bg); color: var(--text); }
  .map-dir.is-collapsed .dir-chev { transform: rotate(-90deg); }
  .dir-title { flex: 0 1 auto; min-width: 0; padding-top: 1px; font-size: 15px; font-weight: 700; line-height: 1.4; overflow-wrap: break-word; outline: none; border-radius: 4px; }
  .dir-title:empty::before { content: attr(data-placeholder); color: var(--text-3); font-weight: 600; }
  body:not(.locked) .dir-title { cursor: text; }
  .dir-title[contenteditable="true"]:focus, .dir-desc[contenteditable="true"]:focus { box-shadow: 0 0 0 3px var(--lime-ring); background: #fff; }
  .dir-count { flex-shrink: 0; margin-left: auto; padding-top: 3px; font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dir-actions { display: inline-flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity .12s; }
  .dir-header:hover .dir-actions, .dir-actions:focus-within { opacity: 1; }
  .mini-btn {
    height: 24px; min-width: 24px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 6px;
    border: none; border-radius: 6px; background: transparent; font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap;
  }
  .mini-btn:hover { background: var(--note-bg); color: var(--text); }
  .mini-btn.danger:hover { color: var(--danger); }
  .mini-btn svg { width: 14px; height: 14px; }
  .dir-desc { margin: 0 4px 6px 28px; font-size: 12px; line-height: 1.45; color: var(--text-2); white-space: pre-wrap; overflow-wrap: break-word; outline: none; border-radius: 4px; }
  .dir-desc:empty::before { content: attr(data-placeholder); color: var(--text-3); }
  .map-dir.is-collapsed .dir-body, .map-dir.is-collapsed .dir-desc { display: none; }
  .dir-empty { padding: 0 0 2px 28px; font-size: 12px; color: var(--text-3); }

  /* ── Строки задач ── */
  .task-list { background: var(--card); border: 1px solid var(--card-line); border-radius: 8px; }
  .task-wrapper { position: relative; border-top: 1px solid var(--row-line); }
  .task-wrapper:first-child { border-top: none; }
  .task-wrapper:first-child .task-row { border-radius: 7px 7px 0 0; }
  .task-wrapper.dragging { opacity: .4; }
  .task-row {
    position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: start;
    min-height: 38px; padding: 9px 12px; cursor: pointer; transition: background .12s;
  }
  .task-row:hover { background: rgba(243,238,224,.5); }
  .task-row.is-expanded { background: #FBF8EF; }
  .task-wrapper.is-current-match > .task-row { background: rgba(220,240,74,.2); }
  .drag-handle {
    display: none; position: absolute; left: -21px; top: 9px; width: 16px; height: 20px; align-items: center; justify-content: center;
    color: var(--text-3); cursor: grab; opacity: 0; transition: opacity .12s;
  }
  body:not(.locked) .drag-handle { display: flex; }
  .task-row:hover .drag-handle { opacity: 1; }
  .drag-handle svg { width: 14px; height: 14px; }
  .status-mark {
    position: relative; width: 14px; height: 14px; margin-top: 3px; flex-shrink: 0; padding: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--status-active); background: transparent; color: #fff; transition: border-color .15s, background .15s;
  }
  .status-mark.is-done { border-color: var(--status-done); background: var(--status-done); }
  .status-mark .i-check { width: 9px; height: 9px; display: block; }
  .status-mark::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; }
  body:not(.locked) .status-mark:hover { border-color: var(--status-done); }
  body:not(.locked) .status-mark.is-done:hover { background: #A2BC6F; border-color: #A2BC6F; }
  body.locked .status-mark { pointer-events: none; }
  .status-mark.is-mini { width: 12px; height: 12px; margin-top: 0; pointer-events: none; }
  .status-mark.is-mini .i-check { width: 8px; height: 8px; }
  .task-main { min-width: 0; }
  .task-title-full { font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--text); overflow-wrap: break-word; }
  .task-title-full:empty::before { content: 'Задача…'; color: var(--text-3); }
  body.locked .task-title-full:empty::before { content: 'Без названия'; font-style: italic; }
  body:not(.locked) .task-title-full { cursor: text; }
  .task-wrapper.status-done .task-title-full { color: var(--done-text); }
  .task-row-input {
    display: none; width: calc(100% + 10px); margin: -2px -5px; padding: 1px 5px; border: none; border-radius: 6px; resize: none; overflow: hidden;
    background: #fff; font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--text); outline: none;
    box-shadow: 0 0 0 1px #B9AD8F, 0 0 0 4px var(--lime-ring);
  }
  .task-row.editing .task-title-full { display: none; }
  .row-comment { margin-top: 1px; font-size: 12px; line-height: 1.45; color: var(--text-2); overflow-wrap: break-word; }
  .row-comment-more { margin-left: 6px; font-weight: 700; color: var(--text-3); white-space: nowrap; }
  .task-row.is-expanded .row-comment { display: none; }
  .row-aside {
    display: flex; align-items: baseline; justify-content: flex-end; flex-wrap: wrap; gap: 0 12px; max-width: 280px; padding-top: 2px;
    font-size: 12px; line-height: 1.45; color: var(--text-2); text-align: right;
  }
  .row-people { min-width: 0; overflow-wrap: break-word; }
  .row-date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .task-wrapper.status-done .row-aside { color: var(--text-3); }
  .resp-chip { border-radius: 4px; }
  body:not(.locked) .resp-chip { cursor: pointer; }
  body:not(.locked) .resp-chip:hover { color: var(--danger); text-decoration: line-through; }
  body.locked .resp-chip { pointer-events: none; }
  .task-list { position: relative; }
  /* «+ задача» всплывает при наведении на направление и не занимает места в ленте */
  .add-row {
    position: absolute; left: 20px; top: calc(100% - 6px); z-index: 3; height: 24px;
    display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 8px; border: 1px solid var(--line-strong); border-radius: 999px;
    background: var(--card); font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .12s, color .12s, border-color .12s;
  }
  .add-row svg { width: 14px; height: 14px; }
  .map-dir:hover .add-row, .add-row:focus-visible { opacity: 1; pointer-events: auto; }
  .add-row:hover { color: var(--text); border-color: var(--line-hover); }
  .task-list.is-empty .add-row { position: static; margin: 7px 8px; opacity: 1; pointer-events: auto; }
  .add-dir-btn, .add-block-btn {
    display: flex; align-items: center; gap: 8px; border: none; background: transparent; font-size: 12px; font-weight: 600; color: var(--text-3);
    padding: 6px 8px; margin: 10px 0 0 20px; border-radius: 7px;
  }
  .add-dir-btn:hover, .add-block-btn:hover { color: var(--text); background: var(--note-bg); }
  .add-dir-btn svg, .add-block-btn svg { width: 14px; height: 14px; }
  .add-block-btn { width: 100%; margin: 18px 0 0; justify-content: center; padding: 11px; border: 1px dashed var(--line-strong); border-radius: 8px; font-size: 13px; }
  .drop-indicator { height: 2px; margin: -1px 12px; border-radius: 2px; background: var(--text); pointer-events: none; position: relative; z-index: 2; }

  /* ── Раскрытая задача ── */
  .task-detail { padding: 2px 12px 12px 36px; background: #FBF8EF; border-top: 1px dashed var(--row-line); }
  .detail-meta { padding-top: 8px; font-size: 12px; color: var(--text-2); }
  body:not(.locked) .detail-meta { display: none; }
  .detail-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 4px; margin: 6px 0 0 -8px; }
  .detail-btn {
    height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: none; border-radius: 7px;
    background: transparent; font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap;
  }
  .detail-btn:hover { background: var(--note-bg); color: var(--text); }
  .detail-btn svg { width: 15px; height: 15px; }
  .deadline-wrap { position: relative; display: inline-flex; }
  .deadline-input { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  body.locked .deadline-ru { pointer-events: none; }
  .resp-group { display: inline-flex; align-items: center; }
  .resp-icon-wrap { display: none; }
  .resp-icon-wrap.open { display: inline-flex; }
  .resp-icon-input {
    width: 200px; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line-strong); background: #fff;
    font-size: 13px; color: var(--text); outline: none;
  }
  .resp-icon-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .detail-delete-btn { margin-left: auto; }
  .detail-delete-btn:hover { color: var(--danger); background: rgba(184,55,31,.08); }
  .autocomplete-wrap { position: relative; display: inline-flex; }
  .autocomplete-list { position: absolute; top: calc(100% + 6px); left: 0; z-index: 400; min-width: 220px; max-height: 240px; overflow-y: auto; padding: 4px; }
  .autocomplete-item { padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; outline: none; }
  .autocomplete-item:hover, .autocomplete-item:focus { background: var(--note-bg); }
  .autocomplete-item mark { background: transparent; padding: 0; font-weight: 700; }

  .history-body { margin-top: 6px; }
  .history-body:not(.showing-log):has(.log-entries:empty) { display: none !important; }
  .log-entries { display: flex; flex-direction: column; gap: 1px; }
  .log-entries:empty { display: none; }
  .log-entry { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; margin: 0 -8px; padding: 5px 8px; border-radius: 7px; }
  .log-entry:hover { background: var(--note-bg); }
  .log-date { font-size: 12px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .log-text { font-size: 13px; line-height: 1.45; color: var(--note-text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .log-entry.is-status .log-text { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .log-entry-actions { display: flex; gap: 2px; align-self: center; opacity: 0; transition: opacity .12s; }
  .log-entry:hover .log-entry-actions, .log-entry:focus-within .log-entry-actions { opacity: 1; }
  body.locked .log-entry-actions { display: none; }
  .log-edit-btn, .log-del-btn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 6px; background: transparent; color: var(--text-2); }
  .log-edit-btn:hover { color: var(--text); background: var(--card); }
  .log-del-btn:hover { color: var(--danger); background: var(--card); }
  .log-edit-btn svg, .log-del-btn svg { width: 14px; height: 14px; }
  .log-edit-area {
    grid-column: 2 / 4; width: 100%; padding: 5px 8px; border-radius: 7px; border: 1px solid #B9AD8F; background: #fff;
    font-size: 13px; line-height: 1.45; resize: none; overflow: hidden; outline: none; box-shadow: 0 0 0 3px var(--lime-ring);
  }
  .log-new-btn {
    display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 0 -8px; padding: 4px 8px; border: none; border-radius: 7px;
    background: transparent; font-size: 12px; font-weight: 600; color: var(--text-2);
  }
  .log-new-btn:hover { background: var(--note-bg); color: var(--text); }
  .log-new-btn svg { width: 14px; height: 14px; }
  body.locked .log-new-btn, body.locked .log-add { display: none !important; }
  .log-add { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; }
  .log-input {
    flex: 1; min-height: 36px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff;
    font-size: 13px; line-height: 1.45; resize: none; overflow: hidden; outline: none;
  }
  .log-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .log-cancel-btn { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: transparent; color: var(--text-2); }
  .log-cancel-btn:hover { background: var(--note-bg); color: var(--danger); }

  /* ── Палитра блока ── */
  .color-palette-popup { position: fixed; z-index: 2000; width: 232px; padding: 12px; display: flex; flex-direction: column; gap: 10px; animation: pop-in .12s ease-out; }
  .palette-head { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
  .color-palette-swatches { display: grid; grid-template-columns: repeat(6, 26px); gap: 9px 10px; }
  .palette-swatch {
    position: relative; width: 26px; height: 26px; border: none; border-radius: 50%; padding: 0; cursor: pointer;
    background: var(--sw); box-shadow: inset 0 0 0 1px rgba(42,31,18,.12); transition: transform .12s, box-shadow .12s;
  }
  .palette-swatch:hover { transform: scale(1.12); }
  .palette-swatch.active { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--text); }
  .palette-picker {
    display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
    background: conic-gradient(#ff5f5f, #ffd25f, #8fe35f, #5fe0e8, #5f7dff, #d65fff, #ff5f5f);
  }
  .palette-picker:focus-within { outline: 2px solid var(--text); outline-offset: 3px; }
  .palette-picker-plus { display: flex; color: #fff; pointer-events: none; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.65)); }
  .palette-picker-plus svg { width: 14px; height: 14px; }
  .palette-picker-input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: none; opacity: 0; cursor: pointer; }
  .palette-caption { display: flex; align-items: center; gap: 8px; min-height: 30px; padding-top: 10px; border-top: 1px solid var(--line); }
  .palette-caption-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(42,31,18,.15); }
  .palette-caption-dot.rainbow { background: conic-gradient(#ff5f5f, #ffd25f, #8fe35f, #5fe0e8, #5f7dff, #d65fff, #ff5f5f); }
  .palette-caption-name { font-size: 13px; font-weight: 600; }
  .palette-caption-hex { margin-left: auto; font-size: 11px; color: var(--text-2); font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

  /* ── Диалоги ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(42,31,18,.42); opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .modal-overlay.visible { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 440px; max-height: calc(100dvh - 32px); overflow-y: auto; padding: 22px 22px 18px;
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 26px 64px -18px rgba(42,31,18,.5);
    transform: translateY(6px) scale(.985); transition: transform .15s;
  }
  .modal-overlay.visible .modal { transform: none; }
  .modal-title { margin-bottom: 12px; font-size: 17px; font-weight: 700; letter-spacing: -0.005em; }
  .modal-msg { margin-bottom: 18px; font-size: 14px; color: var(--text); }
  .modal-text { line-height: 1.55; overflow-wrap: anywhere; }
  .modal-text strong { font-weight: 700; }
  .modal-sub { display: inline-block; margin-top: 8px; font-size: 13px; line-height: 1.5; color: var(--text-2); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-cancel, .modal-confirm { height: 38px; padding: 0 16px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .modal-cancel { border: 1px solid var(--line-strong); background: transparent; color: var(--text); }
  .modal-cancel:hover { background: var(--note-bg); }
  .modal-confirm { border: none; background: var(--side); color: var(--page); }
  .modal-confirm:hover { background: #3A2C1A; }
  .modal-confirm.danger { background: var(--danger); color: #fff; }
  .modal-confirm.danger:hover { background: #9C2D18; }
  .modal.shake { animation: modal-shake .32s; }
  @keyframes modal-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .form-label { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--text-2); }
  .form-input {
    width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff;
    font-size: 14px; font-weight: 500; color: var(--text); outline: none;
  }
  .form-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .form-error { min-height: 18px; margin: 6px 0 8px; font-size: 12px; font-weight: 600; color: var(--danger); }
  .form-choice {
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line-strong); cursor: pointer; transition: border-color .12s, background .12s;
  }
  .form-choice:hover { border-color: var(--line-hover); }
  .form-choice:has(input:checked) { border-color: var(--text); background: #fff; }
  .form-choice input { margin-top: 3px; accent-color: #2A1F12; }
  .form-choice-text { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.4; }
  .form-choice-text b { font-weight: 700; }
  .form-choice-text small { font-size: 12px; color: var(--text-2); }

  /* ── Уведомление с отменой ── */
  .undo-toast {
    position: fixed; left: calc(50% + var(--panel-w) / 2); bottom: 24px; z-index: 2500; max-width: calc(100vw - var(--panel-w) - 32px);
    display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 16px; border-radius: 10px;
    background: var(--side); color: var(--side-text); font-size: 13px; font-weight: 500; box-shadow: 0 18px 44px -12px rgba(42,31,18,.55);
    opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s;
  }
  .undo-toast.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .undo-toast:has(.undo-btn[hidden]) { padding: 12px 18px; }
  .undo-toast-msg { min-width: 0; overflow-wrap: anywhere; }
  .undo-btn { flex-shrink: 0; height: 30px; padding: 0 12px; border: none; border-radius: 8px; background: var(--lime); color: #2A1F12; font-size: 12px; font-weight: 700; }
  .undo-btn:hover { background: #E6F86A; }
  .undo-shortcut { flex-shrink: 0; padding-right: 6px; font-size: 11px; color: var(--side-muted); }

  /* ── Мобильная версия ── */
  @media (max-width: 700px) {
    .left-panel {
      position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 100;

// ── Хранилище: сезоны (g8-tracker-v2) + миграция из g8-tracker-v1 ────────────
const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;

// id попадают в onclick-атрибуты, поэтому недопустимые и повторяющиеся id заменяются
function sanitizeBlocks(blocks) {
  const seen = new Set();
  const fixId = id => {
    let v = (typeof id === 'string' && SAFE_ID.test(id)) ? id : genId();
    while (seen.has(v)) v = genId();
    seen.add(v);
    return v;
  };
  (blocks || []).forEach(b => {
    b.id = fixId(b.id);
    if (!Array.isArray(b.directions)) b.directions = [];
    b.directions.forEach(d => {
      d.id = fixId(d.id);
      if (!Array.isArray(d.tasks)) d.tasks = [];
      d.tasks.forEach(t => {
        t.id = fixId(t.id);
        // два статуса: «Завершена» остаётся, всё остальное — «В работе»
        if (!TASK_STATUSES.includes(t.status)) t.status = t.status === 'done' ? 'done' : 'active';
      });
    });
  });
  return blocks;
}
function isValidDb(d) {
  return !!d && Array.isArray(d.seasons) && d.seasons.length > 0 &&
    d.seasons.every(s => s && typeof s === 'object' && Array.isArray(s.blocks));
}
function normalizeDb(d) {
  const ids = new Set();
  d.seasons.forEach((s, i) => {
    if (typeof s.id !== 'string' || !SAFE_ID.test(s.id) || ids.has(s.id)) s.id = genSeasonId();
    ids.add(s.id);
    s.name = (typeof s.name === 'string' && s.name.trim()) ? s.name.trim().slice(0, 40) : `Сезон ${i + 1}`;
    sanitizeBlocks(s.blocks);
  });
  return { version: 2, seasons: d.seasons };
}
function needsStatusMigration(seasons) {
  return (seasons || []).some(se => (se.blocks || []).some(b => (b.directions || []).some(d =>
    (d.tasks || []).some(t => !TASK_STATUSES.includes(t.status)))));
}
// копия данных до перехода на два статуса — один раз, повторно не перезаписывается
function backupBeforeStatusMigration(raw) {
  if (lsGet(STATUS_BACKUP_KEY) === null) lsSet(STATUS_BACKUP_KEY, raw);
}
function seasonFromBlocks(blocks) {
  return { id: MIGRATED_SEASON_ID, name: MIGRATED_SEASON_NAME, blocks: sanitizeBlocks(blocks) };
}

async function loadDb() {
  const raw2 = lsGet(STORAGE_KEY);
  if (raw2) {
    try {
      const d = JSON.parse(raw2);
      if (isValidDb(d)) {
        const migrate = needsStatusMigration(d.seasons);
        if (migrate) backupBeforeStatusMigration(raw2);
        const nd = normalizeDb(d);
        if (migrate) lsSet(STORAGE_KEY, JSON.stringify(nd));
        return nd;
      }
    } catch (e) {}
    // нечитаемые данные не затираем — откладываем копию
    lsSet(`${STORAGE_KEY}-unreadable-${Date.now()}`, raw2);
  }
  const raw1 = lsGet(STORAGE_KEY_V1);
  if (raw1) {
    try {
      const d = JSON.parse(raw1);
      if (d && Array.isArray(d.blocks)) {
        const before = { version: 2, seasons: [{ id: MIGRATED_SEASON_ID, name: MIGRATED_SEASON_NAME, blocks: d.blocks }] };
        if (needsStatusMigration(before.seasons)) backupBeforeStatusMigration(JSON.stringify(before));
        const migrated = { version: 2, seasons: [seasonFromBlocks(d.blocks)] };
        lsSet(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }
    } catch (e) {}
  }
  try {
    const r = await fetch('data.json?v=' + Date.now());
    if (r.ok) {
      const data = await r.json();
      if (isValidDb(data)) return normalizeDb(data);
      if (data && Array.isArray(data.blocks)) return { version: 2, seasons: [seasonFromBlocks(data.blocks)] };
    }
  } catch (e) {}
  return { version: 2, seasons: [seasonFromBlocks(getInitialData().blocks)] };
}

  event.preventDefault();

  const srcBlock = state.blocks.find(b => b.id === dragTask.blockId);
  const srcDir = srcBlock && srcBlock.directions.find(d => d.id === dragTask.dirId);
  const tgtBlock = state.blocks.find(b => b.id === blockId);
  const tgtDir = tgtBlock && tgtBlock.directions.find(d => d.id === dirId);
  if (!srcDir || !tgtDir) return;

  const fromIdx = srcDir.tasks.findIndex(t => t.id === dragTask.taskId);
  if (fromIdx === -1) return;
  // Задачи показаны группами по статусу: позицию внутри группы переводим в индекс полного списка

  const idx = dndInsertIdx(event.currentTarget, '[data-task]', event.clientY);
  const beforeEl = items.slice(idx).find(el => el.dataset.task !== movingId);

  pushUndo();

function taskMatchesSearch(task) {

// экранирует текст и подсвечивает совпадения с поиском
function hl(text) {
  const tokens = searchTokens();
  const src = String(text || '');
  if (!tokens.length || !src) return esc(src);
  const low = normText(src);
  if (low.length !== src.length) return esc(src);
  const marks = new Array(src.length).fill(false);
  tokens.forEach(tk => {
    let i = low.indexOf(tk);
    while (i !== -1) { for (let k = i; k < i + tk.length; k++) marks[k] = true; i = low.indexOf(tk, i + tk.length); }
  });
  let out = '', open = false;
  for (let i = 0; i < src.length; i++) {
    if (marks[i] && !open) { out += '<mark>'; open = true; }
    if (!marks[i] && open) { out += '</mark>'; open = false; }

function editTaskTitle(taskId) {
  if (!editMode) { toggleTask(taskId); return; }
  const inp = document.getElementById(`task-inp-${taskId}`);
  const card = document.getElementById(`card-${taskId}`);
  if (!inp || !card) return;
  card.classList.add('editing');
  inp.style.display = 'block';
  autoGrow(inp);
  inp.focus();
  inp.select();
}
function endEditTitle(taskId) {
  const inp = document.getElementById(`task-inp-${taskId}`);
  if (!inp) return;
  inp.style.display = 'none';
  document.getElementById(`card-${taskId}`)?.classList.remove('editing');
}
function cardClick(event, taskId) {
  if (event.target.closest('.task-title-full, .status-mark, .resp-chip, .drag-handle, button, textarea, input, a')) return;
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed && event.currentTarget.contains(sel.anchorNode)) return;
  toggleTask(taskId);
}
function openDeadlinePicker(taskId) {
  if (!editMode) return;
  const inp = document.getElementById(`dl-${taskId}`);
  if (!inp) return;
  try { if (inp.showPicker) { inp.showPicker(); return; } } catch (e) {}
  inp.focus();
  inp.click();
}
function toggleTask(taskId) {
  expandedTasks.has(taskId) ? expandedTasks.delete(taskId) : expandedTasks.add(taskId);
  const open = expandedTasks.has(taskId);
  const detail = document.getElementById(`detail-${taskId}`);
  const card   = document.getElementById(`card-${taskId}`);
  if (detail) detail.style.display = open ? 'block' : 'none';
  if (card)   card.classList.toggle('is-expanded', open);
}
function showRespInput(taskId) {
  const btn  = document.getElementById(`resp-btn-${taskId}`);
  const wrap = document.getElementById(`resp-wrap-${taskId}`);
  const inp  = document.getElementById(`resp-inp-${taskId}`);
  if (btn)  btn.style.display = 'none';
  if (wrap) wrap.classList.add('open');
  if (inp)  inp.focus();
}
function hideRespInput(taskId) {
  setTimeout(() => {
    const wrap = document.getElementById(`resp-wrap-${taskId}`);
    if (wrap && !wrap.contains(document.activeElement)) {
      const btn = document.getElementById(`resp-btn-${taskId}`);
      wrap.classList.remove('open');
      if (btn) btn.style.display = '';

}
function triggerLogInput(blockId, dirId, taskId) {
  const body = document.getElementById(`hist-body-${taskId}`);
  if (body) body.style.display = 'block';
  showLogInput(blockId, dirId, taskId);
}
function showLogInput(blockId, dirId, taskId) {

}
function hideLogInput(taskId) {
  const inp = document.getElementById(`log-input-${taskId}`);
  if (inp) { inp.value = ''; inp.style.height = 'auto'; }
  const add = document.getElementById(`log-add-${taskId}`);
  if (add) add.style.display = 'none';

function handleLogKey(e, blockId, dirId, taskId) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addLogEntry(blockId, dirId, taskId); }
  else if (e.key === 'Escape') { hideLogInput(taskId); }
}
function addLogEntry(blockId, dirId, taskId) {
  const inp = document.getElementById(`log-input-${taskId}`);
  if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (!t) return;
  if (!t.log) t.log = [];
  t.log.push({ date: fmtNow(), text });
  persist();
  refreshLogEntries(blockId, dirId, taskId, t);
  hideLogInput(taskId);
}
function refreshLogEntries(blockId, dirId, taskId, t) {
  const el = document.getElementById(`log-entries-${taskId}`);
  if (el) el.innerHTML = renderLogEntries(t.log, blockId, dirId, taskId);
  const main = document.querySelector(`#card-${taskId} .task-main`);
  if (main) {
    main.querySelector('.row-comment')?.remove();
    main.insertAdjacentHTML('beforeend', rowCommentHtml(t.log));
  }
}
function renderLogEntries(log, blockId, dirId, taskId) {
  if (!log || log.length === 0) return '';
  return log.map((e, i) => {
    const isStatus = e.type === 'status';
    return `
    <div class="log-entry${isStatus ? ' is-status' : ''}" id="log-entry-${taskId}-${i}">
      <span class="log-date">${esc((e.date || '').split(' ')[0])}</span>
      <span class="log-text">${isStatus ? statusMarkHtml(/Завершена»$/.test(e.text || '') ? 'done' : 'active', true) : ''}${hl(e.text)}</span>
      <div class="log-entry-actions">
        ${isStatus ? '' : `<button type="button" class="log-edit-btn" title="Редактировать" aria-label="Редактировать комментарий" onclick="startEditLog('${blockId}','${dirId}','${taskId}',${i})">${ICONS.pencil}</button>`}
        <button type="button" class="log-del-btn" title="Удалить" aria-label="Удалить запись" onclick="deleteLog('${blockId}','${dirId}','${taskId}',${i})">${ICONS.x}</button>
      </div>
    </div>`;
  }).reverse().join('');
}
function taskComments(log) { return (log || []).filter(e => e.type !== 'status'); }
function startEditLog(blockId, dirId, taskId, idx) {
  const entry = document.getElementById(`log-entry-${taskId}-${idx}`);
  if (!entry) return;
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (!t) return;
  const current = (t.log[idx] || {}).text || '';
  const textSpan = entry.querySelector('.log-text');
  const actions  = entry.querySelector('.log-entry-actions');
  textSpan.style.display = 'none';
  actions.style.display  = 'none';
  const ta = document.createElement('textarea');
  ta.className = 'log-edit-area';
  ta.value = current;
  ta.rows = 1;
  ta.style.height = 'auto';
  entry.insertBefore(ta, actions);
  ta.style.height = ta.scrollHeight + 'px';
  ta.focus();
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  const save = () => {
    const val = ta.value.trim();
    if (val && val !== current) {
      t.log[idx].text = val;
      saveData();
    }
    refreshLogEntries(blockId, dirId, taskId, t);
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') { ta.value = current; ta.blur(); }
  });
  ta.addEventListener('blur', save);
}
function deleteLog(blockId, dirId, taskId, idx) {
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (!t) return;
  const short = (t.log[idx]?.text || '').slice(0, 40) || 'Запись';
  showConfirm(
    `Удалить запись <strong>${esc(short)}</strong>?`,
    () => {
      pushUndo();
      t.log.splice(idx, 1);
      saveData();
      refreshLogEntries(blockId, dirId, taskId, t);
      showToast(`«${short}» удалена`);
    }
  );
}

}

// ── Responsible autocomplete ──────────────────────────────────────────────────
const _acCache = {}; // taskId → suggestions array

function showAC(inp, blockId, dirId, taskId) {
  const query = inp.value.trim().toLowerCase();
  const list  = document.getElementById('ac-' + taskId);
  if (!list) return;

  if (!query) { list.style.display = 'none'; return; }

  // Exclude already-assigned names
  let current = [];
  outer: for (const b of state.blocks) for (const d of b.directions) {
    const t = d.tasks.find(t => t.id === taskId);
    if (t) { current = t.responsible || []; break outer; }
  }

  const suggestions = getAllResponsibles(true).filter(n =>
    !current.includes(n) && n.toLowerCase().startsWith(query)
  );

  _acCache[taskId] = suggestions;

  if (!suggestions.length) { list.style.display = 'none'; return; }

  list.innerHTML = suggestions.map((name, i) => {
    // Highlight matching part
    const lo = name.toLowerCase(), qi = lo.indexOf(query);
    const highlighted = qi >= 0
      ? esc(name.slice(0, qi)) + '<mark>' + esc(name.slice(qi, qi + query.length)) + '</mark>' + esc(name.slice(qi + query.length))
      : esc(name);
    return `<div class="autocomplete-item" tabindex="-1"
      onmousedown="event.preventDefault();pickAC('${blockId}','${dirId}','${taskId}',${i})"
      onkeydown="acItemKey(event,'${blockId}','${dirId}','${taskId}',${i})"
      onblur="respFocusOut('${taskId}')"
    >${highlighted}</div>`;
  }).join('');
  list.style.display = 'block';
}

function hideAC(taskId) {
  const l = document.getElementById('ac-' + taskId);
  if (l) l.style.display = 'none';
}
// список подсказок прячем, только когда фокус ушёл из всего блока ввода (а не в сам список)
function respFocusOut(taskId) {
  setTimeout(() => {
    const wrap = document.getElementById(`resp-wrap-${taskId}`);
    if (wrap && wrap.contains(document.activeElement)) return;
    hideAC(taskId);
    hideRespInput(taskId);
  }, 120);
}

function pickAC(blockId, dirId, taskId, idx) {
  const name = (_acCache[taskId] || [])[idx];
  if (name) addResponsible(blockId, dirId, taskId, name);
}

function acItemKey(event, blockId, dirId, taskId, idx) {
  if (event.key === 'Enter') { event.preventDefault(); pickAC(blockId, dirId, taskId, idx); }
  else if (event.key === 'ArrowDown') { event.preventDefault(); const next = event.target.nextElementSibling; if (next) next.focus(); }
  else if (event.key === 'ArrowUp')   { event.preventDefault(); const prev = event.target.previousElementSibling; if (prev) prev.focus(); else document.getElementById('ac-' + taskId)?.previousElementSibling?.focus(); }
  else if (event.key === 'Escape')    { hideAC(taskId); }
}


// ── Block color palette ───────────────────────────────────────────────────────
const PALETTE = [
  { color: '#7a9e00', name: 'Оливковый' },
  { color: '#d4920a', name: 'Янтарный' },
  { color: '#3d85c8', name: 'Синий' },
  { color: '#9b5ea4', name: 'Фиолетовый' },
  { color: '#c07830', name: 'Медный' },
  { color: '#8a7d68', name: 'Серо-коричневый' },
  { color: '#28d5e2', name: 'Бирюзовый' },
  { color: '#e2fd69', name: 'Лаймовый' },
  { color: '#c0392b', name: 'Красный' },
];
const DEFAULT_BLOCK_COLOR = '#7a9e00';

function normHex(c) {
  const m = String(c || '').trim().toLowerCase().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/);
  if (!m) return '';
  return '#' + (m[1].length === 3 ? m[1].split('').map(x => x + x).join('') : m[1]);
}
function blockColorOf(block) { return normHex(block && block.color) || DEFAULT_BLOCK_COLOR; }
function paletteName(hex) {
  const p = PALETTE.find(p => p.color === normHex(hex));
  return p ? p.name : 'Свой цвет';
}

function getLuminance(hex) {
  const rgb = parseInt((normHex(hex) || DEFAULT_BLOCK_COLOR).slice(1), 16);
  const r = ((rgb >> 16) & 0xff) / 255;
  const g = ((rgb >> 8) & 0xff) / 255;
  const b = (rgb & 0xff) / 255;
  const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}
function contrastRatio(l1, l2) { return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); }
const INK_DARK = '#2A1F12';
const INK_LIGHT = '#FFFDF7';

// цвет текста на плашке блока — тот из тёмного/светлого, что контрастнее
function getBlockColors(hex) {
  const l = getLuminance(hex);
  const light = contrastRatio(l, getLuminance(INK_LIGHT)) > contrastRatio(l, getLuminance(INK_DARK));
  return {
    text:    light ? INK_LIGHT : INK_DARK,
    textDim: light ? 'rgba(255,253,247,0.72)' : 'rgba(42,31,18,0.62)',
    barBg:   light ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.18)',
    barFill: light ? 'rgba(255,255,255,0.75)' : 'rgba(0,0,0,0.42)',
  };
}

function pickNextColor() {
  const used = new Set(state.blocks.map(b => normHex(b.color)).filter(Boolean));
  const found = PALETTE.find(p => !used.has(p.color));
  return found ? found.color : PALETTE[state.blocks.length % PALETTE.length].color;
}

let activePaletteBlockId = null;
let paletteUndoPushed = false;
let paletteRenderRaf = 0;
let palettePersistTimer = null;

function paletteSwatch(blockId, color, name, active, extraClass = '') {
  return `<button type="button" class="palette-swatch${active ? ' active' : ''}${extraClass}" style="--sw:${color}"
    data-name="${esc(name)}" data-hex="${color}" aria-label="${esc(name)}" aria-pressed="${active}"
    onclick="selectBlockColor('${blockId}','${color}')"
    onmouseenter="paletteHover(this)" onmouseleave="paletteHover(null)" onfocus="paletteHover(this)" onblur="paletteHover(null)"></button>`;
}

function renderPalette() {
  const popup = document.getElementById('color-palette-popup');
  const b = state.blocks.find(b => b.id === activePaletteBlockId);
  if (!popup || !b) return;
  const current = blockColorOf(b);
  const isPreset = PALETTE.some(p => p.color === current);
  popup.innerHTML = `
    <div class="palette-head">Цвет блока</div>
    <div class="color-palette-swatches">
      ${PALETTE.map(p => paletteSwatch(b.id, p.color, p.name, p.color === current)).join('')}
      ${isPreset ? '' : paletteSwatch(b.id, current, 'Свой цвет', true, ' is-custom')}
      <label class="palette-swatch palette-picker" data-name="Свой цвет…" onmouseenter="paletteHover(this)" onmouseleave="paletteHover(null)">
        <span class="palette-picker-plus" aria-hidden="true">${ICONS.plus}</span>
        <input type="color" class="palette-picker-input" value="${current}" aria-label="Свой цвет: открыть полный спектр"
          onfocus="paletteHover(this.parentElement)" onblur="paletteHover(null)"
          oninput="previewBlockColor('${b.id}', this.value)" onchange="commitBlockColor('${b.id}', this.value)">
      </label>
    </div>
    <div class="palette-caption" id="palette-caption" aria-live="polite"></div>`;
  paletteHover(null);
}

// подпись под кружками — название именно того цвета, на который наведён курсор
function paletteHover(el) {
  const cap = document.getElementById('palette-caption');
  if (!cap) return;
  let name, hex;
  if (el && el.dataset && el.dataset.name) { name = el.dataset.name; hex = el.dataset.hex || ''; }
  else {
    hex = blockColorOf(state.blocks.find(b => b.id === activePaletteBlockId));
    name = paletteName(hex);
  }
  cap.innerHTML = `<span class="palette-caption-dot${hex ? '' : ' rainbow'}"${hex ? ` style="background:${hex}"` : ''}></span>
    <span class="palette-caption-name">${esc(name)}</span>${hex ? `<span class="palette-caption-hex">${hex.toUpperCase()}</span>` : ''}`;
}

function positionPopup(popup, anchor) {
  const r = anchor.getBoundingClientRect();
  const pw = popup.offsetWidth, ph = popup.offsetHeight;
  let left = r.left;
  let top = r.bottom + 8;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  popup.style.left = Math.max(8, left) + 'px';
  popup.style.top = top + 'px';
}

function openColorPalette(blockId, btn) {
  if (!editMode) return;
  if (activePaletteBlockId === blockId) { closeColorPalette(); return; }
  closeColorPalette();
  activePaletteBlockId = blockId;
  paletteUndoPushed = false;
  const popup = document.createElement('div');
  popup.id = 'color-palette-popup';
  popup.className = 'color-palette-popup';
  popup.setAttribute('role', 'dialog');
  popup.setAttribute('aria-label', 'Цвет блока');
  document.body.appendChild(popup);
  renderPalette();
  positionPopup(popup, btn);
  setTimeout(() => document.addEventListener('click', _closePaletteOutside), 0);
}

function _closePaletteOutside(e) {
  const popup = document.getElementById('color-palette-popup');
  if (popup && !e.composedPath().includes(popup)) closeColorPalette();
}

function closeColorPalette() {
  const popup = document.getElementById('color-palette-popup');
  if (popup) popup.remove();
  document.removeEventListener('click', _closePaletteOutside);
  if (palettePersistTimer) { clearTimeout(palettePersistTimer); palettePersistTimer = null; persist(); }
  activePaletteBlockId = null;
}

function applyBlockColor(blockId, color) {
  const b = state.blocks.find(b => b.id === blockId);
  const hex = normHex(color);
  if (!editMode || !b || !hex || blockColorOf(b) === hex) return false;
  if (!paletteUndoPushed) { pushUndo(); paletteUndoPushed = true; }
  b.color = hex;
  return true;
}

function selectBlockColor(blockId, color) {
  if (applyBlockColor(blockId, color)) { persist(); renderNav(); renderRightPanel(); }
  closeColorPalette();
}

// нативный выбор цвета: пока он открыт, саму палитру не перерисовываем
function previewBlockColor(blockId, color) {
  if (!applyBlockColor(blockId, color)) return;
  paletteHover(null);
  cancelAnimationFrame(paletteRenderRaf);
  paletteRenderRaf = requestAnimationFrame(() => { renderNav(); renderRightPanel(); });
  clearTimeout(palettePersistTimer);
  palettePersistTimer = setTimeout(() => { palettePersistTimer = null; persist(); }, 300);
}
function commitBlockColor(blockId, color) {
  previewBlockColor(blockId, color);
  closeColorPalette();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  renderSeasonPill();
  renderNav();
  renderRightPanel();
  renderHeaderState();
  updateStats();
}




function esc(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}


// ── Export ────────────────────────────────────────────────────────────────────
function fileSlug(s) {
  return String(s || '').trim().toLowerCase().replace(/[^0-9a-zа-яё_-]+/gi, '-').replace(/^-+|-+$/g, '') || 'season';
}
function downloadBlob(content, type, filename) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportData() {
  let text = `G8 TRACKER — ${seasonLabel(state).toUpperCase()}\nОтчёт от ${fmtNow()}\n${'='.repeat(50)}\n\n`;
  state.blocks.forEach(b => {
    text += `▌ ${b.title||'(без названия)'}\n`;
    b.directions.forEach(d => {
      text += `  ◆ ${d.title||'(без названия)'}`;
      if (d.description) text += `\n    ${d.description}`;
      text += '\n';
      d.tasks.forEach(t => {
        text += `    ${t.status === 'done' ? '✓' : '○'} ${t.text||'(без текста)'}${t.status === 'done' ? ' — завершена' : ''}`;
        if (t.deadline) text += ` [до ${t.deadline}]`;
        if ((t.responsible||[]).length) text += ` (${t.responsible.join(', ')})`;
        text += '\n';
        (t.log||[]).forEach(e => { text += `      · ${(e.date||'').split(' ')[0]}: ${e.text}\n`; });
      });
      text += '\n';
    });
  });
  downloadBlob(text, 'text/plain;charset=utf-8', `g8-tracker-${fileSlug(state.name)}_${new Date().toISOString().slice(0,10)}.txt`);
}

// ── Export menu ──────────────────────────────────────────────────────────────
function toggleExportMenu() {
  const menu = document.getElementById('export-menu');
  const open = !menu.classList.contains('open');
  if (open) { closeSeasonMenu(); closeFilterMenu(); closeColorPalette(); }
  menu.classList.toggle('open', open);
  document.getElementById('export-btn')?.setAttribute('aria-expanded', String(open));
}
function closeExportMenu() {
  document.getElementById('export-menu').classList.remove('open');
  document.getElementById('export-btn')?.setAttribute('aria-expanded', 'false');
}
// путь клика берём на момент события: меню могли перерисовать внутри обработчика
document.addEventListener('click', e => {
  const path = e.composedPath();
  const inside = id => path.some(el => el && el.id === id);
