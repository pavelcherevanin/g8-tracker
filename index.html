<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G8 Tracker</title>
<meta name="theme-color" content="#2A1F12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23DCF04A'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='28' fill='%232A1F12'%3EG8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #F5F2E8;
    --side: #2A1F12;
    --side-text: #EFE8D6;
    --side-muted: #A99C84;
    --side-hover: rgba(239,232,214,0.06);
    --side-line: rgba(239,232,214,0.10);
    --lime: #DCF04A;
    --lime-soft: rgba(220,240,74,0.14);
    --lime-ring: rgba(220,240,74,0.55);
    --text: #2A1F12;
    --text-2: #7A6E58;
    --text-3: #A39780;
    --line: #E4DCC6;
    --line-strong: #D9CFB6;
    --line-hover: #C9BD9F;
    --card: #FFFDF7;
    --card-line: #E6DFCC;
    --note-bg: #F3EEE0;
    --note-text: #5E5340;
    --st-progress: #E39B2D;
    --st-todo: #B9B09C;
    --st-done: #6F9A2A;
    --overdue: #B8371F;
    --overdue-dot: #FF7A59;
    --handle: #5C4B33;
    --shadow-pop: 0 18px 44px -14px rgba(42,31,18,.30), 0 2px 6px rgba(42,31,18,.06);
    --font-ui: 'Manrope', system-ui, sans-serif;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --panel-w: 264px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-ui); font-size: 14px; line-height: 1.45; color: var(--text);
    background: var(--page); overflow: hidden;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; display: block; }
  span[data-icon] { display: inline-flex; align-items: center; }
  span.progress, span.progress-fill { display: block; }
  mark { background: var(--lime-ring); color: inherit; border-radius: 3px; padding: 0 1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  ::selection { background: rgba(220,240,74,.6); color: var(--text); }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  body.locked .edit-only { display: none !important; }

  /* ── Каркас ── */
  .app-shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .right-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 32px 40px 88px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .right-panel::-webkit-scrollbar { width: 12px; }
  .right-panel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 12px; border: 3px solid var(--page); }
  .panel-overlay { display: none; position: fixed; inset: 0; background: rgba(42,31,18,.5); z-index: 90; }
  .panel-overlay.visible { display: block; }
  .print-area { display: none; }

  /* ── Левая колонка ── */
  .left-panel {
    width: var(--panel-w); flex-shrink: 0; min-height: 0; position: relative; z-index: 20;
    display: flex; flex-direction: column; background: var(--side); color: var(--side-text);
  }
  .left-panel :focus-visible { outline-color: var(--lime); }
  .nav-logo { height: 68px; flex-shrink: 0; display: flex; align-items: center; gap: 11px; padding: 0 14px 0 20px; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 9px; background: var(--lime); color: #2A1F12; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 1;
  }
  .logo-word { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: var(--side-text); white-space: nowrap; }
  .nav-close-btn { display: none; margin-left: auto; width: 36px; height: 36px; border: none; border-radius: 9px; background: transparent; color: var(--side-muted); align-items: center; justify-content: center; }
  .nav-close-btn:hover { background: var(--side-hover); color: var(--side-text); }
  .nav-close-btn svg { width: 20px; height: 20px; }
  .nav-scroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 6px 10px 28px;
    scrollbar-width: thin; scrollbar-color: rgba(239,232,214,.16) transparent;
  }
  .nav-scroll::-webkit-scrollbar { width: 10px; }
  .nav-scroll::-webkit-scrollbar-thumb { background: rgba(239,232,214,.16); border-radius: 10px; border: 3px solid var(--side); }

  .nav-overview {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: none; border-radius: 8px;
    background: transparent; color: var(--side-text); font-size: 13px; font-weight: 600; text-align: left; transition: background .12s;
  }
  .nav-overview .i { color: var(--side-muted); }
  .nav-overview:hover { background: var(--side-hover); }
  .nav-overview.active { background: var(--lime-soft); color: var(--lime); font-weight: 700; }
  .nav-overview.active .i { color: var(--lime); }
  .nav-count { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--side-muted); font-variant-numeric: tabular-nums; }

  .nav-blocks-container { margin-top: 6px; }
  .nav-block { margin-top: 16px; }
  .nav-block-header { position: relative; display: flex; align-items: center; gap: 8px; min-height: 24px; padding: 3px 12px; }
  .nav-block-square, .nav-block-color-btn { width: 9px; height: 9px; border-radius: 3px; background: var(--bc); flex-shrink: 0; border: none; padding: 0; }
  .nav-block-color-btn { position: relative; cursor: pointer; transition: box-shadow .12s, transform .12s; }
  .nav-block-color-btn::before { content: ''; position: absolute; inset: -7px; border-radius: 6px; }
  .nav-block-color-btn:hover { transform: scale(1.25); box-shadow: 0 0 0 2px var(--side), 0 0 0 3.5px var(--side-muted); }
  .nav-block-name {
    flex: 1; min-width: 0; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--side-muted); line-height: 1.45; overflow-wrap: anywhere; outline: none; border-radius: 4px;
  }
  .nav-block-name:empty::before { content: attr(data-placeholder); opacity: .55; }
  .nav-block-name[contenteditable="true"] { cursor: text; }
  .nav-block-name[contenteditable="true"]:focus { color: var(--side-text); background: rgba(239,232,214,.08); box-shadow: 0 0 0 4px rgba(239,232,214,.08); }
  .nav-block-count { font-size: 11px; color: var(--side-muted); opacity: .75; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .nav-dirs { display: flex; flex-direction: column; gap: 1px; margin-top: 3px; }
  .nav-dir-item {
    position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px 9px 29px; border-radius: 8px;
    color: var(--side-text); font-size: 13px; line-height: 1.38; cursor: pointer; outline: none; transition: background .12s, opacity .12s;
  }
  .nav-dir-item:hover { background: var(--side-hover); }
  .nav-dir-item:focus-visible { box-shadow: inset 0 0 0 1.5px rgba(220,240,74,.6); }
  .nav-dir-item.active { background: var(--lime-soft); color: var(--lime); font-weight: 700; }
  .nav-dir-item.is-dim { opacity: .38; }
  .nav-dir-main { flex: 1; min-width: 0; }
  .nav-dir-line { overflow-wrap: anywhere; }
  .nav-dir-name { outline: none; border-radius: 3px; }
  .nav-dir-name:empty::before { content: attr(data-placeholder); color: var(--side-muted); font-weight: 500; }
  .nav-dir-name[contenteditable="true"] { cursor: text; }
  .nav-dir-name[contenteditable="true"]:focus { background: rgba(239,232,214,.1); box-shadow: 0 0 0 3px rgba(239,232,214,.1); }
  .nav-dir-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--overdue-dot); margin-left: 7px; vertical-align: 1px; }
  .nav-dir-bar { height: 3px; border-radius: 2px; background: rgba(239,232,214,0.12); margin-top: 6px; overflow: hidden; }
  .nav-dir-bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
  .nav-dir-count { flex-shrink: 0; font-size: 11px; font-weight: 500; line-height: 18px; color: var(--side-muted); font-variant-numeric: tabular-nums; }

  .block-drag-handle, .dir-drag-handle { display: none; position: absolute; color: var(--side-muted); opacity: 0; cursor: grab; transition: opacity .12s; }
  body:not(.locked) .block-drag-handle, body:not(.locked) .dir-drag-handle { display: block; }
  .block-drag-handle { left: -8px; top: 5px; }
  .dir-drag-handle { left: 9px; top: 10px; }
  .block-drag-handle svg, .dir-drag-handle svg { width: 14px; height: 14px; }
  .nav-block-header:hover .block-drag-handle, .nav-dir-item:hover .dir-drag-handle { opacity: .75; }
  .nav-delete-btn {
    display: none; flex-shrink: 0; width: 20px; height: 20px; margin: -1px -6px 0 0; border: none; border-radius: 5px;
    background: transparent; color: var(--side-muted); align-items: center; justify-content: center; opacity: 0; transition: opacity .12s, color .12s, background .12s;
  }
  body:not(.locked) .nav-delete-btn { display: inline-flex; }
  .nav-delete-btn svg { width: 14px; height: 14px; }
  .nav-block-header:hover > .nav-delete-btn, .nav-dir-item:hover > .nav-delete-btn, .nav-delete-btn:focus-visible { opacity: .85; }
  .nav-delete-btn:hover { opacity: 1; color: var(--overdue-dot); background: rgba(255,122,89,.12); }
  .nav-add-dir-btn, .nav-add-block-btn {
    display: none; align-items: center; gap: 7px; width: 100%; border: none; border-radius: 8px; background: transparent;
    color: var(--side-muted); font-size: 12px; font-weight: 600; text-align: left; padding: 7px 12px 7px 27px; transition: background .12s, color .12s;
  }
  body:not(.locked) .nav-add-dir-btn, body:not(.locked) .nav-add-block-btn { display: flex; }
  .nav-add-dir-btn svg, .nav-add-block-btn svg { width: 14px; height: 14px; }
  .nav-add-dir-btn:hover, .nav-add-block-btn:hover { color: var(--lime); background: var(--side-hover); }
  .nav-add-block-btn { margin-top: 18px; justify-content: center; padding: 9px 12px; border: 1px dashed rgba(239,232,214,.2); }
  .nav-empty { color: var(--side-muted); font-size: 12px; line-height: 1.5; padding: 18px 12px; }
  .nav-block.block-dragging, .nav-dir-item.dir-dragging { opacity: .35; }
  .block-drop-indicator, .dir-drop-indicator { height: 2px; margin: 2px 12px; border-radius: 2px; background: var(--lime); pointer-events: none; }

  /* ── Ручка ширины колонки ── */
  .panel-resizer { width: 8px; margin: 0 -4px; flex-shrink: 0; position: relative; z-index: 30; cursor: col-resize; touch-action: none; outline: none; }
  .panel-resizer::after {
    content: ''; position: absolute; top: 50%; left: -1px; width: 4px; height: 40px; margin-top: -20px;
    border-radius: 2px; background: var(--handle); transition: background .15s;
  }
  .panel-resizer:hover::after, .panel-resizer:focus-visible::after, body.is-resizing .panel-resizer::after { background: var(--lime); }
  body.is-resizing, body.is-resizing * { cursor: col-resize !important; user-select: none !important; -webkit-user-select: none !important; }

  /* ── Шапка ── */
  .main-header {
    height: 68px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 40px;
    border-bottom: 1px solid var(--line); background: var(--page); position: relative; z-index: 15;
  }
  .header-spacer { flex: 1; min-width: 8px; }
  .icon-btn {
    width: 38px; height: 38px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 10px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); transition: background .15s, border-color .15s;
  }
  .icon-btn:hover { border-color: var(--line-hover); background: #fff; }
  .icon-btn svg { width: 18px; height: 18px; }
  .hamburger-btn { display: none; }
  .lock-btn.unlocked { background: var(--lime); border-color: #C2D53A; }
  .lock-btn.unlocked:hover { background: #E4F566; }

  .season-wrap { position: relative; flex-shrink: 0; }
  .season-pill {
    height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 14px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--text); font-size: 12px; font-weight: 700; white-space: nowrap;
    transition: border-color .15s;
  }
  .season-pill:hover { border-color: var(--line-hover); }
  #season-pill-label { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .season-wrap.open .season-pill { border-color: var(--text); }
  .season-pill-chev { display: inline-flex; color: var(--text-2); transition: transform .15s; }
  .season-pill-chev svg { width: 14px; height: 14px; }
  .season-wrap.open .season-pill-chev { transform: rotate(180deg); }

  .season-menu, .export-menu, .autocomplete-list, .color-palette-popup {
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow-pop); font-family: var(--font-ui);
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .season-menu { display: none; position: absolute; top: calc(100% + 8px); left: 0; width: 310px; max-width: calc(100vw - 24px); padding: 6px; z-index: 600; }
  .season-wrap.open .season-menu { display: block; animation: pop-in .12s ease-out; }
  .season-menu-head { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); padding: 8px 10px 6px; }
  .season-list { max-height: 50vh; overflow-y: auto; }
  .season-item { display: flex; align-items: center; gap: 2px; border-radius: 8px; }
  .season-item:hover { background: var(--note-bg); }
  .season-item-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: none; border-radius: 8px; background: transparent;
    padding: 9px 8px 9px 6px; text-align: left; font-size: 13px; font-weight: 500; color: var(--text);
  }
  .season-item.active .season-item-main { font-weight: 700; }
  .season-check { width: 18px; display: inline-flex; justify-content: center; color: var(--st-done); flex-shrink: 0; }
  .season-item-name { overflow-wrap: anywhere; }
  .season-item-meta { margin-left: auto; padding-left: 8px; font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .season-item-actions { display: flex; gap: 2px; padding-right: 4px; }
  .season-icon-btn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 7px; background: transparent; color: var(--text-2); }
  .season-icon-btn:hover { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
  .season-icon-btn.danger:hover { color: var(--overdue); }
  .season-icon-btn.is-disabled, .season-icon-btn.is-disabled:hover { opacity: .3; cursor: not-allowed; background: transparent; box-shadow: none; color: var(--text-2); }
  .season-new-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 6px; padding: 11px 10px 7px 8px; border: none; border-top: 1px solid var(--line);
    background: transparent; font-size: 13px; font-weight: 600; color: var(--text); text-align: left;
  }
  .season-new-btn svg { color: var(--text-2); }
  .season-new-btn:hover svg { color: var(--text); }
  body.locked .season-item-actions, body.locked .season-new-btn { display: none; }

  .search-wrap { position: relative; width: 280px; min-width: 0; flex: 0 1 280px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; color: var(--text-2); pointer-events: none; }
  .search-input {
    width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--card);
    padding: 0 34px 0 38px; font-size: 13px; font-weight: 500; color: var(--text); outline: none;
    -webkit-appearance: none; appearance: none; transition: border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:hover { border-color: var(--line-hover); }
  .search-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .search-input::-webkit-search-cancel-button, .search-input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border: none; border-radius: 7px;
    background: transparent; color: var(--text-2); display: none; align-items: center; justify-content: center;
  }
  .search-wrap.has-value .search-clear { display: inline-flex; }
  .search-clear:hover { background: var(--note-bg); color: var(--text); }

  .export-wrap { position: relative; flex-shrink: 0; }
  .export-btn {
    height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 13px; border: none; border-radius: 10px;
    background: var(--side); color: var(--page); font-size: 13px; font-weight: 600; transition: background .15s;
  }
  .export-btn:hover { background: #3A2C1A; }
  .export-chev { display: inline-flex; opacity: .55; }
  .export-chev svg { width: 14px; height: 14px; }
  .export-menu { display: none; position: absolute; right: 0; top: calc(100% + 8px); width: 290px; padding: 6px; z-index: 600; }
  .export-menu.open { display: block; animation: pop-in .12s ease-out; }
  .export-menu-item {
    display: flex; align-items: flex-start; gap: 11px; width: 100%; padding: 9px 10px; border: none; border-radius: 8px;
    background: transparent; color: var(--text); text-align: left;
  }
  .export-menu-item:hover { background: var(--note-bg); }
  .export-menu-item .i { color: var(--text-2); margin-top: 1px; }
  .emi-text { display: flex; flex-direction: column; gap: 1px; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .emi-sub { font-size: 12px; font-weight: 500; color: var(--text-2); }
  .export-sep { height: 1px; margin: 6px 4px; background: var(--line); }

  /* ── Фильтры ── */
  .filter-bar {
    flex-shrink: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; padding: 10px 40px;
    border-bottom: 1px solid var(--line); background: var(--page);
  }
  .filter-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .filter-btn {
    height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; border: none;
    background: transparent; color: var(--text-2); font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .12s, color .12s;
  }
  .filter-btn:hover { background: var(--note-bg); color: var(--text); }
  .filter-btn.active { background: var(--side); color: var(--page); }
  .filter-btn.active-overdue { background: var(--overdue); color: #fff; }
  .fdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .filter-btn.active .fdot, .filter-btn.active-overdue .fdot { box-shadow: 0 0 0 1.5px rgba(255,255,255,.75); }
  .filter-person {
    position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 28px 0 10px;
    border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text-2); min-width: 0; max-width: 100%;
  }
  .filter-person.is-set { border-color: var(--text); color: var(--text); }
  .filter-person > svg { width: 14px; height: 14px; }
  .filter-person .filter-chev { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; display: flex; }
  .filter-person .filter-chev svg { width: 14px; height: 14px; }
  .filter-select {
    border: none; background: transparent; outline: none; cursor: pointer; min-width: 0; max-width: 220px;
    font-size: 12px; font-weight: 600; color: var(--text); -webkit-appearance: none; appearance: none; text-overflow: ellipsis;
  }
  .filter-person:focus-within { box-shadow: 0 0 0 3px var(--lime-ring); }
  .filter-reset {
    display: inline-flex; align-items: center; gap: 5px; border: none; border-radius: 7px; background: transparent;
    padding: 5px 8px; font-size: 12px; font-weight: 600; color: var(--text-2);
  }
  .filter-reset:hover { color: var(--overdue); background: rgba(184,55,31,.07); }
  .filter-reset svg { width: 14px; height: 14px; }

  /* ── Общие элементы страниц ── */
  .dir-view, .overview, .search-view { max-width: 980px; }
  .block-label {
    display: inline-flex; align-items: center; max-width: 100%; padding: 5px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.2; overflow-wrap: anywhere;
  }
  .page-kicker { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
  .dir-head-row { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px 28px; margin-top: 14px; }
  .dir-title-display, .page-title {
    flex: 1 1 360px; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 42px; line-height: 1.1;
    letter-spacing: -0.01em; color: var(--text); overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto;
  }
  .dir-progress { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; flex-shrink: 0; }
  .progress { width: 180px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex-shrink: 0; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .progress-text { font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .progress-text b { color: var(--overdue); font-weight: 700; }
  .dir-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; min-height: 34px; margin-top: 16px; }
  .text-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-left: -8px; padding: 6px 8px; border: none; border-radius: 8px;
    background: transparent; font-size: 13px; font-weight: 600; color: var(--text-2);
  }
  .text-btn:hover { color: var(--text); background: var(--note-bg); }
  .dir-filter-note { font-size: 12px; color: var(--text-2); }
  .dir-add-task-btn {
    margin-left: auto; height: 34px; display: none; align-items: center; gap: 6px; padding: 0 14px 0 11px; border-radius: 10px;
    border: 1px dashed var(--line-hover); background: transparent; font-size: 13px; font-weight: 600; color: var(--text);
  }
  body:not(.locked) .dir-add-task-btn { display: inline-flex; }
  .dir-add-task-btn:hover { border-style: solid; border-color: var(--text); background: var(--card); }
  .empty-note {
    margin-top: 28px; padding: 28px 20px; border: 1px dashed var(--line-strong); border-radius: 10px;
    text-align: center; font-size: 14px; color: var(--text-2);
  }

  /* ── Группы статусов ── */
  .status-group { margin-top: 28px; }
  .status-group-header {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 4px 6px 4px 0; border: none; border-radius: 6px;
    background: transparent; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-2);
  }
  .status-group-header:hover { color: var(--text); }
  .sg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sg-sep { opacity: .7; }
  .sg-count { font-variant-numeric: tabular-nums; }
  .sg-chev { display: inline-flex; opacity: .8; transform: rotate(-90deg); transition: transform .15s; }
  .sg-chev.open { transform: rotate(0deg); }
  .sg-chev svg { width: 14px; height: 14px; }
  .status-group-body { display: flex; flex-direction: column; gap: 8px; }
  .status-group-body.collapsed { display: none; }
  .drop-indicator { height: 2px; margin: -3px 0; border-radius: 2px; background: var(--text); pointer-events: none; }

  /* ── Карточки задач ── */
  .task-wrapper { background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
  .task-wrapper:hover { border-color: #DACFB5; }
  .task-wrapper:has(.task-row.is-expanded) { border-color: #D3C6A8; box-shadow: 0 8px 22px -14px rgba(42,31,18,.32); }
  .task-wrapper.dragging { opacity: .4; }
  .task-row { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .drag-handle {
    display: none; position: absolute; left: 1px; top: 14px; width: 14px; height: 20px; align-items: center; justify-content: center;
    color: var(--text-3); cursor: grab; opacity: 0; transition: opacity .12s;
  }
  body:not(.locked) .drag-handle { display: flex; }
  .task-row:hover .drag-handle { opacity: 1; }
  .drag-handle svg { width: 14px; height: 14px; }
  .status-dot {
    position: relative; width: 12px; height: 12px; margin-top: 4.5px; flex-shrink: 0; border: none; border-radius: 50%; padding: 0;
    background: var(--dot); transition: box-shadow .15s;
  }
  .status-dot::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; }
  body:not(.locked) .status-dot:hover { box-shadow: 0 0 0 3px var(--card), 0 0 0 4.5px var(--dot); }
  body.locked .status-dot { pointer-events: none; }
  .task-main { flex: 1; min-width: 0; }
  .task-title-full { font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--text); overflow-wrap: anywhere; }
  .task-title-full:empty::before { content: 'Задача…'; color: var(--text-3); }
  body:not(.locked) .task-title-full { cursor: text; }
  .task-wrapper.status-done .task-title-full { color: var(--text-2); text-decoration: line-through; text-decoration-color: rgba(122,110,88,.55); }
  .task-row-input {
    display: none; width: calc(100% + 12px); margin: -3px -6px; padding: 2px 6px; border: none; border-radius: 6px; resize: none; overflow: hidden;
    background: #fff; font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--text); outline: none;
    box-shadow: 0 0 0 1px #B9AD8F, 0 0 0 4px var(--lime-ring);
  }
  .task-row.editing .task-title-full { display: none; }
  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 6px; font-size: 12px; font-weight: 500; color: var(--text-2); }
  .meta-item { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .meta-item svg { width: 14px; height: 14px; color: var(--text-3); }
  .meta-date { white-space: nowrap; }
  .meta-date.is-overdue { color: var(--overdue); font-weight: 700; }
  .meta-date.is-overdue svg { color: var(--overdue); }
  .task-row-responsible { overflow-wrap: anywhere; }
  .resp-chip { border-radius: 4px; }
  body:not(.locked) .resp-chip { cursor: pointer; }
  body:not(.locked) .resp-chip:hover { color: var(--overdue); text-decoration: line-through; }
  body.locked .resp-chip { pointer-events: none; }
  .task-note {
    display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; padding: 7px 10px; border-radius: 8px;
    background: var(--note-bg); color: var(--note-text); font-size: 13px; line-height: 1.42;
  }
  .task-note svg { width: 14px; height: 14px; margin-top: 2px; color: #9C8E70; }
  .task-note-text {
    flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .task-note-more { flex-shrink: 0; margin-top: 1px; padding: 1px 6px; border-radius: 999px; background: rgba(255,255,255,.6); font-size: 11px; font-weight: 700; color: #8C7E62; }
  .task-row.is-expanded .task-note { display: none; }
  .task-row-chevron {
    flex-shrink: 0; width: 28px; height: 28px; margin: -3px -8px -3px 0; display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 8px; background: transparent; color: var(--text-3); transition: transform .18s, background .12s, color .12s;
  }
  .task-row-chevron:hover { background: var(--note-bg); color: var(--text); }
  .task-row-chevron.open { transform: rotate(180deg); }

  /* ── Раскрытая задача ── */
  .task-detail { border-top: 1px solid #EEE7D6; padding: 10px 16px 14px 40px; }
  .detail-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-left: -9px; }
  .detail-btn {
    height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: none; border-radius: 8px;
    background: transparent; font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap;
  }
  .detail-btn:hover { background: var(--note-bg); color: var(--text); }
  .detail-btn svg { width: 15px; height: 15px; }
  .hist-icon-btn.active { color: var(--text); background: var(--note-bg); }
  .hist-count { min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--line); color: var(--text); font-size: 11px; font-weight: 700; line-height: 17px; text-align: center; }
  .deadline-wrap { position: relative; display: inline-flex; }
  .deadline-input { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  .deadline-ru.overdue-date { color: var(--overdue); }
  body.locked .deadline-ru { pointer-events: none; }
  .resp-group { display: inline-flex; align-items: center; }
  .resp-icon-wrap { display: none; }
  .resp-icon-wrap.open { display: inline-flex; }
  .resp-icon-input {
    width: 200px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff;
    font-size: 13px; color: var(--text); outline: none;
  }
  .resp-icon-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .detail-delete-btn { margin-left: auto; }
  .detail-delete-btn:hover { color: var(--overdue); background: rgba(184,55,31,.08); }
  .autocomplete-wrap { position: relative; display: inline-flex; }
  .autocomplete-list { position: absolute; top: calc(100% + 6px); left: 0; z-index: 400; min-width: 220px; max-height: 240px; overflow-y: auto; padding: 4px; }
  .autocomplete-item { padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; outline: none; }
  .autocomplete-item:hover, .autocomplete-item:focus { background: var(--note-bg); }
  .autocomplete-item mark { background: transparent; padding: 0; font-weight: 700; }

  .history-body { margin-top: 10px; }
  .history-body:not(.showing-log):has(.log-entries:empty) { display: none !important; }
  .log-entries { display: flex; flex-direction: column; gap: 2px; }
  .log-entries:empty { display: none; }
  .log-entry { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; margin: 0 -8px; padding: 6px 8px; border-radius: 8px; }
  .log-entry:hover { background: var(--note-bg); }
  .log-date { font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .log-text { font-size: 13px; line-height: 1.45; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .log-entry-actions { display: flex; gap: 2px; align-self: center; opacity: 0; transition: opacity .12s; }
  .log-entry:hover .log-entry-actions, .log-entry:focus-within .log-entry-actions { opacity: 1; }
  body.locked .log-entry-actions { display: none; }
  .log-edit-btn, .log-del-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 7px; background: transparent; color: var(--text-2); }
  .log-edit-btn:hover { color: var(--text); background: var(--card); }
  .log-del-btn:hover { color: var(--overdue); background: var(--card); }
  .log-edit-btn svg, .log-del-btn svg { width: 14px; height: 14px; }
  .log-edit-area {
    grid-column: 2 / 4; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid #B9AD8F; background: #fff;
    font-size: 13px; line-height: 1.45; resize: none; overflow: hidden; outline: none; box-shadow: 0 0 0 3px var(--lime-ring);
  }
  .log-new-btn {
    display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 0 -8px; padding: 5px 8px; border: none; border-radius: 8px;
    background: transparent; font-size: 12px; font-weight: 600; color: var(--text-2);
  }
  .log-new-btn:hover { background: var(--note-bg); color: var(--text); }
  .log-new-btn svg { width: 14px; height: 14px; }
  body.locked .log-new-btn, body.locked .log-add { display: none !important; }
  .log-add { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; }
  .log-input {
    flex: 1; min-height: 38px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff;
    font-size: 13px; line-height: 1.45; resize: none; overflow: hidden; outline: none;
  }
  .log-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .log-cancel-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: transparent; color: var(--text-2); }
  .log-cancel-btn:hover { background: var(--note-bg); color: var(--overdue); }

  /* ── Обзор ── */
  .ov-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .ov-stat {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--card-line); background: var(--card); font-size: 13px; font-weight: 500; color: var(--text-2);
  }
  .ov-stat b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .ov-stat.is-overdue b { color: var(--overdue); }
  .ov-block { margin-top: 32px; }
  .ov-block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ov-block-count { font-size: 12px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .ov-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .dir-tile {
    position: relative; min-height: 98px; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--card-line); background: var(--card); color: var(--text); text-align: left; transition: border-color .15s, box-shadow .15s;
  }
  .dir-tile:hover { border-color: #CFC2A3; box-shadow: 0 10px 24px -16px rgba(42,31,18,.4); }
  .dir-tile.is-dim { opacity: .45; }
  .dir-tile-name { font-size: 15px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .dir-tile-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .dir-tile .progress { width: 100%; height: 4px; }
  .dir-tile-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 500; color: var(--text-2); }
  .dir-tile-overdue { display: inline-flex; align-items: center; gap: 5px; color: var(--overdue); font-weight: 700; }
  .dir-tile-overdue::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--overdue); }
  .ov-empty-block { font-size: 13px; color: var(--text-2); }

  /* ── Поиск ── */
  .search-view-title { margin-top: 8px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; }
  .search-view-sub { margin-top: 6px; font-size: 13px; color: var(--text-2); }
  .search-dir-hits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .search-dir-chip {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 12px 6px 10px; border-radius: 999px;
    border: 1px solid var(--card-line); background: var(--card); font-size: 13px; font-weight: 600; color: var(--text);
  }
  .search-dir-chip:hover { border-color: #CFC2A3; }
  .search-dir-chip-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .search-dir-chip-name { text-align: left; overflow-wrap: anywhere; }
  .search-dir-chip-block { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
  .search-group { margin-top: 28px; }
  .search-group-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; max-width: 100%; margin-bottom: 10px; padding: 0; border: none; background: transparent; color: var(--text); text-align: left; }
  .search-group-head .block-label { font-size: 10px; padding: 4px 8px; }
  .search-group-title { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
  .search-group-head:hover .search-group-title { text-decoration: underline; text-underline-offset: 3px; }
  .search-group-count { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .search-group-body { display: flex; flex-direction: column; gap: 8px; }

  /* ── Палитра блока ── */
  .color-palette-popup { position: fixed; z-index: 2000; width: 232px; padding: 12px; display: flex; flex-direction: column; gap: 10px; animation: pop-in .12s ease-out; }
  .palette-head { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
  .color-palette-swatches { display: grid; grid-template-columns: repeat(6, 26px); gap: 9px 10px; }
  .palette-swatch {
    position: relative; width: 26px; height: 26px; border: none; border-radius: 50%; padding: 0; cursor: pointer;
    background: var(--sw); box-shadow: inset 0 0 0 1px rgba(42,31,18,.12); transition: transform .12s, box-shadow .12s;
  }
  .palette-swatch:hover { transform: scale(1.12); }
  .palette-swatch.active { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--text); }
  .palette-picker {
    display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
    background: conic-gradient(#ff5f5f, #ffd25f, #8fe35f, #5fe0e8, #5f7dff, #d65fff, #ff5f5f);
  }
  .palette-picker:focus-within { outline: 2px solid var(--text); outline-offset: 3px; }
  .palette-picker-plus { display: flex; color: #fff; pointer-events: none; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.65)); }
  .palette-picker-plus svg { width: 14px; height: 14px; }
  .palette-picker-input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: none; opacity: 0; cursor: pointer; }
  .palette-caption { display: flex; align-items: center; gap: 8px; min-height: 30px; padding-top: 10px; border-top: 1px solid var(--line); }
  .palette-caption-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(42,31,18,.15); }
  .palette-caption-dot.rainbow { background: conic-gradient(#ff5f5f, #ffd25f, #8fe35f, #5fe0e8, #5f7dff, #d65fff, #ff5f5f); }
  .palette-caption-name { font-size: 13px; font-weight: 600; }
  .palette-caption-hex { margin-left: auto; font-size: 11px; color: var(--text-2); font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

  /* ── Диалоги ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(42,31,18,.42); opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .modal-overlay.visible { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 440px; max-height: calc(100dvh - 32px); overflow-y: auto; padding: 22px 22px 18px;
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 26px 64px -18px rgba(42,31,18,.5);
    transform: translateY(6px) scale(.985); transition: transform .15s;
  }
  .modal-overlay.visible .modal { transform: none; }
  .modal-title { margin-bottom: 12px; font-size: 17px; font-weight: 700; letter-spacing: -0.005em; }
  .modal-msg { margin-bottom: 18px; font-size: 14px; color: var(--text); }
  .modal-text { line-height: 1.55; overflow-wrap: anywhere; }
  .modal-text strong { font-weight: 700; }
  .modal-sub { display: inline-block; margin-top: 8px; font-size: 13px; line-height: 1.5; color: var(--text-2); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-cancel, .modal-confirm { height: 38px; padding: 0 16px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .modal-cancel { border: 1px solid var(--line-strong); background: transparent; color: var(--text); }
  .modal-cancel:hover { background: var(--note-bg); }
  .modal-confirm { border: none; background: var(--side); color: var(--page); }
  .modal-confirm:hover { background: #3A2C1A; }
  .modal-confirm.danger { background: var(--overdue); color: #fff; }
  .modal-confirm.danger:hover { background: #9C2D18; }
  .modal.shake { animation: modal-shake .32s; }
  @keyframes modal-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .form-label { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--text-2); }
  .form-input {
    width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff;
    font-size: 14px; font-weight: 500; color: var(--text); outline: none;
  }
  .form-input:focus { border-color: #B9AD8F; box-shadow: 0 0 0 3px var(--lime-ring); }
  .form-error { min-height: 18px; margin: 6px 0 8px; font-size: 12px; font-weight: 600; color: var(--overdue); }
  .form-choice {
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line-strong); cursor: pointer; transition: border-color .12s, background .12s;
  }
  .form-choice:hover { border-color: var(--line-hover); }
  .form-choice:has(input:checked) { border-color: var(--text); background: #fff; }
  .form-choice input { margin-top: 3px; accent-color: #2A1F12; }
  .form-choice-text { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.4; }
  .form-choice-text b { font-weight: 700; }
  .form-choice-text small { font-size: 12px; color: var(--text-2); }

  /* ── Уведомление с отменой ── */
  .undo-toast {
    position: fixed; left: calc(50% + var(--panel-w) / 2); bottom: 24px; z-index: 2500; max-width: calc(100vw - var(--panel-w) - 32px);
    display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 16px; border-radius: 10px;
    background: var(--side); color: var(--side-text); font-size: 13px; font-weight: 500; box-shadow: 0 18px 44px -12px rgba(42,31,18,.55);
    opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s;
  }

// ── Хранилище: сезоны (g8-tracker-v2) + миграция из g8-tracker-v1 ────────────
const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;

// id попадают в onclick-атрибуты, поэтому недопустимые и повторяющиеся id заменяются
function sanitizeBlocks(blocks) {
  const seen = new Set();
  const fixId = id => {
    let v = (typeof id === 'string' && SAFE_ID.test(id)) ? id : genId();
    while (seen.has(v)) v = genId();
    seen.add(v);
    return v;
  };
  (blocks || []).forEach(b => {
    b.id = fixId(b.id);
    if (!Array.isArray(b.directions)) b.directions = [];
    b.directions.forEach(d => {
      d.id = fixId(d.id);
      if (!Array.isArray(d.tasks)) d.tasks = [];
      d.tasks.forEach(t => { t.id = fixId(t.id); });
    });
  });
  return blocks;
}
function isValidDb(d) {
  return !!d && Array.isArray(d.seasons) && d.seasons.length > 0 &&
    d.seasons.every(s => s && typeof s === 'object' && Array.isArray(s.blocks));
}
function normalizeDb(d) {
  const ids = new Set();
  d.seasons.forEach((s, i) => {
    if (typeof s.id !== 'string' || !SAFE_ID.test(s.id) || ids.has(s.id)) s.id = genSeasonId();
    ids.add(s.id);
    s.name = (typeof s.name === 'string' && s.name.trim()) ? s.name.trim().slice(0, 40) : `Сезон ${i + 1}`;
    sanitizeBlocks(s.blocks);
  });
  return { version: 2, seasons: d.seasons };
}
function seasonFromBlocks(blocks) {
  return { id: MIGRATED_SEASON_ID, name: MIGRATED_SEASON_NAME, blocks: sanitizeBlocks(blocks) };
}

async function loadDb() {
  const raw2 = lsGet(STORAGE_KEY);
  if (raw2) {
    try { const d = JSON.parse(raw2); if (isValidDb(d)) return normalizeDb(d); } catch (e) {}
    // нечитаемые данные не затираем — откладываем копию
    lsSet(`${STORAGE_KEY}-unreadable-${Date.now()}`, raw2);
  }
  const raw1 = lsGet(STORAGE_KEY_V1);
  if (raw1) {
    try {
      const d = JSON.parse(raw1);
      if (d && Array.isArray(d.blocks)) {
        const migrated = { version: 2, seasons: [seasonFromBlocks(d.blocks)] };
        lsSet(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }
    } catch (e) {}
  }
  try {
    const r = await fetch('data.json?v=' + Date.now());
    if (r.ok) {
      const data = await r.json();
      if (isValidDb(data)) return normalizeDb(data);
      if (data && Array.isArray(data.blocks)) return { version: 2, seasons: [seasonFromBlocks(data.blocks)] };
    }
  } catch (e) {}

}

}

function listDrop(event, blockId, dirId) {
  event.preventDefault();
  clearDropIndicators();
  if (!dragTask) return;

  const srcBlock = state.blocks.find(b => b.id === dragTask.blockId);
  const srcDir = srcBlock && srcBlock.directions.find(d => d.id === dragTask.dirId);
  const tgtBlock = state.blocks.find(b => b.id === blockId);
  const tgtDir = tgtBlock && tgtBlock.directions.find(d => d.id === dirId);
  if (!srcDir || !tgtDir) return;

  const fromIdx = srcDir.tasks.findIndex(t => t.id === dragTask.taskId);
  if (fromIdx === -1) return;
  // Задачи показаны группами по статусу: позицию внутри группы переводим в индекс полного списка
  const movingId = dragTask.taskId;
  const items = [...event.currentTarget.querySelectorAll(':scope > [data-task]')];
  const idx = dndInsertIdx(event.currentTarget, '[data-task]', event.clientY);
  const beforeEl = items.slice(idx).find(el => el.dataset.task !== movingId);
  const afterEl = items.slice(0, idx).reverse().find(el => el.dataset.task !== movingId);
  pushUndo();
  const [moved] = srcDir.tasks.splice(fromIdx, 1);
  let toIdx = tgtDir.tasks.length;
  if (beforeEl) {
    const i = tgtDir.tasks.findIndex(t => t.id === beforeEl.dataset.task);
    if (i !== -1) toIdx = i;
  } else if (afterEl) {
    const i = tgtDir.tasks.findIndex(t => t.id === afterEl.dataset.task);
    if (i !== -1) toIdx = i + 1;
  }
  tgtDir.tasks.splice(toIdx, 0, moved);
  dragTask = null;
  saveData();
}

// ── Поиск по текущему сезону ──────────────────────────────────────────────────
function normText(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е'); }

function taskMatchesSearch(task) {
  const tokens = searchTokens();
  if (!tokens.length) return true;
  const hay = normText([task.text, ...(task.responsible || []), ...(task.log || []).map(l => l.text)].join('\n'));
  return tokens.every(tk => hay.includes(tk));
}
// экранирует текст и подсвечивает совпадения с поиском
function hl(text) {
  const tokens = searchTokens();
  const src = String(text || '');
  if (!tokens.length || !src) return esc(src);
  const low = normText(src);
  if (low.length !== src.length) return esc(src);
  const marks = new Array(src.length).fill(false);
  tokens.forEach(tk => {
    let i = low.indexOf(tk);
    while (i !== -1) { for (let k = i; k < i + tk.length; k++) marks[k] = true; i = low.indexOf(tk, i + tk.length); }
  });
  let out = '', open = false;
  for (let i = 0; i < src.length; i++) {
    if (marks[i] && !open) { out += '<mark>'; open = true; }
    if (!marks[i] && open) { out += '</mark>'; open = false; }
    out += esc(src[i]);
  }
  return open ? out + '</mark>' : out;
}

// ── Task expand / history ─────────────────────────────────────────────────────
function applyExpandAll(ids, open) {
  ids.forEach(id => {
    open ? expandedTasks.add(id) : expandedTasks.delete(id);
    let hasLog = false;
    if (open) {
      outer: for (const b of state.blocks) for (const d of b.directions) {
        const t = d.tasks.find(t => t.id === id);
        if (t) { hasLog = (t.log||[]).length > 0; break outer; }
      }
    }
    hasLog ? openHistories.add(id) : openHistories.delete(id);
    const detail   = document.getElementById(`detail-${id}`);
    const card     = document.getElementById(`card-${id}`);
    const chev     = document.getElementById(`chev-${id}`);
    const histBody = document.getElementById(`hist-body-${id}`);
    const histBtn  = document.getElementById(`hist-btn-${id}`);
    if (detail)   detail.style.display = open ? 'block' : 'none';
    if (card)     card.classList.toggle('is-expanded', open);
    if (chev)     chev.classList.toggle('open', open);
    if (histBody) histBody.style.display = hasLog ? 'block' : 'none';
    if (histBtn)  { histBtn.classList.toggle('open', hasLog); syncHistBtn(id, histBtn); }
  });
}
function matchedTaskIds(tasks) {
  return tasks.filter(t => taskMatchesFilter(t)).map(t => t.id);
}
function toggleAllTasksInDir(blockId, dirId) {
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  if (!d) return;
  const ids = matchedTaskIds(d.tasks);
  if (!ids.length) return;
  const allOpen = ids.every(id => expandedTasks.has(id));
  applyExpandAll(ids, !allOpen);
  const btn = document.querySelector('.dir-expand-all-btn');
  if (btn) btn.innerHTML = allOpen ? `${ICONS.expand}<span>Развернуть все</span>` : `${ICONS.collapse}<span>Свернуть все</span>`;
}
function editTaskTitle(taskId) {

function endEditTitle(taskId) {

function cardClick(event, taskId) {

function openDeadlinePicker(taskId) {

function toggleTask(taskId) {

  const detail = document.getElementById(`detail-${taskId}`);
  const card   = document.getElementById(`card-${taskId}`);

      const t = d.tasks.find(t => t.id === taskId);
      if (t) { logCount = (t.log || []).length; break outer; }

function triggerLogInput(blockId, dirId, taskId) {

function toggleHistory(taskId) {

function syncHistBtn(taskId, btn) {

function showLogInput(blockId, dirId, taskId) {

function handleLogKey(e, blockId, dirId, taskId) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addLogEntry(blockId, dirId, taskId); }
  else if (e.key === 'Escape') { hideLogInput(taskId); }
}
function addLogEntry(blockId, dirId, taskId) {
  const inp = document.getElementById(`log-input-${taskId}`);

  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);

function refreshLogEntries(blockId, dirId, taskId, t) {
  const el = document.getElementById(`log-entries-${taskId}`);

function renderLogEntries(log, blockId, dirId, taskId) {
  if (!log || log.length === 0) return '';
  return log.map((e, i) => `
    <div class="log-entry" id="log-entry-${taskId}-${i}">
      <span class="log-date">${esc((e.date || '').split(' ')[0])}</span>

        <button type="button" class="log-edit-btn" title="Редактировать" aria-label="Редактировать заметку" onclick="startEditLog('${blockId}','${dirId}','${taskId}',${i})">${ICONS.pencil}</button>
        <button type="button" class="log-del-btn" title="Удалить" aria-label="Удалить заметку" onclick="deleteLog('${blockId}','${dirId}','${taskId}',${i})">${ICONS.x}</button>

function startEditLog(blockId, dirId, taskId, idx) {
  const entry = document.getElementById(`log-entry-${taskId}-${idx}`);
  if (!entry) return;
  const b = state.blocks.find(b => b.id === blockId);
  const d = b && b.directions.find(d => d.id === dirId);
  const t = d && d.tasks.find(t => t.id === taskId);
  if (!t) return;
  const current = (t.log[idx] || {}).text || '';
  const textSpan = entry.querySelector('.log-text');
  const actions  = entry.querySelector('.log-entry-actions');
  textSpan.style.display = 'none';
  actions.style.display  = 'none';
  const ta = document.createElement('textarea');
  ta.className = 'log-edit-area';
  ta.value = current;
  ta.rows = 1;
  ta.style.height = 'auto';
  entry.insertBefore(ta, actions);
  ta.style.height = ta.scrollHeight + 'px';
  ta.focus();
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  const save = () => {
    const val = ta.value.trim();
    if (val && val !== current) {
      t.log[idx].text = val;
      saveData();
    }
    refreshLogEntries(blockId, dirId, taskId, t);
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }

  });

}
function deleteLog(blockId, dirId, taskId, idx) {

    () => {

      t.log.splice(idx, 1);
      saveData();
      refreshLogEntries(blockId, dirId, taskId, t);
      showToast(`«${short}» удалена`);
    }
  );
}

// ── Responsible autocomplete ──────────────────────────────────────────────────
const _acCache = {}; // taskId → suggestions array

function showAC(inp, blockId, dirId, taskId) {
  const query = inp.value.trim().toLowerCase();
  const list  = document.getElementById('ac-' + taskId);
  if (!list) return;

  if (!query) { list.style.display = 'none'; return; }

  // Exclude already-assigned names
  let current = [];
  outer: for (const b of state.blocks) for (const d of b.directions) {
    const t = d.tasks.find(t => t.id === taskId);
    if (t) { current = t.responsible || []; break outer; }
  }

  const suggestions = getAllResponsibles(true).filter(n =>
    !current.includes(n) && n.toLowerCase().startsWith(query)
  );

  _acCache[taskId] = suggestions;

  if (!suggestions.length) { list.style.display = 'none'; return; }

  list.innerHTML = suggestions.map((name, i) => {
    // Highlight matching part
    const lo = name.toLowerCase(), qi = lo.indexOf(query);
    const highlighted = qi >= 0
      ? esc(name.slice(0, qi)) + '<mark>' + esc(name.slice(qi, qi + query.length)) + '</mark>' + esc(name.slice(qi + query.length))
      : esc(name);
    return `<div class="autocomplete-item" tabindex="-1"
      onmousedown="event.preventDefault();pickAC('${blockId}','${dirId}','${taskId}',${i})"
      onkeydown="acItemKey(event,'${blockId}','${dirId}','${taskId}',${i})"
      onblur="respFocusOut('${taskId}')"
    >${highlighted}</div>`;
  }).join('');
  list.style.display = 'block';
}

function hideAC(taskId) {
  const l = document.getElementById('ac-' + taskId);
  if (l) l.style.display = 'none';
}
// список подсказок прячем, только когда фокус ушёл из всего блока ввода (а не в сам список)
function respFocusOut(taskId) {
  setTimeout(() => {
    const wrap = document.getElementById(`resp-wrap-${taskId}`);
    if (wrap && wrap.contains(document.activeElement)) return;
    hideAC(taskId);
    hideRespInput(taskId);
  }, 120);
}

function pickAC(blockId, dirId, taskId, idx) {
  const name = (_acCache[taskId] || [])[idx];
  if (name) addResponsible(blockId, dirId, taskId, name);
}

function acItemKey(event, blockId, dirId, taskId, idx) {
  if (event.key === 'Enter') { event.preventDefault(); pickAC(blockId, dirId, taskId, idx); }
  else if (event.key === 'ArrowDown') { event.preventDefault(); const next = event.target.nextElementSibling; if (next) next.focus(); }
  else if (event.key === 'ArrowUp')   { event.preventDefault(); const prev = event.target.previousElementSibling; if (prev) prev.focus(); else document.getElementById('ac-' + taskId)?.previousElementSibling?.focus(); }
  else if (event.key === 'Escape')    { hideAC(taskId); }
}

// ── Progress ──────────────────────────────────────────────────────────────────
function blockProgress(block) {
  let total = 0, done = 0;
  block.directions.forEach(d => d.tasks.forEach(t => { total++; if (t.status === 'done') done++; }));
  return total === 0 ? null : { total, done, pct: Math.round((done/total)*100) };
}

// ── Block color palette ───────────────────────────────────────────────────────
const PALETTE = [
  { color: '#7a9e00', name: 'Оливковый' },
  { color: '#d4920a', name: 'Янтарный' },
  { color: '#3d85c8', name: 'Синий' },
  { color: '#9b5ea4', name: 'Фиолетовый' },
  { color: '#c07830', name: 'Медный' },
  { color: '#8a7d68', name: 'Серо-коричневый' },
  { color: '#28d5e2', name: 'Бирюзовый' },
  { color: '#e2fd69', name: 'Лаймовый' },
  { color: '#c0392b', name: 'Красный' },
];
const DEFAULT_BLOCK_COLOR = '#7a9e00';

function normHex(c) {
  const m = String(c || '').trim().toLowerCase().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/);
  if (!m) return '';
  return '#' + (m[1].length === 3 ? m[1].split('').map(x => x + x).join('') : m[1]);
}
function blockColorOf(block) { return normHex(block && block.color) || DEFAULT_BLOCK_COLOR; }
function paletteName(hex) {
  const p = PALETTE.find(p => p.color === normHex(hex));
  return p ? p.name : 'Свой цвет';
}

function getLuminance(hex) {
  const rgb = parseInt((normHex(hex) || DEFAULT_BLOCK_COLOR).slice(1), 16);
  const r = ((rgb >> 16) & 0xff) / 255;
  const g = ((rgb >> 8) & 0xff) / 255;
  const b = (rgb & 0xff) / 255;
  const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}
function contrastRatio(l1, l2) { return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); }
const INK_DARK = '#2A1F12';
const INK_LIGHT = '#FFFDF7';

// цвет текста на плашке блока — тот из тёмного/светлого, что контрастнее
function getBlockColors(hex) {
  const l = getLuminance(hex);
  const light = contrastRatio(l, getLuminance(INK_LIGHT)) > contrastRatio(l, getLuminance(INK_DARK));
  return {
    text:    light ? INK_LIGHT : INK_DARK,
    textDim: light ? 'rgba(255,253,247,0.72)' : 'rgba(42,31,18,0.62)',
    barBg:   light ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.18)',
    barFill: light ? 'rgba(255,255,255,0.75)' : 'rgba(0,0,0,0.42)',
  };
}

function pickNextColor() {
  const used = new Set(state.blocks.map(b => normHex(b.color)).filter(Boolean));
  const found = PALETTE.find(p => !used.has(p.color));
  return found ? found.color : PALETTE[state.blocks.length % PALETTE.length].color;
}

let activePaletteBlockId = null;
let paletteUndoPushed = false;
let paletteRenderRaf = 0;
let palettePersistTimer = null;

function paletteSwatch(blockId, color, name, active, extraClass = '') {
  return `<button type="button" class="palette-swatch${active ? ' active' : ''}${extraClass}" style="--sw:${color}"
    data-name="${esc(name)}" data-hex="${color}" aria-label="${esc(name)}" aria-pressed="${active}"
    onclick="selectBlockColor('${blockId}','${color}')"
    onmouseenter="paletteHover(this)" onmouseleave="paletteHover(null)" onfocus="paletteHover(this)" onblur="paletteHover(null)"></button>`;
}

function renderPalette() {
  const popup = document.getElementById('color-palette-popup');
  const b = state.blocks.find(b => b.id === activePaletteBlockId);
  if (!popup || !b) return;
  const current = blockColorOf(b);
  const isPreset = PALETTE.some(p => p.color === current);
  popup.innerHTML = `
    <div class="palette-head">Цвет блока</div>
    <div class="color-palette-swatches">
      ${PALETTE.map(p => paletteSwatch(b.id, p.color, p.name, p.color === current)).join('')}
      ${isPreset ? '' : paletteSwatch(b.id, current, 'Свой цвет', true, ' is-custom')}
      <label class="palette-swatch palette-picker" data-name="Свой цвет…" onmouseenter="paletteHover(this)" onmouseleave="paletteHover(null)">
        <span class="palette-picker-plus" aria-hidden="true">${ICONS.plus}</span>
        <input type="color" class="palette-picker-input" value="${current}" aria-label="Свой цвет: открыть полный спектр"
          onfocus="paletteHover(this.parentElement)" onblur="paletteHover(null)"
          oninput="previewBlockColor('${b.id}', this.value)" onchange="commitBlockColor('${b.id}', this.value)">
      </label>
    </div>
    <div class="palette-caption" id="palette-caption" aria-live="polite"></div>`;
  paletteHover(null);
}

// подпись под кружками — название именно того цвета, на который наведён курсор
function paletteHover(el) {
  const cap = document.getElementById('palette-caption');
  if (!cap) return;
  let name, hex;
  if (el && el.dataset && el.dataset.name) { name = el.dataset.name; hex = el.dataset.hex || ''; }
  else {
    hex = blockColorOf(state.blocks.find(b => b.id === activePaletteBlockId));
    name = paletteName(hex);
  }
  cap.innerHTML = `<span class="palette-caption-dot${hex ? '' : ' rainbow'}"${hex ? ` style="background:${hex}"` : ''}></span>
    <span class="palette-caption-name">${esc(name)}</span>${hex ? `<span class="palette-caption-hex">${hex.toUpperCase()}</span>` : ''}`;
}

function positionPopup(popup, anchor) {
  const r = anchor.getBoundingClientRect();
  const pw = popup.offsetWidth, ph = popup.offsetHeight;
  let left = r.left;
  let top = r.bottom + 8;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  popup.style.left = Math.max(8, left) + 'px';
  popup.style.top = top + 'px';
}

function openColorPalette(blockId, btn) {
  if (!editMode) return;
  if (activePaletteBlockId === blockId) { closeColorPalette(); return; }
  closeColorPalette();
  activePaletteBlockId = blockId;
  paletteUndoPushed = false;
  const popup = document.createElement('div');
  popup.id = 'color-palette-popup';
  popup.className = 'color-palette-popup';
  popup.setAttribute('role', 'dialog');
  popup.setAttribute('aria-label', 'Цвет блока');
  document.body.appendChild(popup);
  renderPalette();
  positionPopup(popup, btn);
  setTimeout(() => document.addEventListener('click', _closePaletteOutside), 0);
}

function _closePaletteOutside(e) {
  const popup = document.getElementById('color-palette-popup');
  if (popup && !popup.contains(e.target)) closeColorPalette();
}

function closeColorPalette() {
  const popup = document.getElementById('color-palette-popup');
  if (popup) popup.remove();
  document.removeEventListener('click', _closePaletteOutside);
  if (palettePersistTimer) { clearTimeout(palettePersistTimer); palettePersistTimer = null; persist(); }
  activePaletteBlockId = null;
}

function applyBlockColor(blockId, color) {
  const b = state.blocks.find(b => b.id === blockId);
  const hex = normHex(color);
  if (!editMode || !b || !hex || blockColorOf(b) === hex) return false;
  if (!paletteUndoPushed) { pushUndo(); paletteUndoPushed = true; }
  b.color = hex;
  return true;
}

function selectBlockColor(blockId, color) {
  if (applyBlockColor(blockId, color)) { persist(); renderNav(); renderRightPanel(); }
  closeColorPalette();
}

// нативный выбор цвета: пока он открыт, саму палитру не перерисовываем
function previewBlockColor(blockId, color) {
  if (!applyBlockColor(blockId, color)) return;
  paletteHover(null);
  cancelAnimationFrame(paletteRenderRaf);
  paletteRenderRaf = requestAnimationFrame(() => { renderNav(); renderRightPanel(); });
  clearTimeout(palettePersistTimer);
  palettePersistTimer = setTimeout(() => { palettePersistTimer = null; persist(); }, 300);
}
function commitBlockColor(blockId, color) {
  previewBlockColor(blockId, color);
  closeColorPalette();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  renderSeasonPill();
  renderNav();
  renderRightPanel();
  updateStats();
}




function esc(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}


// ── Export ────────────────────────────────────────────────────────────────────
function fileSlug(s) {
  return String(s || '').trim().toLowerCase().replace(/[^0-9a-zа-яё_-]+/gi, '-').replace(/^-+|-+$/g, '') || 'season';
}
function downloadBlob(content, type, filename) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportData() {
  let text = `G8 TRACKER — ${seasonLabel(state).toUpperCase()}\nОтчёт от ${fmtNow()}\n${'='.repeat(50)}\n\n`;
  state.blocks.forEach(b => {
    text += `▌ ${b.title||'(без названия)'}\n`;
    b.directions.forEach(d => {
      text += `  ◆ ${d.title||'(без названия)'}`;
      if (d.description) text += `\n    ${d.description}`;
      text += '\n';
      d.tasks.forEach(t => {
        const icon = {todo:'○','in-progress':'◐',done:'●'}[t.status];
        text += `    ${icon} ${t.text||'(без текста)'}${isOverdue(t)?' ⚠':''}`;
        if (t.deadline) text += ` [до ${t.deadline}]`;
        if ((t.responsible||[]).length) text += ` (${t.responsible.join(', ')})`;
        text += '\n';
        (t.log||[]).forEach(e => { text += `      · ${(e.date||'').split(' ')[0]}: ${e.text}\n`; });
      });
      text += '\n';
    });
  });
  downloadBlob(text, 'text/plain;charset=utf-8', `g8-tracker-${fileSlug(state.name)}_${new Date().toISOString().slice(0,10)}.txt`);
}

// ── Export JSON (backup): все сезоны ─────────────────────────────────────────
function exportJSON() {
  const payload = { version: 2, exportedAt: new Date().toISOString(), seasons: db.seasons };
  downloadBlob(JSON.stringify(payload, null, 2), 'application/json;charset=utf-8', `g8-tracker-backup-${new Date().toISOString().slice(0,10)}.json`);
}

function describeSeasons(seasons) {
  const names = [...seasons].map(s => String(s.name)).sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));
  return `${seasons.length} ${plural(seasons.length, 'сезон', 'сезона', 'сезонов')} (${names.map(esc).join(', ')})`;
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      let data;
      try { data = JSON.parse(ev.target.result); }
      catch (err) { showAlert('Ошибка чтения файла', 'Файл повреждён или это не JSON.'); return; }
      importBackupData(data);
    };
    reader.readAsText(file);
  };
  input.click();
}

// Новый формат ({seasons}) заменяет все сезоны; старый ({blocks}) загружается в текущий сезон
function importBackupData(data) {
  if (isValidDb(data)) {
    showConfirm(
      `Загрузить резервную копию со всеми сезонами?<br><span class="modal-sub">Сейчас: ${describeSeasons(db.seasons)}.<br>В файле: ${describeSeasons(data.seasons)}.<br>Текущие данные будут заменены.</span>`,
      () => {
        const prevId = state.id, prevName = state.name;
        db = normalizeDb(JSON.parse(JSON.stringify(data)));
        state = db.seasons.find(s => s.id === prevId) || db.seasons.find(s => s.name === prevName) || sortedSeasons()[sortedSeasons().length - 1];
        lsSet(SEASON_KEY, state.id);
        undoStacks.clear();
        expandedTasks.clear();
        openHistories.clear();
        restoreNav();
        persist();
        renderAll();
        renderSeasonMenu();
        showToast(`Загружено: ${describeSeasons(db.seasons)}`, null);
      },
      { title: 'Восстановить из копии', confirmText: 'Загрузить' }
    );
    return;
  }
  if (data && Array.isArray(data.blocks)) {
    showConfirm(
      `Загрузить резервную копию в <strong>${esc(seasonLabel(state))}</strong>?<br><span class="modal-sub">Файл старого формата — один набор блоков. Данные текущего сезона будут заменены (${state.blocks.length} → ${data.blocks.length} ${plural(data.blocks.length, 'блок', 'блока', 'блоков')}). Другие сезоны не изменятся.</span>`,
      () => {
        pushUndo();
        state.blocks = sanitizeBlocks(JSON.parse(JSON.stringify(data.blocks)));
        expandedTasks.clear();
        openHistories.clear();
        restoreNav();
        persist();
        renderAll();
        showToast(`Копия загружена в ${seasonLabel(state)}`);
      },
      { title: 'Восстановить из копии', confirmText: 'Загрузить' }
    );
    return;
  }
  showAlert('Файл не подходит', 'Это не резервная копия G8 Tracker.');
}


// ── Print / PDF ───────────────────────────────────────────────────────────────
function populatePrintArea() {
  const area = document.getElementById('print-area');
  const now = new Date();
  const dateStr = now.toLocaleString('ru', { dateStyle: 'short', timeStyle: 'short' });
  document.title = `G8 Tracker — ${seasonLabel(state)} — ${now.toLocaleDateString('ru', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;
  let total = 0, done = 0, overdue = 0;
  state.blocks.forEach(b => b.directions.forEach(d => d.tasks.forEach(t => {
    total++; if (t.status === 'done') done++; if (isOverdue(t)) overdue++;
  })));
  const order = t => isOverdue(t) ? 0 : ({ 'in-progress': 1, todo: 2, done: 3 }[t.status] ?? 2);
  let html = `<header class="pr-header">
    <span class="pr-logo">G8</span><span class="pr-word">TRACKER</span>
    <span class="pr-season">${esc(seasonLabel(state))}</span>
    <span class="pr-meta">${done} из ${total} готово${overdue ? ` · <b>${overdue} просрочено</b>` : ''} · ${esc(dateStr)}</span>
  </header>`;
  state.blocks.forEach(b => {
    const color = blockColorOf(b);
    const c = getBlockColors(color);
    const prog = blockProgress(b);
    html += `<section class="pr-block">
      <div class="pr-block-head"><span class="pr-block-label" style="background:${color};color:${c.text}">${esc(b.title || 'Без названия')}</span>${prog ? `<span class="pr-count">${prog.done} из ${prog.total}</span>` : ''}</div>`;
    b.directions.forEach(d => {
      const dn = d.tasks.filter(t => t.status === 'done').length;
      html += `<div class="pr-dir"><div class="pr-dir-head"><span class="pr-dir-title">${esc(d.title || '(без названия)')}</span><span class="pr-count">${dn} из ${d.tasks.length}</span></div>`;
      if (!d.tasks.length) html += `<div class="pr-empty">Нет задач</div>`;
      [...d.tasks].sort((a, z) => order(a) - order(z)).forEach(t => {
        const od = isOverdue(t);
        const log = t.log || [];
        const last = log[log.length - 1];
        const meta = [];
        if ((t.responsible || []).length) meta.push(esc(t.responsible.join(', ')));
        if (t.deadline) meta.push(od ? `<span class="pr-od">просрочено · ${esc(formatDate(t.deadline))}</span>` : `до ${esc(formatDate(t.deadline))}`);
        html += `<div class="pr-task st-${t.status}${od ? ' is-overdue' : ''}">
          <span class="pr-dot"></span>
          <div class="pr-task-body">
            <div class="pr-task-line"><span class="pr-task-text">${esc(t.text || '(без текста)')}</span><span class="pr-status">${od ? 'просрочено' : (STATUS_LABELS[t.status] || '')}</span></div>
            ${meta.length ? `<div class="pr-task-meta">${meta.join(' · ')}</div>` : ''}
            ${last ? `<div class="pr-note">${esc((last.date || '').split(' ')[0])} — ${esc(last.text)}${log.length > 1 ? ` (заметок: ${log.length})` : ''}</div>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</section>`;
  });
  if (!state.blocks.length) html += `<div class="pr-empty">В сезоне нет блоков.</div>`;
  area.innerHTML = html;
}

window.addEventListener('beforeprint', () => {
  const area = document.getElementById('print-area');

// ── Сезоны ────────────────────────────────────────────────────────────────────
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function seasonLabel(s) {
  const name = String((s && s.name) || '').trim();
  return name.toLowerCase().startsWith('сезон') ? name : `Сезон ${name}`;
}
function sortedSeasons() {
  return [...db.seasons].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ru', { numeric: true }));
}
function seasonStats(s) {
  let dirs = 0, tasks = 0;
  s.blocks.forEach(b => { dirs += b.directions.length; b.directions.forEach(d => { tasks += d.tasks.length; }); });
  return { blocks: s.blocks.length, dirs, tasks };
}
function renderSeasonPill() {
  const el = document.getElementById('season-pill-label');
  if (el) el.textContent = seasonLabel(state);
  document.getElementById('season-pill')?.setAttribute('title', seasonLabel(state));
}
function isSeasonMenuOpen() { return !!document.getElementById('season-wrap')?.classList.contains('open'); }
function toggleSeasonMenu() { isSeasonMenuOpen() ? closeSeasonMenu() : openSeasonMenu(); }
function openSeasonMenu() {
  closeExportMenu();
  closeColorPalette();
  renderSeasonMenu();
  document.getElementById('season-wrap').classList.add('open');
  document.getElementById('season-pill').setAttribute('aria-expanded', 'true');
}
function closeSeasonMenu(restoreFocus) {
  const wrap = document.getElementById('season-wrap');

  wrap.classList.remove('open');

}
function renderSeasonMenu() {
  const menu = document.getElementById('season-menu');

  const only = db.seasons.length <= 1;
  menu.innerHTML = `
    <div class="season-menu-head">Сезоны</div>

    ${sortedSeasons().map(s => {
      const cur = s.id === state.id;
      const st = seasonStats(s);

        <button type="button" class="season-item-main" role="menuitemradio" aria-checked="${cur}" onclick="switchSeason('${s.id}')">

          <button type="button" class="season-icon-btn danger${only ? ' is-disabled' : ''}" aria-disabled="${only}" title="${only ? 'Единственный сезон удалить нельзя' : 'Удалить сезон'}" aria-label="Удалить: ${esc(seasonLabel(s))}" onclick="deleteSeason('${s.id}')">${ICONS.trash}</button>
        </span>
      </div>`;
    }).join('')}
    </div>
    <button type="button" class="season-new-btn" onclick="openNewSeasonDialog()">${ICONS.plus}<span>Новый сезон</span></button>`;
}

function switchSeason(id) {
  const next = db.seasons.find(s => s.id === id);
  closeSeasonMenu();
  if (!next || next === state) return;
  const prevBlock = selectedNav && state.blocks.find(b => b.id === selectedNav.blockId);
  const prevDir = prevBlock && prevBlock.directions.find(d => d.id === selectedNav.dirId);
  state = next;
  lsSet(SEASON_KEY, state.id);
  expandedTasks.clear();
  openHistories.clear();
  hideToast();
  closeColorPalette();
  restoreNav();
  if (!navMap[state.id] && prevDir) {
    // впервые открытый сезон: показываем то же направление, если оно есть (по названиям)
    const same = (a, b) => normText(a).trim() === normText(b).trim();
    const nb = state.blocks.find(b => same(b.title, prevBlock.title));
    const nd = nb && nb.directions.find(d => same(d.title, prevDir.title));
    if (nd) selectedNav = { blockId: nb.id, dirId: nd.id };
  }
  saveNav();
  if (filter.responsible !== 'all' && !getAllResponsibles().includes(filter.responsible)) {
    filter.responsible = 'all';
    syncFilterReset();
  }
  renderAll();
  const rp = document.getElementById('right-panel');
  if (rp) rp.scrollTop = 0;
}

function suggestSeasonName() {
  const years = db.seasons.map(s => String(s.name).trim()).filter(n => /^\d{4}$/.test(n)).map(Number);
  let n = years.length ? Math.max(...years) + 1 : new Date().getFullYear() + 1;
  while (validateSeasonName(String(n))) n++;
  return String(n);
}
function validateSeasonName(name, exceptId) {
  if (!name) return 'Введите год или название сезона';
  if (name.length > 40) return 'Название не длиннее 40 символов';
  const key = n => normText(n).trim().replace(/^сезон\s+/, '');
  if (db.seasons.some(s => s.id !== exceptId && key(s.name) === key(name))) return 'Такой сезон уже есть';
  return '';
}
function copyStructure(blocks) {
  return blocks.map(b => ({
    id: genId(), title: b.title, collapsed: b.collapsed, color: b.color,
    directions: b.directions.map(d => ({ id: genId(), title: d.title, description: d.description || '', collapsed: d.collapsed, tasks: [] }))
  }));
}

function openRenameSeasonDialog(id) {

  closeSeasonMenu();
  openModal({
